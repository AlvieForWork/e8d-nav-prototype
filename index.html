<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>E8D 後台導覽結構原型</title>
<style>
  :root {
    /* ===== E8D Design System tokens ===== */
    --bg: #FCF8F2;           /* 實驗值：暖米白，非 E8D 現有 token */
    --surface: #FFFFFF;      /* color/bg/surface */
    --surface-2: #F3EDE4;    /* 實驗值：暖灰，取代原本偏藍的 neutral/100 */
    --border: #E7E0D5;       /* 實驗值：暖灰邊框，取代原本偏藍的 neutral/200 */
    --border-hover: #CBBFB4; /* color/border/hover · neutral/300，2026-08-11 從 Figma Select 元件抓的，這檔案之前沒有這個 token */
    --text: #2C2324;         /* 實驗值：暖黑，取代原本偏藍的 neutral/700 */
    --text-muted: #79706A;   /* 實驗值：暖中灰，取代原本偏藍的 neutral/500 */
    --text-disabled: #A79E97;/* 實驗值：暖淺灰，取代原本偏藍的 neutral/400 */
    --accent: #FF6416;       /* color/bg/primary · primary/700 */
    --accent-hover: #FB5C13; /* primary/800 */
    --accent-active: #F04D0A;/* primary/900 */
    --accent-contrast: #FFFFFF; /* color/text/on-brand */
    --accent-soft: #FFEADE;  /* primary/75 · bg/selected 同款淡橘 */
    /* 狀態文字色（2026-08-17 為 toast 的兩種狀態新增）。
       ⚠️ 全檔還有 20+ 處把這兩個值硬填成色碼（.state-ok／.state-fail／.err-msg／
       badge-dot…），那是既有狀況，這次刻意不一起改（純顏色收斂是獨立一件事，
       會動到二十幾個選擇器）。新程式碼請用這兩個 token，不要再硬填。 */
    --text-success: #0C9D61; /* color/text/success · success/700 */
    --text-error: #EC2D30;   /* color/text/error · error/700 */
    /* Switch 軌道（2026-08-17 新增）——⚠️ 設計系統缺口：Figma 至今沒有 Switch 元件，
       所以沒有現成的「軌道灰」token 可用。這兩個是語意 alias，值全部指向既有 token，
       沒有硬填任何新色碼：
         off      → neutral/400（＝ --text-disabled 的同一個值，但語意無關，只是借值）
         disabled → neutral/100（＝ --surface-2）
       關閉態刻意取 400 而不是 300：400 對白底卡片的對比約 2.3（原本的 neutral/100 只有 1.06，
       那才是它看起來像 disabled 的原因），且和 disabled 用的 100 之間隔了三階、拉得開。
       ⚠️ 正式收進設計系統時要建立自己的 semantic token（例如 color/bg/switch-track 與
       -disabled，各自指向 neutral/400 與 neutral/100），不要繼續借 --text-disabled。 */
    --switch-track-off: var(--text-disabled);
    --switch-track-disabled: var(--surface-2);
    --phase2: #FE9B0E;       /* color/text/warning */
    --phase2-soft: #FFF7E1;  /* color/bg/warning */
    --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-full: 999px;
    /* 儀表板卡片專用：仿 Horizon UI 的大圓角＋柔擴散陰影（比 E8D 設計系統定案的 12px 上限大） */
    --radius-xl: 20px;
    --shadow-card: 0 18px 40px rgba(44,35,36,.07), 0 2px 8px rgba(44,35,36,.04);
    --shadow-sm: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --shadow-md: 0 4px 8px rgba(16,24,40,.06), 0 2px 4px rgba(16,24,40,.04);
    --shadow-lg: 0 12px 28px rgba(16,24,40,.14), 0 4px 10px rgba(16,24,40,.08);
    --shadow: var(--shadow-md); /* 沿用既有變數名稱，映射到 md 供 popover 使用 */
    --font-ui: "Inter", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
    /* ===== Type Scale（2026-08-12，驗證用——官方設計系統的六階，之前沒畫面時訂的 28/20/16/14/13/12，
       現在依實際介面往上調。先在這個檔案（登入後平台／組織與子帳號模組）套用驗證，Alvie 看過畫面
       確認 OK 才會回寫 Figma。命名沿用 --fs-*／--fw-* 這個檔案既有的變數風格（跟 auth-tokens.css
       同一套慣例），新增 --lh-* 做行高，三者成套、同一階的 size/line-height/weight 綁在一起用。
       字重只保留 Regular/Medium/Bold 三個六階會用到的，既有其他地方寫死的 500/600/700 不受影響、
       這次沒有全面盤點/取代非六階範圍的 font-weight（範圍照 Alvie 指示只做 font-size+行高） */
    --fs-display: 30px; --lh-display: 40px; /* Display・頁面主標題、KPI 大數字 */
    --fs-heading: 22px; --lh-heading: 30px; /* Heading・卡片/區塊標題 */
    --fs-subhead: 18px; --lh-subhead: 26px; /* Subhead・抽屜/對話框標題、次級標題 */
    --fs-body:    16px; --lh-body:    26px; /* Body・主要內文、表格內容、表單文字，介面預設 */
    --fs-small:   14px; --lh-small:   22px; /* Small・次要文字、按鈕、導覽項目 */
    --fs-caption: 13px; --lh-caption: 18px; /* Caption・標籤、表頭、輔助說明、徽章 */
    /* 2026-08-13 新增第七階 Body Large：介於 Body(16) 與 Small(14) 之間。
       起因是表格表頭——13(caption) 太小、14(small) 還是偏小、16(body) 會把欄寬吃掉導致
       E-mail 換行，Alvie 逐一比較後選 15px 並決定正式收進系統。命名取尺寸語意（不叫
       table-head）因為它未來不限於表頭。行高 24px 照級距比例（不是沿用 Small 的 22）。
       ⚠️ Figma Text Styles 也要同步新增 `E8D/Body Large` 才算完成 */
    --fs-body-lg: 15px; --lh-body-lg: 24px;
    --fw-regular: 400;
    --fw-medium:  500;
    --fw-bold:    700;
    /* ===== Spacing（2026-08-13，直接對齊 Figma「E8D Sizing」collection 的 7 階）=====
       ⚠️ 這 7 個值不是我訂的，是 Figma Foundations 早就定義好的 Spacing scale，
       這裡只是把它搬進程式碼。**Figma 是唯一真實來源，要改階梯請先改 Figma。**
       Figma Dev Mode 的 code syntax 是 `--e8d-spacing-*`，這個檔案沿用既有慣例
       省略 `e8d-` 前綴（跟現有的 --radius-* 一致）；交付給工程師時要決定是否補回前綴。

         xs   4px   圖示與文字間距、緊湊元素內距
         sm   8px   小元件內距、標籤與元素間距
         md  12px   按鈕內距、表單元素間距
         lg  16px   卡片內距、欄位間距（常用基準）
         xl  24px   卡片之間、區塊內間距
         2xl 32px   主要區塊分隔、頁面內距
         3xl 48px   頁面區段之間、大留白                                        */
    --spacing-xs: 4px;
    --spacing-sm: 8px;
    --spacing-md: 12px;
    --spacing-lg: 16px;
    --spacing-xl: 24px;
    --spacing-2xl: 32px;
    --spacing-3xl: 48px;
    /* 語意層：沿用專案 color 的 primitive→semantic 分層做法，讓呼叫端讀得出「為什麼是這個距離」。
       ⚠️ 一律指向上面的 primitive，不要在這裡寫死 px。
       （2026-08-13 修正：這三個原本是我自己發明的 12/24/32，沒對到 Figma 既有的 7 階，已改成 alias） */
    --space-tight: var(--spacing-md);      /* 附屬關係：批次操作列 → 它下方的表格 */
    --space-block: var(--spacing-xl);      /* 一般區塊之間 —— 預設用這個 */
    --space-section: var(--spacing-2xl);   /* 頁面標題區塊 → 內容，層級最大的一刀 */
    /* chart 進場動畫：時長／easing 統一由這兩個 token 控制，不要各 chart 各自寫死 */
    --chart-anim-duration: 700ms;
    --chart-anim-easing: ease-out;
    /* KPI 數字 count-up 專用（1-1.5s 區間內，比 chart 進場動畫慢，數字用同一顆 ease-out） */
    --kpi-anim-duration: 1200ms;
    /* 側邊選單互動動畫（2026-08-03 對齊 TailAdmin 實測值）：
       箭頭旋轉 200ms、子選單展開 300ms，兩者共用 Tailwind 的標準 easing。
       箭頭比展開快一點，先轉完再等內容拉開，順序感才對 */
    --nav-chev-duration: 200ms;
    --nav-chev-easing: cubic-bezier(0.4, 0, 0.2, 1);
    --nav-submenu-duration: 300ms;
    --nav-submenu-easing: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    font-size: var(--fs-body); /* Body・介面預設，2026-08-12 從 14 調到 16 */
    line-height: var(--lh-body);
  }
  button { font-family: inherit; font-size: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 2026-08-14：min-height → height + overflow:hidden。
     原本用 min-height 的話，右側表格一長，整個 shell 就跟著長高，左右兩欄共用同一個
     文件流：側欄被撐成跟文件一樣高，帳號卡的 margin-top:auto 就被推到整份文件的最底部
     （Alvie 反映「帳號卡跟著表格跑到頁面最下面」）。鎖成一個視窗高之後，
     .sidebar 與 .content 各自的 overflow-y:auto 才會真正生效、變成兩條獨立的捲軸 */
  .shell { display: flex; height: 100vh; overflow: hidden; position: relative; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 264px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    /* 側欄本身不捲：捲動的是裡面的 .nav-scroll，帳號卡固定釘在欄底 */
    overflow: hidden;
    transition: width .12s ease-out;
  }
  .sidebar.collapsed {
    width: 0; min-width: 0; border-right: none; overflow: hidden;
  }
  .sidebar-brand {
    height: 68px;
    display: flex;
    align-items: center;
    padding: 0 22px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  /* 選單區吃掉剩餘高度並自己捲動（min-height:0 才縮得下去）；
     選單項目多到超過一個視窗時，捲的是這一區，帳號卡不會被推走 */
  .nav-scroll { padding: 16px 14px 20px; display: flex; flex-direction: column; gap: 4px;
    flex: 1; min-height: 0; overflow-y: auto;
    transition: opacity .08s ease; }
  /* 選單項目與展開的子選單一律不壓縮：空間不夠時要讓 .nav-scroll 出現捲軸，
     而不是把每一項擠扁。少了這行，展開的子選單會從 148px 被壓成 81px，
     最後一項（操作紀錄）直接看不見 */
  .nav-scroll > * { flex-shrink: 0; }
  /* flex-shrink: 0 — 側欄高度不夠時不准壓縮帳號卡。
     少了它，帳號卡會被 flex 擠扁，卡片 overflow:hidden 會把底部的「儲值」鈕裁掉 */
  .points-card { flex-shrink: 0; transition: opacity .08s ease; }
  .sidebar.collapsed .nav-scroll,
  .sidebar.collapsed .points-card { opacity: 0; }

  /* ---------- topbar 品牌區（收合鈕常駐；logo＋分隔線只在側欄收合時才出現） ---------- */
  .topbar-brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .brand-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
  .topbar-brand .brand-logo,
  .topbar-brand .brand-divider { display: none; }
  .shell.sidebar-collapsed .topbar-brand .brand-logo { display: block; }
  .shell.sidebar-collapsed .topbar-brand .brand-divider { display: block; }
  .sidebar-toggle {
    width: 44px; height: 44px; border-radius: var(--radius-md); border: none; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted);
    flex-shrink: 0;
  }
  .sidebar-toggle:hover { background: var(--surface-2); color: var(--text); }
  .sidebar-toggle .ico { width: 21px; height: 21px; }

  .nav-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-md);
    border: none;
    background: transparent;
    text-align: left;
    cursor: pointer;
    color: var(--text);
    transition: background .12s ease;
  }
  .nav-row:hover { background: var(--accent-soft); }
  .nav-row.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-row .ico { flex-shrink: 0; width: 18px; height: 18px; opacity: .85; }
  .nav-row.active .ico { opacity: 1; }
  .nav-row .label { flex: 1; font-size: var(--fs-body); line-height: var(--lh-body); }
  /* 預設指下（暗示點了會往下展開），展開後轉 180 度變指上（暗示點了會收合回去）——
     跟子項目往下展開的方向一致，不是 360 度繞一圈的裝飾轉場 */
  .nav-row .chev { width: 14px; height: 14px; flex-shrink: 0; opacity: .55; transition: transform var(--nav-chev-duration) var(--nav-chev-easing); }
  .nav-row[aria-expanded="true"] .chev { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) {
    .nav-row .chev { transition: none; }
    .nav-group-wrap { transition: none; }
  }
  .nav-row .ext-mark { width: 12px; height: 12px; opacity: .5; flex-shrink: 0; }

  /* 互動回覆簡訊（TalkOD）品牌 logo：實心＋漸層天生比 18px 線稿 icon 重，
     跟下面那排線性 icon 用同一個 18×18 格子對齊、不特別放大，
     視覺分量已經靠顏色/實心自然比周圍重，不需要再加尺寸 */
  .nav-row .nav-logo { flex-shrink: 0; width: 18px; height: 18px; }
  /* 獨立產品入口跟下面的平台功能群組分兩塊：一條細線，顏色跟其他分隔線同一個 token */
  .nav-divider { height: 1px; background: var(--border); margin: 8px 4px; flex-shrink: 0; }

  /* 子選單外層：高度 0 ↔ 內容高度做展開動畫。
     高度值由 JS 量 scrollHeight 後寫成 inline style（CSS 沒辦法對 auto 做 transition）。
     ⚠️ 這層一直存在於 DOM，收合時只是高度 0 —— 之前是「展開才塞進 DOM」，
     瀏覽器拿到的是全新節點、沒有前一個值可以補間，動畫永遠不會跑 */
  .nav-group-wrap {
    height: 0;
    overflow: hidden;
    transition: height var(--nav-submenu-duration) var(--nav-submenu-easing);
  }

  .nav-group-children {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 4px 0 8px 14px;
    margin-left: 15px;
    border-left: 1px solid var(--border);
  }
  .nav-child {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: var(--radius-md);
    border: none;
    background: transparent;
    text-align: left;
    cursor: pointer;
    color: var(--text-muted);
    font-size: var(--fs-body); line-height: var(--lh-body);
  }
  .nav-child:hover { background: var(--accent-soft); color: var(--text); }
  .nav-child.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-child .label { flex: 1; }
  .p2-badge {
    font-size: var(--fs-caption);
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--phase2);
    background: var(--phase2-soft);
    padding: 1px 5px;
    border-radius: var(--radius-sm);
    flex-shrink: 0;
  }

  /* ---------- 側欄點數卡（全域元件） ---------- */
  /* 漸層定案（2026-07-28）：D 版 mesh — feralui 的 radial mesh 結構 + E8D primary 色階，
     淺點 #FFF1CF／#FFC08E、主色橘 #FF6416、底色 #F9935C；文字沿用 --text（neutral/700 暖黑）*/
  .points-card {
    position: relative;
    overflow: hidden;
    margin: auto 14px 16px;
    border-radius: var(--radius-lg);
    background: #F9935C;
    color: var(--text);
    padding: 18px 18px 16px;
    box-shadow: var(--shadow-lg);
  }
  .points-card > * { position: relative; z-index: 2; }
  .points-card::before {
    content: ''; position: absolute; inset: -14px; z-index: 1; pointer-events: none;
    background:
      radial-gradient(66% 50% at 6% 6%, #FFF1CF 0%, #FFF1CF 16%, #FFF1CF00 66%),
      radial-gradient(58% 64% at 94% 14%, #FFC08E 0%, #FFC08E00 70%),
      radial-gradient(88% 78% at 40% 104%, #FF6416 0%, #FF6416 26%, #FF641600 76%),
      radial-gradient(130% 120% at 30% 20%, #F9935C, #F9935C);
    filter: blur(7px);
  }
  .points-card .pc-silk {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(114deg,
      rgba(255,255,255,0) 18%, rgba(255,255,255,.62) 28%,
      rgba(255,255,255,.12) 35%, rgba(255,255,255,0) 42%);
  }
  .points-card .pc-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding-bottom: 10px; margin-bottom: 10px;
    border-bottom: 1px solid rgba(44,35,36,.16);
  }
  .points-card .pc-name { font-weight: 700; font-size: var(--fs-small); line-height: var(--lh-small); }
  .points-card .pc-plan {
    font-size: var(--fs-caption); font-weight: 700; letter-spacing: .02em;
    background: rgba(44,35,36,.12); padding: 2px 9px; border-radius: 999px;
  }
  .points-card .pc-label {
    display: flex; align-items: center; gap: 5px;
    font-size: var(--fs-caption); color: rgba(44,35,36,.72); margin-bottom: 2px;
  }
  .points-card .pc-label .ico { width: 12px; height: 12px; opacity: .7; }
  .points-card .pc-value { font-size: var(--fs-heading); line-height: var(--lh-heading); font-weight: 700; margin-bottom: 10px; }
  .points-card .pc-value .unit { font-size: var(--fs-caption); font-weight: 500; opacity: .7; margin-left: 3px; }
  .points-card .pc-usage-row {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: var(--fs-caption); font-weight: 500; margin-bottom: 5px; color: rgba(44,35,36,.75);
  }
  .points-card .pc-usage-row .num { font-variant-numeric: tabular-nums; }
  .points-card .pc-bar {
    height: 5px; border-radius: 999px; background: rgba(44,35,36,.18);
    overflow: hidden; margin-bottom: 12px;
  }
  .points-card .pc-bar span { display: block; height: 100%; width: 62%; border-radius: 999px; background: #fff; }
  .points-card .pc-topup {
    position: relative;
    width: 100%; padding: 9px 0; border-radius: var(--radius-md);
    border: none; background: #fff;
    color: var(--accent); font-weight: 700; font-size: var(--fs-small); line-height: var(--lh-small); cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.10);
    overflow: hidden;
  }
  .points-card .pc-topup span { position: relative; z-index: 2; }
  .points-card .pc-topup::before {
    content: ""; position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: #FFF4EC;
    transition: left .35s ease;
  }
  .points-card .pc-topup:hover::before { left: 0; }
  .points-card .pc-topup:active { transform: scale(.94); }


  /* ---------- Topbar ---------- */
  /* min-height: 0 — 讓 .content 這個 flex 子項可以縮到比內容小，內部捲軸才成立
     （flex item 預設 min-height:auto 會頂住內容高度，捲軸會失效） */
  .main-col { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 68px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    gap: 12px;
  }
  .topbar-actions { display: flex; align-items: center; gap: 6px; position: relative; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: var(--radius-md); border: none; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted);
    position: relative;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn .ico { width: 21px; height: 21px; }
  .avatar-btn {
    width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--accent-contrast);
    border: none; display: flex; align-items: center; justify-content: center; font-size: var(--fs-small); font-weight: 700;
    cursor: pointer; margin-left: 8px;
  }
  .popover {
    position: absolute; top: 50px; right: 0; width: 240px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
    padding: 12px 14px; font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-muted); z-index: 20; display: none;
  }
  .popover.open { display: block; }
  .popover .t { color: var(--text); font-weight: 600; font-size: var(--fs-caption); margin-bottom: 4px; }
  .popover button.logout {
    margin-top: 8px; width: 100%; padding: 7px 0; border-radius: var(--radius-md); border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); cursor: pointer; font-size: var(--fs-caption);
  }
  .popover button.logout:hover { background: var(--bg); }

  /* ---------- Content ---------- */
  .content { flex: 1; overflow-y: auto; padding: 32px 40px 48px; }
  .proto-note {
    display: flex; gap: 10px; align-items: flex-start; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 18px; margin-bottom: 28px;
    font-size: var(--fs-caption); color: var(--text-muted); max-width: 640px;
  }
  .proto-note .ico { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; color: var(--accent); }
  .proto-note b { color: var(--text); }

  .page-head { display: flex; align-items: center; gap: 10px; margin-bottom: var(--space-section); flex-wrap: wrap; }
  .page-head h1 { font-size: var(--fs-display); line-height: var(--lh-display); font-weight: 700; margin: 0; text-wrap: balance; }
  .page-sub { font-size: var(--fs-small); line-height: var(--lh-small); color: var(--text-muted); margin: 8px 0 var(--space-section); }
  /* 標題與它自己的副標之間維持原本的 18px，不跟著放大——放大的是「標題區塊 → 內容」，
     副標屬於標題區塊的一部分。這裡把 h1 的下距壓回 18px，讓 --space-section 只作用在
     副標下方（沒有副標時就直接作用在 .page-head 下方，兩種情況的結果一致） */
  .page-head:has(+ .page-sub) { margin-bottom: 18px; }

  .tabbar { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: var(--space-block); flex-wrap: wrap; }
  .tab {
    padding: 11px 16px; font-size: var(--fs-body); color: var(--text-muted); background: none; border: none;
    border-bottom: 2px solid transparent; cursor: pointer; margin-bottom: -1px; white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  /* 2026-08-13：margin-top 從 -6px 改 0——這個負值會把上方標題區的 --space-section
     吃掉 6px，害「儲值」頁（唯一 detail-note 直接接在標題下的頁面）變成 26px、
     跟其他 14 頁的 32px 不一致 */
  .detail-note {
    font-size: var(--fs-caption); color: var(--text-muted); margin: 0 0 18px; max-width: 640px;
  }

  .flag-note {
    display: flex; gap: 8px; align-items: flex-start; background: var(--phase2-soft);
    border: 1px solid color-mix(in srgb, var(--phase2) 30%, transparent);
    border-radius: var(--radius-md); padding: 10px 12px; margin: 0 0 18px; font-size: var(--fs-caption); color: var(--text);
    max-width: 640px;
  }
  .flag-note .ico { width: 15px; height: 15px; color: var(--phase2); flex-shrink: 0; margin-top: 1px; }

  .placeholder-card {
    border: 1.5px dashed var(--border); border-radius: var(--radius-lg); padding: 32px 24px; text-align: center;
    color: var(--text-muted); font-size: var(--fs-small); line-height: var(--lh-small); background: var(--surface); max-width: 640px;
  }
  .placeholder-card .big { font-size: var(--fs-subhead); line-height: var(--lh-subhead); color: var(--text); font-weight: 600; margin-bottom: 6px; }

  /* ---------- 總覽儀表板（2026-07-28 定案：TailAdmin/Horizon 版面結構 + E8D token） ---------- */
  /* 12 欄統一格線：兩列都在同一個 1180px 寬度內，且在第 6 欄對齊 —
     上列 = 統計 3 + 統計 3 + 合約 6，下列 = 趨勢圖 6 + 長條圖 6 */
  .dash-grid {
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px;
    max-width: 1180px; align-items: stretch;
  }
  .dash-grid > .span-3 { grid-column: span 3; }
  .dash-grid > .span-6 { grid-column: span 6; }
  @media (max-width: 1100px) {
    .dash-grid > .span-3 { grid-column: span 6; }
    .dash-grid > .span-6 { grid-column: span 12; }
  }
  @media (max-width: 600px) { .dash-grid > .span-3 { grid-column: span 12; } }

  .stat-card {
    background: var(--surface); border-radius: var(--radius-xl); padding: 22px 24px;
    box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; justify-content: space-between;
    /* 2026-08-14：卡片內是「圖示貼上緣、數字貼下緣」，中間那段呼吸空間是被撐出來的，
       所以高度會跟著同列最高的卡片跑——合約摘要卡切到「無合約」少一行就縮到 204，
       KPI 卡跟著縮，那段空間歸零、圖示直接黏著文字。給一個地板值讓它不隨鄰居忽高忽低。
       240 取自「有合約」時的實際高度(242)並收進 4px grid；比 1280 的自然高度(244)小，
       所以窄螢幕不受影響、不會硬撐出多餘空白 */
    min-height: 240px;
  }
  .stat-card .s-icon {
    width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0;
  }
  .stat-card .s-icon .ico { width: 22px; height: 22px; }
  .stat-card .s-label { font-size: var(--fs-caption); color: var(--text-muted); margin-bottom: 10px; }
  .stat-card .s-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .stat-card .s-value { font-size: var(--fs-display); font-weight: 700; color: var(--text); line-height: var(--lh-display); }
  .stat-card .s-delta { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-caption); font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .stat-card .s-delta.up { color: #0C9D61; background: #E5F5EC; }
  .stat-card .s-delta.down { color: #EC2D30; background: #FFEBEE; }
  .stat-card .s-delta .ico { width: 10px; height: 10px; }
  .stat-card .s-compare { font-size: var(--fs-caption); color: var(--text-muted); margin-top: 8px; }
  /* 1366 以下：「本月總發送量」的 12,480 加上漲跌徽章，實測只差 1px 就會把徽章擠到下一行，
     變成兩張 KPI 卡一張同行、一張換行（Alvie 2026-08-14 指出）。收緊 gap（10→8，順便回到
     4px grid）與徽章左右內距，把那 1px 讓出來，窄螢幕兩張卡才會長得一樣。
     ⚠️ 只在 1366 以下套用——1440 是主要驗收寬度，那裡空間有 37px 餘裕、不需要動，
     KPI 卡在 1440 維持與 commit 6161b67 完全相同的規格 */
  @media (max-width: 1366px) {
    .stat-card .s-row { gap: var(--spacing-sm); }
    .stat-card .s-delta { padding: 3px 6px; }
  }

  .chart-card { background: var(--surface); border-radius: var(--radius-xl); padding: 24px 24px 20px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; }
  .chart-card .cc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .chart-card h3 { font-size: var(--fs-subhead); line-height: var(--lh-subhead); font-weight: 700; color: var(--text); margin: 0; }
  .chart-card .cc-sub { font-size: var(--fs-caption); color: var(--text-muted); margin-top: 3px; }

  .chart-period-tabs { display: flex; gap: 2px; background: var(--surface-2); border-radius: var(--radius-md); padding: 3px; flex-shrink: 0; }
  .chart-period-tabs button {
    border: none; background: none; padding: 6px 12px; font-size: var(--fs-small); font-weight: 600;
    color: var(--text-muted); border-radius: 6px; cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .chart-period-tabs button.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }

  .chart-wrap { position: relative; margin-top: 16px; flex: 1; display: flex; align-items: center; }
  .chart-wrap svg { display: block; width: 100%; flex: 1; height: auto; overflow: visible; }
  .chart-wrap text { font-family: var(--font-ui); }
  .chart-axis-label { font-size: var(--fs-caption); fill: var(--text-muted); }
  .chart-grid line { stroke: var(--border); stroke-width: 1; }
  .chart-crosshair { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; }
  .chart-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; opacity: 0; pointer-events: none; }
  .chart-hit { fill: transparent; cursor: crosshair; }

  /* 進場動畫：線＋漸層是同一個 <g>（.chart-trend-shape），一起用 scaleY
     從基準線長到實際高度——線本身真的跟著長上來，不是只有漸層變化。
     用 @keyframes（不是 transition）——class 只在首次載入時由 JS 加上去，
     切換 tab 時 renderArea() 重建的新 SVG 不帶這個 class，預設就是完整態，不會播放。
     2026-07-31 修正：原本線用 stroke-dashoffset 左右畫出、area 用 scaleY 縱向長高，
     兩個方向不一致，線的動作太細微會被 area 蓋過去，看起來像「線沒動」。改成兩者
     包同一個 <g> 一起縱向長高 */
  .chart-trend-shape { transform-box: fill-box; transform-origin: bottom; }
  .chart-trend-shape.chart-anim-in {
    animation: chart-grow-trend var(--chart-anim-duration) var(--chart-anim-easing) both;
  }
  @keyframes chart-grow-trend {
    from { transform: scaleY(0); }
    to   { transform: scaleY(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .chart-trend-shape.chart-anim-in { animation: none; }
  }

  /* SMS/MMS 長條圖進場：每根 bar-mark（SMS＋MMS 一組）各自從基準線 scaleY 長高，
     全部同時開始（不做逐棒依序長高的演出），沿用發送趨勢圖同一組 token／同一個 keyframe */
  .bar-mark { transform-box: fill-box; transform-origin: bottom; }
  .bar-mark.chart-anim-in {
    animation: chart-grow-trend var(--chart-anim-duration) var(--chart-anim-easing) both;
  }
  @media (prefers-reduced-motion: reduce) {
    .bar-mark.chart-anim-in { animation: none; }
  }

  .chart-tooltip {
    position: absolute; pointer-events: none; z-index: 5; opacity: 0;
    background: var(--text); color: #fff; border-radius: 8px; padding: 8px 12px;
    font-size: var(--fs-caption); white-space: nowrap; box-shadow: var(--shadow-lg);
    transform: translate(-50%, calc(-100% - 14px)); transition: opacity .1s ease; left: 0; top: 0;
  }
  .chart-tooltip .tt-label { color: rgba(255,255,255,.68); font-size: var(--fs-caption); margin-bottom: 3px; }
  .chart-tooltip .tt-row { display: flex; align-items: center; gap: 6px; }
  .chart-tooltip .tt-row + .tt-row { margin-top: 3px; }
  .chart-tooltip .tt-key { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .chart-tooltip .tt-value { font-weight: 700; font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 10px; }

  .chart-legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .chart-legend .lg-item { display: flex; align-items: center; gap: 6px; font-size: var(--fs-caption); color: var(--text-muted); }
  .chart-legend .lg-key { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  .bar-mark { cursor: pointer; }
  .bar-mark path { transition: opacity .1s ease; }
  .bar-mark:hover path, .bar-mark:focus path { opacity: .78; }
  .bar-mark:focus { outline: none; }

  /* flex column：三張卡等高是前提，所以少一行的「費率摘要」版不能靠縮高度解決，
     改讓下方的費率列吸收多出來的空間（見 .contract-rows），底部才不會空一塊 */
  .contract-card {
    background: var(--surface); border-radius: var(--radius-xl); padding: 24px; box-shadow: var(--shadow-card);
    display: flex; flex-direction: column;
  }
  .contract-card h3 { font-size: var(--fs-subhead); line-height: var(--lh-subhead); font-weight: 700; margin: 0 0 6px; color: var(--text); }
  .contract-card .cc-sub { font-size: var(--fs-caption); color: var(--text-muted); margin: 0; }
  /* 標題區：左邊標題＋說明句，右邊「查看完整費率」，左右各據一端不會重疊。
     align-items: flex-start 讓連結貼齊標題那一行的上緣，不會被說明句往下拉 */
  .cc-head-row {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: var(--spacing-lg); margin-bottom: var(--spacing-lg);
  }
  .cc-head-row .cc-head-text { min-width: 0; }
  /* 費率列的容器：吃掉標題區以外的所有剩餘高度，再由各列平分。
     「合約摘要」有 3 列、剛好填滿，沒有剩餘空間可分，所以維持原樣不受影響；
     「費率摘要」只有 2 列，多出來的高度就被這兩列平均吸收，不會全擠在上半部 */
  .contract-rows { flex: 1; display: flex; flex-direction: column; }
  /* padding 10px→8px(sm)：刪掉「計費方式」那行之後順勢把列距收緊，卡片整體變矮。
     flex: 1 讓每一列等分容器高度；align-items: center 讓列變高時文字待在列的正中央
     （各列都是單行、同字級，在沒有多餘空間時 center 與原本的 baseline 結果相同） */
  .contract-row { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: var(--spacing-md); padding: var(--spacing-sm) 0; border-bottom: 1px solid var(--border); font-size: var(--fs-caption); }
  .contract-row:last-child { border-bottom: none; padding-bottom: 0; }
  .contract-row dt { margin: 0; color: var(--text-muted); }
  .contract-row dd { margin: 0; color: var(--text); font-weight: 600; text-align: right; }
  /* 單價列的級距標籤（「1–1,000 則」）：壓成輔助灰、不加粗，
     讓同一行右邊的價格是視覺主角。摘要卡只顯示第一級距，完整級距在詳情頁 */
  .contract-row dd .cr-range { font-weight: 500; color: var(--text-muted); margin-right: 8px; }
  /* 字級沿用站內文字連結按鈕 .btn-text 的規格（Body 16／600／accent），
     原本 13px(caption) 當按鈕太小。標題是 18px，兩者一左一右不會互搶 */
  .contract-link {
    flex-shrink: 0; white-space: nowrap; font-size: var(--fs-body); font-weight: 600;
    color: var(--accent); text-decoration: none; cursor: pointer; transition: color .12s ease;
  }
  .contract-link:hover { color: var(--accent-active); }


  .ext-card {
    display: flex; gap: 16px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 26px; max-width: 560px; box-shadow: var(--shadow-sm);
  }
  .ext-card .ico { width: 22px; height: 22px; color: var(--accent); flex-shrink: 0; margin-top: 2px; }
  .ext-card h2 { font-size: var(--fs-heading); line-height: var(--lh-heading); font-weight: 700; margin: 0 0 8px; }
  .ext-card p { margin: 0; font-size: var(--fs-small); line-height: var(--lh-small); color: var(--text-muted); }

  /* ============================================================
     組織與子帳號模組（2026-08-11）
     ------------------------------------------------------------
     這批樣式支援全站第一個「真的能操作」的模組（篩選/表格/抽屜/樹狀）。
     沿用既有卡片語言（surface + radius-xl + shadow-card），沒有另外發明新的圓角/陰影階。
     ============================================================ */

  /* ---- 通用按鈕（此檔案先前沒有按鈕元件，比照 E8D Button 規格：Primary/Secondary/Text/Danger-text） ---- */
  /* gap 6→8（--spacing-sm）：對齊 Figma Button 元件的 itemSpacing 8（2026-08-14 核對） */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--spacing-sm);
    height: 36px; padding: 0 16px; border-radius: var(--radius-md);
    font-family: var(--font-ui); font-size: var(--fs-body); font-weight: 600; cursor: pointer;
    border: 1px solid transparent; white-space: nowrap; flex-shrink: 0;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  /* 15→16：對齊 Figma Button（Medium 的 icon 是 16；Small 14／Large 18） */
  .btn .ico { width: 16px; height: 16px; }
  .btn-sm { height: 32px; padding: 0 12px; font-size: var(--fs-body); }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { background: var(--accent-active); }
  .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--text-disabled); background: var(--surface-2); }
  .btn-text { background: none; color: var(--accent); border: none; padding: 0; height: auto; font-size: var(--fs-body); font-weight: 600; cursor: pointer; transition: color .12s ease; }
  .btn-text:hover { color: var(--accent-active); } /* 2026-08-11：Alvie 不喜歡底線，改用深一階橘色（primary/900）表示 hover */
  .btn-danger-text { background: none; border: none; padding: 0; height: auto; color: #EC2D30; font-weight: 600; font-family: var(--font-ui); font-size: var(--fs-body); cursor: pointer; transition: color .12s ease; }
  .btn-danger-text:hover { color: #D8262B; } /* 2026-08-11：跟 .btn-text 同一次修正，拿掉底線改深一階紅（danger/800，跟 .btn-danger 的 hover 同一個色） */
  .btn-danger-text:disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }
  .btn-danger { background: #EC2D30; color: #fff; }
  .btn-danger:hover { background: #D8262B; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  /* ⚠️ 2026-08-14 修正：原本是 `.btn:disabled:hover { background: inherit }`，
     inherit 會去拿「父層」的背景（modal 是白底），所以橘色主按鈕一 hover 就變成
     白底白字、整顆看起來消失。disabled 的按鈕 hover／active 一律維持原本外觀，
     只靠 opacity .5 + not-allowed 游標表達「不能按」。 */
  .btn-primary:disabled:hover, .btn-primary:disabled:active { background: var(--accent); }
  .btn-secondary:disabled:hover, .btn-secondary:disabled:active { background: var(--surface); border-color: var(--border); }
  .btn-danger:disabled:hover, .btn-danger:disabled:active { background: #EC2D30; }

  /* ============================================================
     自訂 Dropdown（2026-08-11 第三輪，取代原本的原生 <select>）
     ------------------------------------------------------------
     原生 <select> 的展開選單完全是瀏覽器原生渲染，沒辦法套用任何自訂樣式，
     這就是「面板位置/樣式跟系統對不上」的根本原因，不是哪個下拉少寫了位移。
     改成 button 觸發 + fixed 定位面板，全站共用同一套引擎（見下方 script 的
     ddOpen/ddClose/positionDdPanel），樣式數值全部從 Figma「E8D · Select & Dropdown」
     頁（node 177:156／182:111）讀出來，不是自己配的：
     觸發框＝border var(--border)、hover 邊框 var(--border-hover)、focus 邊框
     var(--accent)+外部光暈 rgba(255,100,22,.16)；面板＝白底+邊框+陰影(E8D/Shadow/md
     實際 rgba 值)+4px 上下 padding；選項＝8px/12px padding、hover 底色 var(--bg)
     （Figma 定義的 bg/hover 實際上就是這個很淺的米白，不是本檔案原本另外在用的
     --surface-2，兩個是不同 token，之前搞混了）、選中態只有勾勾變橘色，文字顏色不變
     （這個「選中列文字沒對齊其他列」的視覺是 Figma 原始設計本來就這樣，照樣重現）。
     ============================================================ */
  .dd { position: relative; }
  .dd-trigger {
    display: flex; align-items: center; gap: 8px; width: 100%; height: 36px;
    padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-family: var(--font-ui); font-size: var(--fs-body); text-align: left;
  }
  .dd-trigger:hover { border-color: var(--border-hover); }
  .dd-trigger.is-open { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,100,22,.16); }
  .dd-trigger:disabled { background: var(--surface-2); color: var(--text-disabled); cursor: not-allowed; }
  .dd-trigger .dd-label { flex: 1 0 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); line-height: 22px; }
  .dd-trigger:disabled .dd-label { color: var(--text-disabled); }
  .dd-trigger .dd-chev { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; transition: transform .15s ease; }
  .dd-trigger.is-open .dd-chev { transform: rotate(180deg); }

  .dd-panel {
    position: fixed; z-index: 200; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 4px 0;
    box-shadow: 0 4px 8px -2px rgba(26,21,18,.1), 0 2px 4px -2px rgba(26,21,18,.06);
    max-height: 280px; overflow-y: auto;
    opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .12s ease, transform .12s ease;
  }
  .dd-panel.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .dd-item {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; box-sizing: border-box;
    border: none; background: none; cursor: pointer; text-align: left;
    font-family: var(--font-ui); font-size: var(--fs-body); color: var(--text); line-height: var(--lh-body);
  }
  .dd-item:hover { background: var(--bg); }
  /* 2026-08-17：勾位改成「固定寬度的空位」，選中與未選中的文字左邊界對齊在同一條線。
     原本未選中的列根本不輸出勾的節點，文字就往左跑，兩種列的左內距看起來不一致。
     空位寬度 = spacing-lg(16px) = .dd-check 的尺寸，勾出現時剛好填滿、不會推動文字。 */
  .dd-item .dd-tick { width: var(--spacing-lg); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
  .dd-item .dd-check { width: 16px; height: 16px; color: var(--accent); flex-shrink: 0; }

  /* ---- 篩選列（即時過濾，無查詢按鈕） ---- */
  /* margin-bottom 2026-08-13 從寫死的 16px 改綁 --space-block（24px）：
     查詢/操作列跟下方表格原本貼太近，且這個 16 跟其他區塊的 24／22／32 各自為政 */
  /* gap 10→12(md)：10px 不在 4px grid 上，是這個檔案第二常見的野生數字（26 處） */
  .filter-bar { display: flex; align-items: center; gap: var(--spacing-md); flex-wrap: wrap; margin-bottom: var(--space-block); }
  .filter-search { position: relative; flex: 1; min-width: 200px; max-width: 320px; }
  .filter-search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted); pointer-events: none; }
  .filter-search input {
    width: 100%; height: 36px; padding: 0 12px 0 36px; border-radius: var(--radius-md); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: var(--fs-body); line-height: var(--lh-body); font-family: var(--font-ui);
  }
  .filter-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .filter-bar .dd { width: 148px; }
  .filter-bar-spacer { flex: 1; }

  /* ---- DateRangePicker（2026-08-17）----
     這階段刻意用原生 <input type="date">，不手刻月曆面板。
     ⚠️ 已知取捨：原生日期欄位的外觀各瀏覽器不一致（Chrome 有日曆圖示、Safari 不同），
     沒辦法只靠 CSS 完全統一——這是選簡易做法的既定代價，也是未來要換自畫面板的主因。
     欄位樣式沿用 .filter-search input 那一組既有值（36px 高、radius-md、focus 橘框＋光暈），
     不另訂一套。 */
  .date-range { display: inline-flex; align-items: center; gap: var(--spacing-sm); }
  .date-range input[type="date"] {
    width: 148px; height: 36px; padding: 0 var(--spacing-md);
    border-radius: var(--radius-md); border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    font-size: var(--fs-body); line-height: var(--lh-body); font-family: var(--font-ui);
  }
  .date-range input[type="date"]:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .date-range input[type="date"]:disabled { background: var(--surface-2); color: var(--text-disabled); cursor: not-allowed; }
  .date-range .dr-sep { color: var(--text-muted); font-size: var(--fs-small); flex-shrink: 0; }

  /* ---- 部門篩選 chip 列（2026-08-13 取代原本左側的直立組織樹，企業管理員可見）----
     原本的 .org-tree 是 216px 寬的左側卡片，跟表格左右並排、吃掉主內容區 236px（含 gap）。
     實測：16 筆正常資料要完全不換行需要 1078px，但有樹的時候表格只剩 860px——
     差 218px，光調欄寬在數學上救不回來（套過完美比例，9 欄仍有 8 欄換行）。
     改成橫向 chip 列放在表格上方後，表格在 1440 拿到 1096px，剛好超過 1078px 的門檻。
     chip 列實測總寬 734px，1440／1280 都能單行放下，只吃約 40px 垂直、不搶水平空間。
     樹唯一的獨有價值「各部門帳號數一眼可見」由 chip 上的數字完整保留
     （頂部原本的「所有部門」下拉沒有數字、功能與樹完全重疊，已一併移除）。 */
  /* margin-bottom 2026-08-13 從 14px 加大到 24px（約 1.7 倍、落在 4px grid 上）：
     部門膠囊排與下方工具列排原本黏在一起，分不出是兩個獨立區塊。
     這個值同時決定「膠囊→工具列」（沒選部門時）與「膠囊→主管資訊列」（有選部門時）的距離，
     `.dept-context` 的 margin-bottom 也一起改成 24，維持主管那行上下等距（Alvie 前一輪的要求）。
     用 margin 不用 gap／固定高度，所以 chip 換行、視窗縮放時間距都不會跑掉。
     2026-08-13 二次調整：這個 24px 改綁 --space-block，跟其他區塊間距同一個來源 */
  .dept-chips { display: flex; flex-wrap: wrap; gap: var(--spacing-sm); margin-bottom: var(--space-block); }
  .dept-chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 14px; border-radius: var(--radius-full);
    border: 1px solid var(--border); background: var(--surface); cursor: pointer;
    font-size: var(--fs-small); line-height: var(--lh-small); color: var(--text); font-family: var(--font-ui);
    white-space: nowrap; transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .dept-chip:hover { background: var(--bg); border-color: var(--border-hover); }
  /* 選中狀態＝淡橘底＋橘框橘字，跟側欄 active、表格 hover 同一套語言 */
  .dept-chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .dept-chip .cnt { font-size: var(--fs-caption); color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .dept-chip.active .cnt { color: var(--accent); }
  .org-main { min-width: 0; }

  /* ---- 表格卡片 ---- */
  .table-card { background: var(--surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); overflow: hidden; }
  .data-table { width: 100%; border-collapse: collapse; font-size: var(--fs-body); line-height: var(--lh-body); }
  /* 表頭字級 2026-08-13 定案 15px：13→15→14→15→16 一路比較後，Alvie 判斷 15 跟 16 有差、
     選 15，並決定正式收進系統成為新的一階「Body Large」（--fs-body-lg，不叫 table-head，
     因為不限於表頭用途）。⚠️ 改這個字級一定要回頭重算欄寬（見 renderAccountsList 的欄寬註解） */
  .data-table th {
    text-align: left; font-size: var(--fs-body-lg); line-height: var(--lh-body-lg); font-weight: 700; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: .03em; padding: var(--spacing-md) var(--spacing-lg); border-bottom: 1px solid var(--border);
  }
  /* 2026-08-13：欄位變窄後 nowrap 表頭會橫向溢出、疊到隔壁欄標題（例如「所屬部門」疊到「角色」），
     改回允許換行——表頭折成兩行是常見、可接受的作法，跟本體資料換行是分開的兩件事 */
  .acct-table th, .dept-table th { white-space: normal; }
  /* 13px→12px(md)：13 是野生值，跟表頭的 12 差 1px 也沒有意義，一起收進 md */
  .data-table td { padding: var(--spacing-md) var(--spacing-lg); border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
  .data-table tr:last-child td { border-bottom: none; }
  /* 2026-08-11：hover 只給「整列可互動」的表格（帳號、部門），讀唯讀表格（權限總覽）不套 .is-interactive
     不會有 hover，避免使用者誤以為能點。色值照 Figma Table Row 元件的 Hover 狀態＝var(--bg)，
     比原本借用的 --surface-2 淺很多，也讓橘色操作連結在上面更容易辨識 */
  .data-table.is-interactive tbody tr:hover td { background: var(--bg); }
  /* 2026-08-12：拿掉 white-space:nowrap、row-actions 改可換行——這是最後一道防線：
     欄寬已經用百分比鎖死、理論上不會超出容器，但「編輯／刪除」文字連結萬一在極窄視窗
     真的擠不下，寧可讓它自己疊成兩行，也不要讓文字溢出把表格撐出橫向捲軸（那正是
     Alvie 反映的問題——操作欄被切出可視範圍） */
  .data-table .col-actions { text-align: right; }
  .data-table .row-actions { display: inline-flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 14px; }
  .data-table .muted { color: var(--text-muted); }
  .data-table .name-cell { font-weight: 600; }
  /* .num-cell：2026-08-13 起只剩部門表的「部門代碼／帳號數」在用（短、格式固定，
     不換行沒有代價）。員工編號／手機已經跟 Alvie 核對過改走 .wrap-cell 允許換行
     ——這兩欄之前為了蓋住刻意插入的極端值（TECH-2024-0012、海外門號）硬撐寬度，
     把姓名/帳號/E-mail 這些欄擠到過度換行，拿掉「絕對不換行」後空間才夠分 */
  .data-table .num-cell { font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- 狀態 badge（dot 版，沿用系統色票 hex，跟 .stat-card .s-delta 同一組） ---- */
  .badge-dot { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: var(--radius-full); font-size: var(--fs-caption); font-weight: 600; white-space: nowrap; }
  .badge-dot .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .badge-dot.is-active { background: #E5F5EC; color: #0C9D61; }
  .badge-dot.is-active .dot { background: #0C9D61; }
  .badge-dot.is-disabled { background: var(--surface-2); color: var(--text-muted); }
  .badge-dot.is-disabled .dot { background: var(--text-disabled); }

  /* ---- 操作紀錄（Audit Log），2026-08-13 新增 ----
     跟帳號表刻意的兩個差異：
     ① 不掛 .is-interactive —— 這是唯讀稽核表、沒有列操作，有 hover 會誤導成可點
     ② 沒有任何欄位承載個資 —— 操作者與對象一律只放帳號代號，姓名／手機／信箱都不進這張表 */
  .audit-table { min-width: 900px; }
  /* ⚠️ 掛在 <td> 上的 class 一定要寫成 .data-table td.xxx —— 共用規則
     `.data-table td { color: var(--text) }` 特異度(0,1,1)贏過單純的 class(0,1,0)，
     只寫 class 的話灰字會被打回深色（第一版就是這樣，量出來是 #2C2324 才發現） */
  /* 2026-08-13 字級對齊子帳號管理表（Alvie 裁示，不自己另立一套）：
       表頭      → 兩表共用 .data-table th（Small 14/700），維持不動
       資料內文  → Body 16（時間、操作者、類別、動作、對象全部走 .data-table 預設）
       次要說明  → 只有「說明」欄降一階用 Small 14
     時間欄只保留 tabular-nums 與 nowrap（稽核表最基本的欄，折行整列會多一截、
     掃讀時間軸也變吃力），顏色沿用帳號表次要識別欄的 .muted 灰。 */
  .data-table td.audit-time { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text-muted); }
  /* 粗體給「操作者」與「動作」兩欄（2026-08-13 Alvie 裁示）。
     帳號表的模式是整列只有姓名一欄加粗，這裡刻意不同——稽核列要掃讀的是
     「誰 做了什麼」，兩個都是主體，只強調其一反而讀不出重點。字重仍是既有的 600，
     沒有新增字重階，差異只在「哪些欄位套用」。 */
  .audit-id { font-weight: 600; }
  /* 2026-08-14：說明欄從 Small 14 拉回 Body 16，跟表格其他資料欄同一階（Alvie 定）。
     同一列裡混兩個字級，說明欄看起來會矮一截。只保留次要灰的顏色差異。 */
  .data-table td.audit-desc { color: var(--text-muted); }
  /* 類別欄刻意不上色：四個類別各配一個顏色等於發明四種不存在的語意，紅色也會被誤讀成危險 */
  .audit-act { display: inline-flex; align-items: baseline; gap: 7px; font-weight: 600; color: var(--text); }
  .audit-act .alert-dot { width: 6px; height: 6px; border-radius: 50%; background: #EC2D30; flex-shrink: 0; position: relative; top: -2px; }
  .audit-dash { color: var(--text-disabled); }
  /* 保存期限：這是產品規格不是待辦，所以用中性小字放表格下方當註腳，
     不跟上方黃色的 .flag-note（待正式開發）混在一起，兩者性質不同 */
  /* ---- 分頁列：規格直接讀自 Figma「E8D · Pagination」（node 248:117）----
     頁碼 32×32、圓角 radius-md、字 13px(caption)/Medium 500、item 間距 spacing-xs(4px)、
     Default 灰字無底／Hover 灰底(bg/hover)深字／Active 橘底白字／Disabled 淡灰／Ellipsis 靜態不可點。
     版面 space-between：左邊每頁筆數選單＋筆數摘要，右邊 pager。
     放在表格卡片內底部並用 border-top 分隔（表格最後一列本來就沒有底線，接得剛好）。 */
  .pager-bar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: var(--spacing-md); padding: var(--spacing-md) var(--spacing-lg);
    border-top: 1px solid var(--border);
  }
  .pager-left { display: flex; align-items: center; gap: var(--spacing-xl); flex-wrap: wrap; }
  .page-size { display: flex; align-items: center; gap: var(--spacing-sm); font-size: var(--fs-small); line-height: var(--lh-small); color: var(--text-muted); white-space: nowrap; }
  .page-size .dd { width: 88px; }
  .pager-info { font-size: var(--fs-small); line-height: var(--lh-small); color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pager { display: flex; align-items: center; gap: var(--spacing-xs); }
  .pager-item {
    width: 32px; height: 32px; padding: 0; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: none; border-radius: var(--radius-md); cursor: pointer;
    font-family: var(--font-ui); font-size: var(--fs-caption); line-height: 20px; font-weight: 500;
    color: var(--text-muted); font-variant-numeric: tabular-nums;
    transition: background .12s ease, color .12s ease;
  }
  .pager-item .ico { width: 16px; height: 16px; }
  .pager-item:hover:not(:disabled):not(.active) { background: var(--bg); color: var(--text); }
  .pager-item.active { background: var(--accent); color: var(--accent-contrast); cursor: default; }
  .pager-item:disabled { color: var(--text-disabled); cursor: not-allowed; }
  /* Ellipsis 是靜態指示不是按鈕，用 span 不用 button —— 沒有 hover、也不該被鍵盤 tab 到 */
  .pager-gap { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-disabled); font-size: var(--fs-caption); }

  /* 2026-08-13：字級從 Caption 提高一階到 Small（Alvie：這是合規／個資說明，要被看到）。
     顏色維持次要灰不變深——提高的是可讀性，不是把它變成跟資料同級的主角。
     icon 跟著字級走：14px 對 Caption、16px 對 Small */
  .audit-retention { display: flex; align-items: center; gap: 6px; margin-top: var(--spacing-md); font-size: var(--fs-small); line-height: var(--lh-small); color: var(--text-muted); }
  .audit-retention .ico { width: 16px; height: 16px; color: var(--text-disabled); flex-shrink: 0; }
  /* 筆數摘要：語意上是「篩選後的結果數」，所以就放在篩選列這一排的最右側。
     （2026-08-13 曾搬進表格卡片左上角，但那裡跟表頭之間會空出一段，看起來像沒有歸屬的孤字，已移回）
     靠右靠的是前面的 .filter-bar-spacer(flex:1)；再加一個 --spacing-xl 的 margin-left 保底，
     這樣就算視窗窄到 spacer 被壓扁，也不會貼上「時間範圍」下拉、被誤讀成綁在一起的附屬文字。
     垂直方向由 .filter-bar 既有的 align-items:center 處理，跟搜尋框、下拉同一條中線。 */
  .filter-count {
    margin-left: var(--spacing-xl);
    font-size: var(--fs-small); line-height: var(--lh-small);
    color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* ---- 部門頁：主管儲存格（名字＋指派連結）---- */

  /* ---- 部門頁：刪除被停用時的就地說明（2026-08-14 第二版）----
     第一版放在表格最底部一條常駐訊息，位置跟 hover 的那一列對不起來（滑到哪一列都在同一個地方，
     看起來就像寫死的固定文字）。改成 hover 哪一列，就在**那一列正下方**插入一列說明，
     文字帶入該列自己的帳號數，滑走就移除。
     不用 tooltip：① 專案不走 tooltip 這條路 ② disabled 的 <button> 不會發出滑鼠事件，
     hover 監聽必須掛在外層的 td.col-actions 上才收得到。
     底色用 var(--bg)（跟表格列 hover 同一個色），讓說明在視覺上跟它所屬的那一列是一組。 */
  /* 觸發區＝緊貼「刪除」按鈕本身（不是整個操作欄），滑鼠靠到按鈕上才出現說明 */
  .del-hint-zone { display: inline-flex; }
  .dept-note-row > td { background: var(--bg); padding: 10px var(--spacing-lg); }
  .dept-note-inner { display: flex; align-items: flex-start; gap: 6px; font-size: var(--fs-small); line-height: var(--lh-small); color: var(--text-muted); }
  .dept-note-inner .ico { width: 16px; height: 16px; color: var(--text-disabled); flex-shrink: 0; margin-top: 3px; }

  /* ---- 部門情境列（點選部門樹後，列表上方顯示部門名稱＋主管） ---- */
  /* 2026-08-13：margin-top 從 -4px 改 0——上方 chip 列的 margin-bottom 會被 -4px 抵銷，
     看起來就會偏向黏著上面那排 chip。現在上下一致（都是 24px，跟 .dept-chips 同一組數值） */
  .dept-context { display: flex; align-items: center; gap: 6px; font-size: var(--fs-small); font-weight: 600; color: var(--text); margin: 0 0 var(--space-block); }
  .dept-context .ico { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }

  /* ---- 批次操作：選取模式列首 checkbox／浮出的操作列（checkbox 樣式見 .chk，跟系統元件同一套）---- */
  /* 欄寬改由表頭 th 的 inline % 決定（table-layout:fixed 只吃第一列的寬度），這裡不寫死 px */
  /* 2026-08-13：`.chk` 是 inline-flex，屬於行內元素、預設沿「文字基線」對齊，
     所以在表頭那列會比旁邊的欄位標題高約 4px（實測）。補 vertical-align: middle
     讓它改用儲存格的垂直中線對齊。
     ⚠️ 不要改成在 td/th 上加 display:flex —— 那會讓儲存格脫離表格排版、不再參與欄寬計算 */
  .data-table td.col-check, .data-table th.col-check { padding-right: 0; }
  .data-table td.col-check .chk, .data-table th.col-check .chk { vertical-align: middle; }
  /* 這條刻意用 --space-tight（12px）而不是 --space-block：批次操作列是「附屬於下方表格」
     的工具列（已選 N 筆＋對這些列的操作），貼近表格才讀得出兩者是一組。
     若之後覺得不夠透氣，改綁 --space-block 即可，不要再寫死數字 */
  /* gap 12→16(lg)、padding 10/14→12/16(md/lg)：原本四顆按鈕全部等距 12px 擠在一起，
     而且「批次停用/啟用/刪除」（三個操作）跟「取消」（離開選取模式）性質不同卻同距離，
     讀起來是平均的四顆。現在按鈕之間 lg，「取消」前面另外加一段 xl 把它跟操作群分開 */
  .bulk-bar {
    display: flex; align-items: center; gap: var(--spacing-lg); background: var(--accent-soft);
    border-radius: var(--radius-md); padding: var(--spacing-md) var(--spacing-lg); margin-bottom: var(--space-tight);
  }
  .bulk-bar .bb-count { font-size: var(--fs-caption); font-weight: 700; color: var(--accent); white-space: nowrap; }
  .bulk-bar-spacer { flex: 1; }
  .bulk-bar #btnBulkCancel { margin-left: var(--spacing-sm); }

  /* ---- 空狀態 ---- */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 64px 24px; }
  /* 2026-08-12 修正：原本是後代選擇器 .empty-state .ico，跟 .btn .ico（15px/白色）specificity
     打平，CSS 順序後寫的贏，結果連按鈕裡的「+」icon 都被吃成 40px 灰色——按鈕那顆是巢狀在
     button 裡（.empty-state > button > svg），不是 .empty-state 的直接子節點，改用子選擇器
     只鎖定最上面那顆說明用的大 icon，不會再誤傷按鈕內的 icon */
  .empty-state > .ico { width: 40px; height: 40px; color: var(--text-disabled); margin-bottom: 14px; }
  .empty-state p { font-size: var(--fs-small); line-height: var(--lh-small); color: var(--text-muted); margin: 0 0 18px; }

  /* ---- 表格固定寬度、長內容欄位內換行（2026-08-12 第二版，取代原本的截斷＋tooltip；
     2026-08-13 第五版：帳號表除了帳號狀態／操作，其餘 7 欄——姓名／帳號／所屬部門／
     角色／員工編號／手機／E-mail——全部用 .wrap-cell。員工編號／手機原本是唯二「絕對
     不換行」的例外，但為了蓋住刻意插入的極端值（TECH-2024-0012、海外門號）硬撐寬度，
     反而把姓名/帳號/E-mail 擠到過度換行；跟 Alvie 核對後拿掉這個例外，7 欄一致允許換行，
     欄寬改成蓋住一般資料、極端值當例外多換幾行）：
     table-layout:fixed 讓表格寬度只由 th 的 width 決定，內容再長也不會把表格撐寬、
     不會把「操作」欄擠出可視範圍。內容超出欄寬時往下換行、列高跟著增加，完整資料一律
     看得到，不靠 hover 才看到全文，這些欄也就不掛 tooltip（data-tip 屬性直接不掛，不用改
     tooltip 引擎本身——頂部圖示那組 tooltip 沒受影響，兩者共用同一套引擎，差別只在有沒有
     掛 data-tip）。.table-scroll 留著當窄視窗的保護網，正常桌機寬度下欄寬加總不會觸發它。
     2026-08-13：光有 overflow-x:auto 不夠——table-layout:fixed 配純百分比欄寬時，
     表格永遠等於容器寬度，內容再窄也不會超出去，保護網形同虛設（縮視窗時所有欄位會
     無限跟著擠到欄位標題疊字、手機號碼被裁），所以 .acct-table 補一個 min-width（等於
     欄寬第四版校正時測過「所有短固定欄都放得下」的那個桌機寬度）：容器比這個窄，表格
     維持這個最小寬度、交給 .table-scroll 橫向捲動；容器比這個寬，table-layout:fixed
     仍照百分比伸展填滿，行為不變 */
  .table-scroll { overflow-x: auto; }
  .acct-table { min-width: 850px; }
  .data-table.acct-table, .data-table.dept-table, .data-table.audit-table { table-layout: fixed; }
  .data-table td.wrap-cell { overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
  /* 窄桌機（~1280）：內容區只剩約 936px、比單行所需的 1078px 少 142px。
     與其讓每一欄都被壓到換行，改成把 cell 左右 padding 從 16px 收到 12px
     （9 欄共省 72px），剩下的差額由 E-mail 欄吸收、換成兩行——
     這是刻意的取捨：短欄位優先保持單行，最長的 E-mail 才換行 */
  /* 2026-08-14：操作紀錄表也套同一招——說明欄字級從 Small 14 拉回 Body 16 之後，
     1280 下六欄需求合計 943px、比表格的 936px 多 7px。收 padding（6 欄共省 48px）
     比讓說明欄為了 7px 換成兩行划算 */
  @media (max-width: 1366px) {
    .acct-table th, .acct-table td,
    .audit-table th, .audit-table td { padding-left: var(--spacing-md); padding-right: var(--spacing-md); }
  }

  /* ---- Tooltip：系統缺口，這裡先在原型定案方向（深底白字，跟 popover/dd-panel 的白底
     淺色系區隔開，才看得出「這是提示不是可互動面板」），之後要收進 Figma 做成正式元件 ---- */
  .cell-tip {
    position: fixed; z-index: 300; max-width: 320px; padding: 6px 10px;
    background: var(--text); color: var(--surface); font-size: var(--fs-caption); line-height: var(--lh-caption);
    border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
    opacity: 0; transform: translateY(-4px); pointer-events: none;
    transition: opacity .12s ease, transform .12s ease; word-break: break-word;
  }
  .cell-tip.open { opacity: 1; transform: translateY(0); }

  /* ---- 開關（Toggle）：系統缺口，目前只有 Checkbox/Radio，先照既有色彩語言畫一版 ----
     2026-08-17 關閉態改深（Alvie：原本淺到像 disabled、讓人以為不能點）：
       關閉 → 軌道 neutral/400 中灰、圓鈕純白＋陰影（實體開關停在「關」的位置）
       開啟 → 主色橘（不變）
       禁用 → 軌道 neutral/100 淺灰、圓鈕無陰影（扁平、明顯不可互動）
     關閉態刻意用比 disabled **深兩階** 的灰，兩者才拉得開；淺灰整段留給 disabled。 */
  .toggle { position: relative; display: inline-flex; align-items: center; width: 40px; height: 24px; flex-shrink: 0; }
  .toggle input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  /* 邊框與底色同色（開啟態本來就是這個模式）：關閉態若留淺色邊框，深軌道外圈會多一道
     淺邊，看起來像沒對齊的描邊 */
  .toggle .track {
    position: absolute; inset: 0; background: var(--switch-track-off); border: 1px solid var(--switch-track-off);
    border-radius: var(--radius-full); transition: background .15s ease, border-color .15s ease;
  }
  /* 2026-08-17 尺寸校正到 4px grid（跟 Figma Switch 元件對齊，同一輪回寫的規格）：
     40×22 的 22 跟位移量 18 都不在 4px grid 上，改成 40×24、圓鈕 16、內距 4、位移 16。
     checked 位移＝ 40 - 16 - 4 - 4 = 16px。高度只差 2px，肉眼無感，但系統裡不留破 grid 的值。 */
  .toggle .thumb {
    position: absolute; top: 4px; left: 4px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--surface); box-shadow: var(--shadow-sm);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .toggle input:checked ~ .track { background: var(--accent); border-color: var(--accent); }
  .toggle input:checked ~ .thumb { transform: translateX(16px); }
  /* 禁用：不再用 opacity 疊在關閉態上——那只是把同一個顏色調淡，關閉態一深就跟它撞在一起。
     改成獨立的淺灰軌道，並把圓鈕的陰影拿掉：少了浮起感，一眼就看得出不能碰。 */
  .toggle input:disabled { cursor: not-allowed; }
  .toggle input:disabled ~ .track { background: var(--switch-track-disabled); border-color: var(--border); }
  .toggle input:disabled ~ .thumb { box-shadow: none; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
  .toggle-row .tr-label { font-size: var(--fs-small); color: var(--text); font-weight: 600; }
  .toggle-row .tr-sub { font-size: var(--fs-caption); color: var(--text-muted); margin-top: 2px; }

  /* ============================================================
     Checkbox（2026-08-11：改成直接沿用 Figma「E8D · Checkbox & Radio」頁的規格，
     取代原本借用瀏覽器原生 checkbox + accent-color 的做法——原生 checkbox 沒辦法照系統
     控制圓角/勾號樣式，這就是「看起來粗糙、跟系統版本不一致」的根本原因）
     18×18、radius/sm(4px)、勾號 12×12 白色細線，數值全部照 node 167:618 讀出來
     ============================================================ */
  .chk { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; flex-shrink: 0; cursor: pointer; }
  .chk input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .chk .chk-box {
    position: absolute; inset: 0; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
    background: var(--surface); display: flex; align-items: center; justify-content: center;
    transition: background .12s ease, border-color .12s ease;
  }
  .chk .chk-box .ico { position: absolute; width: 12px; height: 12px; color: #fff; stroke-width: 2.5; opacity: 0; }
  .chk input:hover ~ .chk-box { border-color: var(--border-hover); }
  .chk input:checked ~ .chk-box, .chk input:indeterminate ~ .chk-box { background: var(--accent); border-color: var(--accent); }
  .chk input:checked ~ .chk-box .ico-check { opacity: 1; }
  .chk input:indeterminate:not(:checked) ~ .chk-box .ico-minus { opacity: 1; }
  .chk input:disabled ~ .chk-box { background: var(--surface-2); border-color: var(--border); }
  .chk input:disabled:checked ~ .chk-box, .chk input:disabled:indeterminate ~ .chk-box { border-color: transparent; }
  .chk input:disabled ~ .chk-box .ico { color: var(--text-disabled); }
  .chk input:disabled { cursor: not-allowed; }
  .chk:has(input:disabled) { cursor: not-allowed; }

  /* ---- 抽屜表單欄位 ---- */
  .field-group { margin-bottom: 16px; }
  .field-group label { display: block; font-size: var(--fs-caption); font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .field-group .req { color: #EC2D30; margin-left: 2px; }
  .field-group input[type=text], .field-group input[type=password], .field-group input[type=email], .field-group input[type=tel] {
    width: 100%; height: 36px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: var(--fs-body); line-height: var(--lh-body); font-family: var(--font-ui);
  }
  .field-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field-group input.is-error { border-color: #EC2D30; }
  .field-group input.is-error:focus { box-shadow: 0 0 0 3px #FFEBEE; }
  /* 唯讀欄位（例：編輯帳號時的「帳號」）：淡背景、不可聚焦，跟一般 disabled 灰階區隔開——
     這是「本來就不給改」不是「暫時不能用」，用中性淡底色而非明顯的 disabled 樣式 */
  .field-group input.is-readonly { background: var(--bg); color: var(--text-muted); cursor: not-allowed; }
  .field-group input.is-readonly:focus { border-color: var(--border); box-shadow: none; }
  .field-group .dd-trigger.is-error { border-color: #EC2D30; }
  /* 2026-08-13：.hint 拿掉 .field-group 前綴——密碼規則說明那個 .hint 是獨立 div，不在任何
     .field-group 裡面（field-row 關掉後才接的兄弟節點），原本的 descendant selector 永遠比對
     不到，字級掉回 body 預設的 16px（--fs-body），比同階的 .err-msg 明顯大一號。全站唯一一處
     用 .hint 的地方就是它，改成不需要祖先層級的寫法直接修好，token 本身沒換，維持 --fs-caption */
  .hint { font-size: var(--fs-caption); color: var(--text-muted); margin-top: 5px; }
  .field-group .err-msg { font-size: var(--fs-caption); color: #EC2D30; margin-top: 5px; display: flex; align-items: center; gap: 4px; }
  .field-group .err-msg .ico { width: 12px; height: 12px; flex-shrink: 0; }
  .field-row { display: flex; gap: 10px; }
  .field-row > .field-group { flex: 1; min-width: 0; }
  .field-row .dial-code {
    flex: 0 0 60px; height: 36px; display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-md); background: var(--surface-2); color: var(--text-muted); font-size: var(--fs-body); line-height: var(--lh-body); font-variant-numeric: tabular-nums;
  }
  .field-divider { height: 1px; background: var(--border); margin: 4px 0 20px; }
  .field-section-title { font-size: var(--fs-caption); font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 12px; }

  /* ---- 角色→可用功能即時預覽 ---- */
  .perm-preview { background: var(--surface-2); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 20px; }
  .perm-preview .pp-title { font-size: var(--fs-caption); font-weight: 700; color: var(--text); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .perm-preview .pp-title .ico { width: 14px; height: 14px; color: var(--accent); }
  .perm-list { display: flex; flex-wrap: wrap; gap: 6px 8px; }
  .perm-item { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-caption); padding: 4px 9px; border-radius: var(--radius-full); background: var(--surface); color: var(--text); }
  .perm-item .ico { width: 11px; height: 11px; color: #0C9D61; flex-shrink: 0; }
  /* 2026-08-11：不用刪除線（一整區都是線太雜亂、有「被否決」的負面感），改成整個標籤淡化到
     40% 透明度，靠「深色+綠勾」對上「淡化無勾」兩個線索疊加分辨有/沒有 */
  .perm-item.is-off { opacity: .4; }

  /* ---- 抽屜（Drawer）：系統缺口，照 Modal 語言（白底/圓角/陰影/footer 按鈕排版）自畫滑入版 ---- */
  .drawer-mask { position: fixed; inset: 0; background: rgba(26,21,18,.45); z-index: 70; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .drawer-mask.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 480px; max-width: 92vw;
    background: var(--surface); box-shadow: var(--shadow-lg); z-index: 71;
    display: flex; flex-direction: column; transform: translateX(100%); transition: transform .25s cubic-bezier(.4,0,.2,1);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .drawer-head h2 { font-size: var(--fs-subhead); line-height: var(--lh-subhead); font-weight: 700; margin: 0; color: var(--text); }
  .drawer-close { width: 32px; height: 32px; border-radius: var(--radius-md); border: none; background: none; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; flex-shrink: 0; }
  .drawer-close:hover { background: var(--surface-2); color: var(--text); }
  .drawer-close .ico { width: 18px; height: 18px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 22px 24px; }
  .drawer-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .drawer-foot-right { display: flex; gap: 10px; }

  /* ---- 確認 modal（沿用系統 Modal 定案：Danger/Confirm 無 ✕、footer 無分隔線） ---- */
  .confirm-mask {
    position: fixed; inset: 0; background: rgba(26,21,18,.45); z-index: 80;
    display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  .confirm-mask.open { opacity: 1; pointer-events: auto; }
  .confirm-modal {
    width: 400px; max-width: 90vw; background: var(--surface); border-radius: var(--radius-xl);
    box-shadow: var(--shadow-lg); padding: 24px; transform: scale(.96); transition: transform .18s ease;
  }
  .confirm-mask.open .confirm-modal { transform: scale(1); }
  .confirm-modal h3 { font-size: var(--fs-subhead); line-height: var(--lh-subhead); font-weight: 700; margin: 0 0 8px; color: var(--text); }
  .confirm-modal p { font-size: var(--fs-body); color: var(--text-muted); margin: 0; line-height: var(--lh-body); }
  .confirm-modal .cm-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .confirm-modal .field-group { margin: 16px 0 0; }

  /* ---- 匯入帳號 modal（2026-08-13）----
     沿用 .confirm-mask 當遮罩、.confirm-modal 當卡片，只加一個加寬的 modifier
     跟內部元素，不另外做一套 modal。上傳區的虛線框沿用 .placeholder-card 的語言
     （dashed border + radius-lg），沒有發明新的圓角/陰影階 */
  .confirm-modal.is-wide { width: 480px; }
  /* 匯入第二段「檢視名單」用的寬版：9 欄名單在 1440 下要放得開。
     1280 視窗時 92vw = 1178px 仍大於 1100，所以不會被壓縮到爆版 */
  /* 匯入第二／三段的寬版：1100 寬、最高 90vh。
     用 max-height 不用固定 height——只有 3 筆時 modal 會自己縮小，不會留一大片空白；
     筆數多時撐到 90vh 為止，名單自己捲。
     整個 modal 是 flex column：標題／統計／footer 固定，中間的名單 flex:1 吃掉剩餘高度。 */
  .confirm-modal.is-xwide {
    width: 1100px; max-width: 92vw;
    max-height: 90vh; display: flex; flex-direction: column;
  }
  .confirm-modal.is-xwide .cm-head,
  .confirm-modal.is-xwide .import-summary,
  .confirm-modal.is-xwide .cm-foot { flex-shrink: 0; }
  /* min-height:0 不可省：flex 子項預設 min-height:auto，名單會被內容撐開、
     整個 modal 就衝破 90vh，捲軸也不會出現在名單裡 */
  .confirm-modal.is-xwide .import-list { flex: 1; min-height: 0; max-height: none; }

  /* ---- 匯入：檔案層級錯誤（整份擋下，不進名單檢視）---- */
  .file-error {
    display: flex; align-items: flex-start; gap: 8px; margin-top: var(--spacing-lg);
    padding: var(--spacing-md) var(--spacing-lg); border-radius: var(--radius-md);
    background: #FFEBEE; color: #EC2D30;
    font-size: var(--fs-small); line-height: var(--lh-small);
  }
  .file-error .ico { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; }
  .file-error b { font-weight: 700; }

  /* ---- 匯入：名單檢視 ---- */
  .import-summary {
    display: flex; align-items: center; gap: var(--spacing-sm);
    margin: var(--spacing-lg) 0 var(--spacing-md);
    font-size: var(--fs-body); line-height: var(--lh-body); color: var(--text);
  }
  .import-summary .is-ok { font-weight: 600; }
  .import-summary .is-bad { color: #EC2D30; font-weight: 600; }
  .import-summary .is-sep { color: var(--text-disabled); }
  .import-summary .is-file { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: var(--fs-small); color: var(--text-muted); }
  .import-summary .is-file .ico { width: 16px; height: 16px; color: var(--text-disabled); }

  /* 名單本身沿用站內表格語言（table-layout:fixed＋百分比欄寬），只是包在 modal 裡、可捲動 */
  .import-list { max-height: 50vh; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .import-list table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: var(--fs-body); line-height: var(--lh-body); }
  .import-list th {
    position: sticky; top: 0; z-index: 1; text-align: left; background: var(--surface-2);
    font-size: var(--fs-body-lg); line-height: var(--lh-body-lg); font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .03em; padding: 10px var(--spacing-md);
    border-bottom: 1px solid var(--border); white-space: normal;
  }
  .import-list td { padding: 10px var(--spacing-md); border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; overflow-wrap: anywhere; }
  /* 值最多顯示兩行就截斷：「姓名超過 50 字」這種違規值原本會把整列撐到 359px、
     一列就吃掉大半個名單。這一段的任務是「辨識哪幾列有問題」，不是閱讀完整內容，
     所以截斷是刻意的取捨（錯誤原因欄不截，那才是要看的重點） */
  .import-list .cell-val {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .import-list tr:last-child td { border-bottom: none; }
  /* 有錯的列整列淡紅底，一眼分得出哪幾列匯不進去 */
  .import-list tr.is-invalid td { background: #FFF5F5; }
  .import-list .err-text { color: #EC2D30; font-size: var(--fs-small); line-height: var(--lh-small); }
  .import-list .empty-val { color: var(--text-disabled); }
  /* 「可匯入 0 筆」時的整份提示：所有列都有格式錯誤，不讓它空跑一輪匯入 */
  .import-blocked {
    display: flex; align-items: flex-start; gap: 8px;
    margin: var(--spacing-lg) 0 var(--spacing-md);
    padding: var(--spacing-md) var(--spacing-lg); border-radius: var(--radius-md);
    background: #FFEBEE; color: #EC2D30;
    font-size: var(--fs-small); line-height: var(--lh-small);
  }
  .import-blocked .ico { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; }
  .import-blocked b { font-weight: 700; }

  /* 匯入中：逐筆處理的狀態欄 */
  .import-list .state-wait { color: var(--text-disabled); font-size: var(--fs-small); }
  .import-list .state-run { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: var(--fs-small); font-weight: 600; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--accent-soft); border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
  /* 進度列：左邊「正在匯入中 (X/Y)」、右邊停止鈕 */
  .import-progress { display: flex; align-items: center; gap: var(--spacing-md); font-size: var(--fs-body); color: var(--text); }
  .import-progress .ip-num { font-variant-numeric: tabular-nums; font-weight: 600; }

  /* 結果頁的逐列狀態：成功綠勾／失敗紅叉，沿用系統既有的 success / error 色 */
  .import-list .col-state { white-space: nowrap; }
  .import-list .state-ok, .import-list .state-fail { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-small); font-weight: 600; }
  .import-list .state-ok { color: #0C9D61; }
  .import-list .state-fail { color: #EC2D30; }
  .import-list .state-ok .ico, .import-list .state-fail .ico { width: 15px; height: 15px; }
  /* 其他欄位靠上對齊（長內容才好讀），但叉叉要在該列正中間——
     列因為換行變高時，靠上的叉叉會貼在上緣、看起來沒對齊 */
  /* 2026-08-17 修捲動軸壓到叉叉：根因不是 padding 不夠，是**這一欄太窄**。
     原本欄寬 4%（≈42px），扣掉 td 左右各 12px 只剩 18px content box，
     但按鈕本身 28px —— 放不進去就往右溢出 10px，把 padding-right 吃掉只剩 2px，
     而 macOS/Chromium 的捲動軸是 overlay（實測 offsetWidth-clientWidth=0，
     不佔版面寬度、直接疊在內容最右側約 9px），正好蓋在那 2px 上。
     ⚠️ `scrollbar-gutter: stable` 在這裡無效——它只對「佔據版面寬度」的傳統捲動軸
     預留空間，overlay 捲動軸不會產生 gutter。
     修法＝把欄寬給足（見 review 段的 th 6%），讓按鈕不再溢出，padding-right 才真正生效：
       content box 29.8px（≥ 按鈕 28px）＋ padding-right 24px
       → 叉叉右緣距內容區右緣 24px，減去捲動軸約 9px，淨空約 15px（要求 ≥8px）
     因為 overlay 不佔版面，有無捲動軸兩種狀態下叉叉右緣位置完全相同。
     padding-left 收成 sm(8px)：左邊「錯誤原因」欄自己已有 12px 右內距，不必再給 12px。 */
  .import-list .col-x {
    text-align: right; vertical-align: middle;
    padding-left: var(--spacing-sm); padding-right: var(--spacing-xl);
  }
  /* 「列」欄＝Excel 的實際列號，是給使用者回去改檔用的次要資訊：
     用 Small 字級＋次要灰壓低，數字用 tabular-nums 對齊 */
  .import-list .col-no {
    color: var(--text-muted); font-size: var(--fs-small); line-height: var(--lh-small);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .row-remove {
    width: 28px; height: 28px; border: none; background: none; border-radius: var(--radius-md);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted);
  }
  .row-remove:hover { background: var(--bg); color: var(--text); }
  .row-remove .ico { width: 16px; height: 16px; }
  .confirm-modal .cm-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .confirm-modal .cm-head h3 { margin: 0; }
  .dropzone {
    border: 1.5px dashed var(--border); border-radius: var(--radius-lg); background: var(--bg);
    padding: 26px 20px; text-align: center; margin-top: 16px;
    transition: border-color .12s ease, background .12s ease;
  }
  .dropzone.is-over { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone > .ico { width: 30px; height: 30px; color: var(--text-disabled); margin-bottom: 10px; }
  .dropzone .dz-hint { font-size: var(--fs-caption); color: var(--text-muted); margin-top: 10px; }
  /* 已選檔案列：檔名 + 移除，用淺灰底跟未選檔的虛線框做出「已完成一步」的區別 */
  .file-row {
    display: flex; align-items: center; gap: 10px; margin-top: 16px;
    padding: 12px 14px; border-radius: var(--radius-md); background: var(--bg); border: 1px solid var(--border);
  }
  .file-row > .ico { width: 20px; height: 20px; color: var(--accent); flex-shrink: 0; }
  .file-row .fr-name { flex: 1; min-width: 0; font-size: var(--fs-small); line-height: var(--lh-small); color: var(--text); overflow-wrap: anywhere; }
  .file-row .fr-size { font-size: var(--fs-caption); color: var(--text-muted); flex-shrink: 0; }
  .file-row button {
    width: 28px; height: 28px; border-radius: var(--radius-md); border: none; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--text-muted); flex-shrink: 0;
  }
  .file-row button:hover { background: var(--surface-2); color: var(--text); }
  .file-row button .ico { width: 15px; height: 15px; }
  /* 匯入結果：成功／失敗兩個數字並排，成功綠、失敗紅，用既有的 success/error 色 */
  .import-result { display: flex; gap: 10px; margin-top: 16px; }
  .import-result .ir-cell {
    flex: 1; padding: 14px; border-radius: var(--radius-md); background: var(--bg); border: 1px solid var(--border); text-align: center;
  }
  .import-result .ir-num { font-size: var(--fs-heading); line-height: var(--lh-heading); font-weight: 700; font-variant-numeric: tabular-nums; }
  .import-result .ir-label { font-size: var(--fs-caption); color: var(--text-muted); margin-top: 2px; }
  .import-result .ir-cell.ok .ir-num { color: #0C9D61; }
  .import-result .ir-cell.fail .ir-num { color: #EC2D30; }

  /* ---- 部門頁：inline 改名／指派主管 ---- */
  .inline-edit { display: flex; align-items: center; gap: 6px; }
  .inline-edit input {
    height: 32px; padding: 0 10px; border-radius: var(--radius-md); border: 1px solid var(--accent);
    font-size: var(--fs-body); line-height: var(--lh-body); font-family: var(--font-ui); width: 150px; color: var(--text);
  }
  .inline-edit input:focus { outline: none; }
  .inline-edit button { width: 28px; height: 28px; border-radius: var(--radius-md); border: none; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); flex-shrink: 0; }
  .inline-edit button .ico { width: 15px; height: 15px; }
  .inline-edit button.confirm { color: #0C9D61; }
  .inline-edit button.confirm:hover { background: #E5F5EC; }
  .inline-edit button.cancel:hover { background: var(--surface-2); color: var(--text); }

  /* 2026-08-14：.todo-tag（橘色 TODO 小標籤）已刪除——畫面上不再出現任何 TODO 標註，
     那些「行為示意／待 PM 確認」的限制改用程式碼註解記錄、口頭向工程師說明 */

  /* ---- Demo 身份切換列（純原型工具，不是產品功能；正式版整個移除）
     沿用登入前流程已定案的「深色圓角藥丸狀態切換器」樣式，
     刻意跟帳號卡（.points-card）完全脫鉤、獨立浮在畫面角落，避免使用者誤以為這是真實產品功能 ---- */
  .demo-role-bar {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60;
    display: flex; align-items: center; gap: 4px; padding: 8px 10px;
    border-radius: var(--radius-full); background: rgba(44,35,36,.92); backdrop-filter: blur(8px);
    box-shadow: var(--shadow-lg);
    /* width: max-content 修正一個 flex-wrap + fixed 定位的瀏覽器怪癖：
       不設的話 shrink-to-fit 算出來的寬度會比實際內容單行需要的寬度小一截，
       明明 1440 螢幕裝得下整條，卻在最後一顆按鈕提早換行 */
    width: max-content; max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center;
  }
  .demo-role-bar .drb-tag { font-size: var(--fs-caption); color: rgba(255,255,255,.55); padding: 0 6px; white-space: nowrap; letter-spacing: .2px; }
  .demo-role-bar button {
    font-family: var(--font-ui); font-size: var(--fs-small); font-weight: 600; color: rgba(255,255,255,.78);
    background: none; border: none; padding: 7px 12px; border-radius: var(--radius-full); cursor: pointer;
    white-space: nowrap; transition: background .12s ease, color .12s ease;
  }
  .demo-role-bar button:hover { background: rgba(255,255,255,.10); color: #fff; }
  .demo-role-bar button.active { background: var(--accent); color: #fff; }
  /* 兩組 demo 控制項（身份／合約狀態）中間的視覺分隔線——兩組各切各的，互不影響 */
  .demo-role-bar .drb-divider { width: 1px; height: 20px; background: rgba(255,255,255,.18); flex-shrink: 0; margin: 0 2px; }

  /* 2026-08-13：原本這裡是把 .org-shell 的左右並排在窄螢幕改成上下堆疊；
     部門樹改成 chip 列後本來就是橫向、自己會 flex-wrap 折行，不需要斷點處理 */

  /* 2026-08-11：改成符合站內淺色暖調的成功 toast——白底卡片＋綠勾 icon，取代原本純黑底白字
     （跟右上角 icon 區/右下角帳號卡不會撞到：頂部置中、topbar 下方，兩邊都在別的高度）。
     全站共用同一個 #toast 節點跟 showToast()，訊息發送/儲值等頁面之後套用同一顆函式就會一致 */
  .toast {
    position: fixed; top: 84px; left: 50%; transform: translate(-50%, -8px);
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    padding: 12px 18px; border-radius: var(--radius-md); font-size: var(--fs-small); font-weight: 600;
    /* 2026-08-12：原本用 shadow-lg（陰影階裡最重的一階，Modal/Drawer 那種強互動層級在用），
       跟 toast「輕量、暫時浮現」的性質不符，改用卡片同一階 shadow-card，跟全站陰影層級一致 */
    box-shadow: var(--shadow-card);
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    z-index: 300; max-width: calc(100vw - 48px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .ico { width: 18px; height: 18px; color: var(--text-success); flex-shrink: 0; }
  /* 2026-08-17 新增錯誤態（系統失敗用，跟表單的欄位驗證錯誤不同層級）。
     卡片本體維持白底＋邊框＋陰影完全不變，只換 icon 與 icon 顏色——
     跟 Figma 的 Toast component（State=Success／Error）同一套規格。 */
  .toast.is-error .ico { color: var(--text-error); }

  @media (max-width: 767px) {
    .content { padding: 18px 16px 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

  function fmtNum(n) { return n.toLocaleString("en-US"); }

  // KPI 數字 count-up：只在首次載入跑，旁邊的百分比 badge 不滾（那是算好的靜態值）
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function countUp(el, target, duration) {
    const start = performance.now();
    (function tick(now) {
      const p = Math.min(1, (now - start) / duration);
      el.textContent = fmtNum(Math.round(target * easeOutCubic(p)));
      if (p < 1) requestAnimationFrame(tick);
    })(start);
  }
  function initStatCountUp() {
    const duration = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--kpi-anim-duration")) || 1200;
    document.querySelectorAll(".s-value[data-target]").forEach(function (el) {
      countUp(el, parseInt(el.getAttribute("data-target"), 10), duration);
    });
  }

  function smoothPath(pts) {
    if (pts.length < 2) return "";
    if (pts.length === 2) return "M" + pts[0].x + "," + pts[0].y + " L" + pts[1].x + "," + pts[1].y;
    let d = "M" + pts[0].x + "," + pts[0].y;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;
      const cp1x = p1.x + (p2.x - p0.x) / 6, cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6, cp2y = p2.y - (p3.y - p1.y) / 6;
      d += " C" + cp1x + "," + cp1y + " " + cp2x + "," + cp2y + " " + p2.x + "," + p2.y;
    }
    return d;
  }

  function roundedTopRectPath(x, y, w, h, r) {
    if (h <= 0) return "";
    r = Math.min(r, w / 2, h);
    return "M" + x + "," + (y + h) +
      " L" + x + "," + (y + r) +
      " Q" + x + "," + y + " " + (x + r) + "," + y +
      " L" + (x + w - r) + "," + y +
      " Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) +
      " L" + (x + w) + "," + (y + h) + " Z";
  }

  function buildAreaChart(period) {
    const cfg = DASH.trend[period];
    const values = cfg.values;
    const labels = cfg.labels || values.map(function (_, i) { return String(i + 1); });
    const labelEvery = cfg.labelEvery || 1;
    const vb = AREA_VB;
    const plotW = vb.w - vb.left - vb.right, plotH = vb.h - vb.top - vb.bottom;
    const n = values.length;

    const pts = values.map(function (v, i) {
      return {
        x: vb.left + (n === 1 ? 0 : (i / (n - 1)) * plotW),
        y: vb.top + plotH - (v / cfg.axisMax) * plotH,
        value: v, label: labels[i]
      };
    });

    const linePath = smoothPath(pts);
    const areaPath = linePath + " L" + pts[n - 1].x + "," + (vb.top + plotH) + " L" + pts[0].x + "," + (vb.top + plotH) + " Z";

    let gridHtml = "";
    cfg.ticks.forEach(function (t) {
      const y = vb.top + plotH - (t / cfg.axisMax) * plotH;
      gridHtml += '<line class="chart-grid" x1="' + vb.left + '" x2="' + (vb.w - vb.right) + '" y1="' + y + '" y2="' + y + '"/>' +
        '<text class="chart-axis-label" x="' + (vb.left - 8) + '" y="' + (y + 3.5) + '" text-anchor="end">' + fmtNum(t) + "</text>";
    });

    let xLabelHtml = "";
    pts.forEach(function (p, i) {
      if (i % labelEvery === 0 || i === n - 1) {
        xLabelHtml += '<text class="chart-axis-label" x="' + p.x + '" y="' + (vb.h - 10) + '" text-anchor="middle">' + p.label + "</text>";
      }
    });

    const gradDefs = '<defs><linearGradient id="areaGrad" gradientUnits="userSpaceOnUse" x1="0" y1="' + vb.top + '" x2="0" y2="' + (vb.top + plotH) + '">' +
      '<stop offset="0%" stop-color="#FF6416" stop-opacity="0.32"/>' +
      '<stop offset="55%" stop-color="#FF6416" stop-opacity="0.12"/>' +
      '<stop offset="100%" stop-color="#FF6416" stop-opacity="0"/>' +
      "</linearGradient></defs>";

    const svg = '<svg viewBox="0 0 ' + vb.w + " " + vb.h + '" aria-hidden="true">' + gradDefs +
      "<g>" + gridHtml + "</g>" + "<g>" + xLabelHtml + "</g>" +
      '<g class="chart-trend-shape">' +
        '<path d="' + areaPath + '" fill="url(#areaGrad)" stroke="none"/>' +
        '<path d="' + linePath + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      "</g>" +
      '<line class="chart-crosshair" id="areaCrosshair" x1="0" x2="0" y1="' + vb.top + '" y2="' + (vb.top + plotH) + '"/>' +
      '<circle class="chart-dot" id="areaDot" r="4.5"/>' +
      '<rect class="chart-hit" x="' + vb.left + '" y="' + vb.top + '" width="' + plotW + '" height="' + plotH + '"/>' +
      "</svg>";

    return { svg: svg, pts: pts, vb: vb };

  function wireAreaChartInteractivity(svgEl, chart, seriesLabel) {
    const hit = svgEl.querySelector(".chart-hit");

      const pt = svgEl.createSVGPoint();

      const ctm = svgEl.getScreenCTM();
      if (!ctm) return null;
      return pt.matrixTransform(ctm.inverse()).x;
    }
    function nearestIndex(x) {
      let closest = 0, minDist = Infinity;
      pts.forEach(function (p, i) { const d = Math.abs(p.x - x); if (d < minDist) { minDist = d; closest = i; } });
      return closest;
    }
