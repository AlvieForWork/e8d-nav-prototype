     寫進 Audit Log 的只有筆數與成功／失敗數，沒有任何個資明細。
     ============================================================ */
  const IMPORT_HEADERS = ["帳號", "姓名", "部門", "角色", "密碼", "員工編號", "國碼", "手機", "電子信箱", "開啟國際簡訊", "啟用帳號"];
  /* 標頭的舊寫法對照（2026-08-17 全站「行動電話」統一成「手機」時加的）：
     已經下載舊版範例檔的人，檔案第一列還是寫「行動電話」，標頭比對是逐格完全相符，
     不留這層對照的話那些檔案會整份被擋下。畫面一律顯示新字，只有比對時放寬。 */
  const IMPORT_HEADER_ALIASES = { "手機": ["行動電話"] };
  function importHeaderMatch(cell, expected) {
    if (cell === expected) return true;
    const alt = IMPORT_HEADER_ALIASES[expected];
    return !!alt && alt.indexOf(cell) !== -1;
  }

  // Excel 常見的格式雜訊：數字欄被存成 "1.0"、前後空白、全形空白
  function importCell(v) {
    if (v === null || v === undefined) return "";
    let t = String(v).replace(/\u3000/g, " ").trim();
    if (/^\d+\.0+$/.test(t)) t = t.replace(/\.0+$/, "");   // 1.0 → 1
    return t;
  }
  function importIsValidDial(dial) {
    return COUNTRY_CODES.some(function (c) { return c.dial === dial; });
  }
  const IMPORT_PWD_RE = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{8,16}$/;
  const IMPORT_EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  /* 2026-08-17 文案收斂（Alvie 指定）：同一欄的多種「內容錯誤」講同一句話，
     使用者只需要知道「這一欄該長什麼樣」，不必知道自己是踩到哪一條規則。
     ⚠️ 只收斂顯示文字，**判斷邏輯完全沒動**——下面仍然分別偵測各種情況，
     只是 push 同一個常數（日後要拆回獨立訊息，改 push 的內容即可）。
     ⚠️ 「XX為必填」不併進來：沒填跟填錯是兩種不同的修正動作，必須分開。 */
  const IMPORT_MSG_ACCOUNT = "帳號需為 50 字以內的英文或數字";   // 非英數字元／超過 50 字共用
  const IMPORT_MSG_DEPT = "部門不存在或名稱超過 15 字";           // 查不到部門／超過 15 字共用

  /* 單列驗證：回傳 { row, errs }；整列空白回傳 null（自動略過、不報錯）。
     一列可能同時違反多條規則，全部收集起來顯示，使用者才不用修一次上傳一次。 */
  function validateImportRow(cells, seen) {
    const c = IMPORT_HEADERS.map(function (_, i) { return importCell(cells[i]); });
    if (c.every(function (v) { return v === ""; })) return null;

    const row = {
      account: c[0], name: c[1], dept: c[2], role: c[3], password: c[4],
      empNo: c[5], dial: c[6], phone: c[7], email: c[8], intlSms: c[9], enabled: c[10]
    };
    const errs = [];

    // 帳號
    if (!row.account) errs.push("帳號為必填");
    else if (!/^[A-Za-z0-9]+$/.test(row.account)) errs.push(IMPORT_MSG_ACCOUNT);
    else if (row.account.length > 50) errs.push(IMPORT_MSG_ACCOUNT);
    else if (ACCOUNTS.some(function (a) { return a.account.toLowerCase() === row.account.toLowerCase(); })) errs.push("帳號已存在");
    else if (seen.accounts[row.account.toLowerCase()]) errs.push("檔案內有重複的帳號");
    if (row.account) seen.accounts[row.account.toLowerCase()] = true;

    // 姓名
    if (!row.name) errs.push("姓名為必填");
    else if (row.name.length > 50) errs.push("姓名不可超過 50 字");

    // 部門：必須是系統裡已存在的部門
    if (!row.dept) errs.push("部門為必填");
    else if (row.dept.length > 15) errs.push(IMPORT_MSG_DEPT);
    else if (!DEPARTMENTS.some(function (d) { return d.name === row.dept; })) errs.push(IMPORT_MSG_DEPT);

    // 角色：只收 0／1，企業管理員不可匯入
    if (!row.role) errs.push("角色為必填");
    else if (row.role !== "0" && row.role !== "1") errs.push("角色只能填 1（部門管理員）或 0（一般使用者）");

    // 密碼
    if (!row.password) errs.push("密碼為必填");
    else if (!IMPORT_PWD_RE.test(row.password)) errs.push("密碼需 8～16 碼且含大小寫英文與數字");

    // 員工編號（選填）
    if (row.empNo && row.empNo.length > 50) errs.push("員工編號不可超過 50 字");

    // 國碼＋手機
    if (!row.dial) errs.push("國碼為必填");
    else if (!importIsValidDial(row.dial)) errs.push("無效的國碼");
    if (!row.phone) errs.push("手機為必填");
    else if (row.dial && importIsValidDial(row.dial) && !phoneFormatOk(row.dial, row.phone)) errs.push("手機格式錯誤");
    else if (row.dial && importIsValidDial(row.dial)) {
      /* 一個手機號碼只能綁一個帳號——比照帳號欄的兩層檢查：先比系統裡既有的帳號，
         再比同一份檔案內部（檔案自己重複的話兩筆都進不去，光比系統是抓不到的）。
         國碼無效時不做這層，避免同一格同時噴「無效的國碼」跟「已被使用」兩種錯。 */
      const pk = phoneKeyFromDial(row.dial, row.phone);
      if (ACCOUNTS.some(function (a) { return phoneKey(a.countryIso, a.phone) === pk; })) errs.push("手機號碼已被使用");
      else if (seen.phones[pk]) errs.push("檔案內有重複的手機號碼");
      seen.phones[pk] = true;
    }

    // 電子信箱
    if (!row.email) errs.push("電子信箱為必填");
    else if (!IMPORT_EMAIL_RE.test(row.email)) errs.push("請輸入正確的 E-mail 格式");

    // 兩個選填的數字欄：留空用預設值
    if (row.intlSms === "") row.intlSms = "0";
    else if (row.intlSms !== "0" && row.intlSms !== "1") errs.push("開啟國際簡訊只能填 1（開）或 0（關）");
    if (row.enabled === "") row.enabled = "1";
    else if (row.enabled !== "0" && row.enabled !== "1") errs.push("啟用帳號只能填 1（啟用）或 0（停用）");

    row.err = errs.length ? errs.join("、") : null;
    return row;
  }

  /* 整份檔案的處理：先檔案層級檢查（擋下就不進名單），再逐列驗證。
     回傳 { fileError } 或 { rows }。 */
  function buildImportRows(sheetRows) {
    if (!sheetRows || sheetRows.length === 0) {
      return { fileError: { title: "檔案沒有內容", detail: "這個檔案是空的，請下載範例檔後填寫再上傳。" } };
    }
    // 標頭比對：欄位名與順序都要跟範例檔一致
    const head = (sheetRows[0] || []).map(importCell);
    const headOk = IMPORT_HEADERS.every(function (h, i) { return importHeaderMatch(head[i], h); });
    if (!headOk) {
      return { fileError: {
        title: "欄位標頭不符",
        detail: "第一列的欄位名稱與範例檔不一致（應為：" + IMPORT_HEADERS.join("、") + "），請下載範例檔後依格式填寫，標頭請勿刪改。"
      } };
    }
    const body = sheetRows.slice(1);
    const seen = { accounts: {}, phones: {} };
    const rows = [];
    for (let i = 0; i < body.length; i++) {
      const r = validateImportRow(body[i], seen);
      if (!r) continue;      // null＝整列空白，自動略過
      /* 記下在 Excel 裡的實際列號：標頭佔第 1 列，所以 body 的第 0 筆是第 2 列。
         名單會依「可匯入置頂」重新排序，列號因此會跳號——那是刻意的，
         使用者要的是「回 Excel 第幾列去改」，不是「這是第幾筆」。
         整列空白被略過時列號也不會被壓縮，仍對得回原檔。 */
      r.excelRow = i + 2;
      rows.push(r);
    }
    if (rows.length === 0) {
      return { fileError: { title: "檔案沒有資料", detail: "只有標頭沒有任何資料列，請填寫後再上傳。" } };
    }
    if (rows.length > IMPORT_MAX_ROWS) {
      return { fileError: { title: "超過單次匯入上限", detail: "這個檔案有 " + rows.length + " 筆，單次最多 " + IMPORT_MAX_ROWS + " 筆，請分批匯入。" } };
    }
    /* 可匯入的排在最前面、有問題的集中在下方——使用者先確認要匯入誰，
       要修的錯誤集中在一起看。sort 在現代瀏覽器是穩定排序，所以同一組內
       仍維持檔案裡原本的列順序。 */
    rows.sort(function (a, b) { return (a.err ? 1 : 0) - (b.err ? 1 : 0); });
    const okCount = rows.filter(function (r) { return !r.err; }).length;
    const remain = ACCOUNT_MAX_TOTAL - ACCOUNTS.length;
    if (okCount > remain) {
      return { fileError: {
        title: "超過帳號數上限",
        detail: "貴公司帳號上限為 " + ACCOUNT_MAX_TOTAL + " 個，目前已使用 " + ACCOUNTS.length + " 個，尚可新增 " + remain + " 個，但這份檔案有 " + okCount + " 筆可匯入。"
      } };
    }
    return { rows: rows };
  }

  /* 上傳當下就能判斷的檔案層級錯誤（不必解析內容）。
     欄位標頭、空資料、筆數上限、帳號數上限這幾種要讀完檔案才知道，
     由 buildImportRows() 在解析後回報。 */
  function detectFileLevelError(file) {
    const name = (file.name || "").toLowerCase();
    if (!/\.(xlsx|xls)$/.test(name)) {
      return { title: "檔案格式不支援", detail: "請上傳 .xlsx 或 .xls 檔案。" };
    }
    if (file.size === 0) {
      return { title: "檔案沒有內容", detail: "這個檔案是空的，請確認後重新上傳。" };
    }
    return null;
  }

  // 角色代碼 → 畫面文字；不合法的值原樣顯示，讓使用者看得出自己填了什麼
  function importRoleLabel(v) {
    if (v === "1") return "部門管理員";
    if (v === "0") return "一般使用者";
    return v;
  }
  /* 名單／結果頁的手機欄＝「+國碼 號碼」，跟匯入後實際存進系統的國際格式一致。
     缺國碼或缺號碼時只顯示有填的那半，讓使用者一眼看出少了哪一段。 */
  function importPhoneDisplay(r) {
    if (!r.dial && !r.phone) return "";
    if (!r.dial) return r.phone;
    if (!r.phone) return "+" + r.dial;
    return "+" + r.dial + " " + r.phone;
  }

  // 匯入中每一列的狀態格：等待／處理中（轉圈）／成功／失敗
  function importStateCell(r) {
    if (r.state === "done") return '<span class="state-ok">' + icon("check") + '成功</span>';
    if (r.state === "failed") return '<span class="state-fail">' + icon("x") + '失敗</span>';
    if (r.state === "processing") return '<span class="state-run"><span class="spinner"></span>處理中</span>';
    return '<span class="state-wait">等待中</span>';
  }

  /* 逐筆寫入的模擬。
     ⚠️ 實際寫入與錯誤處理待正式開發：這裡用 setTimeout 一筆一筆延遲，模擬打 API 的過程；
     正式版換成真的逐筆（或分批）呼叫後端，並依回傳結果標記每一列。
     兩種失敗刻意分開：
       ① 格式失敗 —— 上傳後的格式檢查就抓出來了，根本不會進到這個佇列
       ② 系統失敗 —— 格式沒問題、但寫入時網路／逾時／伺服器出錯，只可能發生在這一段
     原型用隨機挑 1～2 筆標記成系統失敗來示範這個狀態。 */
  const IMPORT_ROW_DELAY = 320;   // 每筆的模擬耗時（ms）

  function startImportRun() {
    const queue = (orgState.importRows || []).filter(function (r) { return !r.err; });
    queue.forEach(function (r) { r.state = "wait"; r.sysFail = false; });
    // 隨機挑 1～2 筆當系統失敗（筆數少時最多 1 筆），示範跟格式錯誤不同的失敗類型
    const failCount = queue.length >= 5 ? 1 + Math.floor(Math.random() * 2) : (queue.length >= 2 ? 1 : 0);
    const picked = {};
    while (Object.keys(picked).length < failCount) picked[Math.floor(Math.random() * queue.length)] = true;
    Object.keys(picked).forEach(function (i) { queue[i].sysFail = true; });

    orgState.importQueue = queue;
    orgState.importCursor = 0;
    orgState.importStopped = false;
    orgState.importStep = "importing";
    paintImportModal();
    // 立刻開始跑第一筆——原本等一個完整的 IMPORT_ROW_DELAY 才動，
    // 進畫面會先看到整排「等待中」不動，像卡住
    setTimeout(stepImportRun, 80);
  }

  // 只改動當前這一列的狀態格與底部進度，不整塊重畫（避免每筆都閃一下、捲動位置被重置）
  function paintImportRow(i) {
    const cell = document.getElementById("impState" + i);
    if (cell) cell.innerHTML = importStateCell(orgState.importQueue[i]);
    const prog = document.getElementById("impProgress");
    if (prog) {
      const q = orgState.importQueue;
      const done = q.filter(function (r) { return r.state === "done" || r.state === "failed"; }).length;
      prog.textContent = "(" + done + "/" + q.length + ")";
    }
  }

  function stepImportRun() {
    const q = orgState.importQueue || [];
    const i = orgState.importCursor;
    if (orgState.importStopped || i >= q.length) { finishImportRun(); return; }
    q[i].state = "processing";
    paintImportRow(i);
    setTimeout(function () {
      if (orgState.importStopped) { finishImportRun(); return; }
      const r = q[i];
      if (r.sysFail) {
        r.state = "failed";
        r.runErr = "匯入失敗，請重試";   // 系統失敗：跟格式錯誤分開的失敗原因
      } else {
        createAccountFromImportRow(r);
        r.state = "done";
      }
      paintImportRow(i);
      orgState.importCursor = i + 1;
      setTimeout(stepImportRun, 60);
    }, IMPORT_ROW_DELAY);
  }

  function createAccountFromImportRow(r) {
    const dept = DEPARTMENTS.find(function (d) { return d.name === r.dept; });
    const country = COUNTRY_CODES.find(function (c) { return c.dial === r.dial; });
    // 台灣門號去掉開頭的 0 再存，跟表單建立的帳號格式一致（+886912345678）
    const phone = r.dial === "886" ? r.phone.replace(/^0/, "") : r.phone;
    ACCOUNTS.push({
      id: "imp" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      status: r.enabled === "0" ? "disabled" : "active",
      name: r.name, account: r.account,
      deptId: dept ? dept.id : null,
      role: r.role === "1" ? "deptManager" : "user",
      empNo: r.empNo,
      countryIso: country ? country.iso : "TW",
      phone: phone, email: r.email,
      intlSms: r.intlSms === "1"
    });
  }

  /* 2026-08-17 Alvie 定案：結果頁只呈現「實際進入匯入的列」。
     格式錯誤的列在前一段（檢視名單）就已經被略過、不進佇列，也不該出現在結果頁——
     舊版拿 orgState.importRows（原始全部列）當來源，是為了讓使用者看到「完整全貌」，
     那個設計已經廢除：兩種失敗混在同一張表裡，會讓「共 N 筆」變成上傳總數、
     失敗原因欄還印出格式錯誤文案，跟「這一頁只講寫入結果」的定位衝突。 */
  function finishImportRun() {
    const rows = importValidRows();   // ＝實際進入匯入佇列的那批（不含格式錯誤列）
    const ok = rows.filter(function (r) { return r.state === "done"; }).length;
    // 系統失敗＝格式沒問題、但寫入時出錯（網路／逾時／伺服器），只可能發生在匯入那一段
    const sysFail = rows.filter(function (r) { return !!r.runErr; }).length;
    /* 成功置頂 → 系統失敗 → 中途停止未處理的排最後，
       使用者一眼先看到「成功了幾筆」，要處理的集中在下半部。 */
    const sorted = rows.slice().sort(function (a, b) {
      const rank = function (r) {
        if (r.state === "done") return 0;
        if (r.runErr) return 1;
        return 2;   // 按了停止、還沒輪到的
      };
      return rank(a) - rank(b);
    });
    /* 【不留個資】Audit Log 只記筆數，沒有任何欄位內容。
       口徑跟結果頁一致：總數＝進入匯入的筆數，失敗數只算系統失敗，
       前一段略過的格式錯誤列完全不記（它們沒有進入匯入，不是這筆操作的結果）。
       中途停止時 總數 ≠ 成功＋失敗，差額是「還沒輪到」的，用後面那個標記說明。 */
    addAuditEntry({
      cat: "data", action: "匯入帳號", target: null,
      desc: "匯入 " + rows.length + " 筆，成功 " + ok + " 筆、失敗 " + sysFail + " 筆" +
            (orgState.importStopped ? "（中途停止）" : "")
    });
    orgState.importResult = { rows: sorted, ok: ok, sysFail: sysFail, stopped: orgState.importStopped };
    orgState.importStep = "result";
    paintImportModal();
  }

  function importValidRows() {
    return (orgState.importRows || []).filter(function (r) { return !r.err; });
  }

  function renderImportBody() {
    const st = orgState.importStep || "upload";

    // ---- 離開確認：第二／三段中途要關閉時，先問一次再走（名單不會保留）----
    if (st === "leave") {
      return '<h3>要離開匯入嗎？</h3>' +
        '<p>已上傳的名單不會保留，關閉後需要重新上傳檔案。</p>' +
        '<div class="cm-foot"><button class="btn btn-secondary" id="leaveStay">繼續匯入</button>' +
        '<button class="btn btn-danger" id="leaveConfirm">離開</button></div>';
    }

    const head = '<div class="cm-head"><h3>匯入帳號</h3>' +
      '<button class="drawer-close" id="importClose">' + icon("x") + '</button></div>';

    // ---- 第二段：檢視名單 ----
    if (st === "review") {
      const rows = orgState.importRows || [];
      const okCount = importValidRows().length;
      const f = orgState.importFile || {};
      let html = head;
      /* 可匯入 0 筆＝整份都是格式錯誤：直接擋在這裡，不讓它進「匯入中」空跑一輪。
         名單照樣列出來（含每列原因）給使用者對照著修，並提供「重新上傳」直接換一份檔案。 */
      if (okCount === 0) {
        html += '<div class="import-blocked">' + icon("circleAlert") +
          '<div><b>這份檔案沒有任何一筆可以匯入</b><br>' + rows.length +
          ' 筆全部有格式問題，請依下方的錯誤原因修正後重新上傳。</div></div>';
      } else {
        html += '<div class="import-summary">' +
          '<span>可匯入 <span class="is-ok">' + okCount + '</span> 筆</span>' +
          '<span class="is-sep">/</span>' +
          '<span>共 ' + rows.length + ' 筆</span>' +
          (rows.length - okCount > 0 ? '<span class="is-bad">（' + (rows.length - okCount) + ' 筆有問題，將略過）</span>' : "") +
          '<span class="is-file">' + icon("fileSheet") + escAttr(f.name || "") + '</span>' +
          '</div>';
      }

      const cells = rows.map(function (r, i) {
        const bad = !!r.err;
        const val = function (v) {
          return v ? '<span class="cell-val">' + escAttr(v) + '</span>' : '<span class="empty-val">—</span>';
        };
        return '<tr' + (bad ? ' class="is-invalid"' : "") + '>' +
          '<td class="col-no">' + (r.excelRow || "") + '</td>' +
          '<td>' + val(r.account) + '</td>' +
          '<td>' + val(r.name) + '</td>' +
          '<td>' + val(r.dept) + '</td>' +
          '<td>' + val(importRoleLabel(r.role)) + '</td>' +
          '<td>' + val(r.empNo) + '</td>' +
          '<td>' + val(importPhoneDisplay(r)) + '</td>' +
          '<td>' + val(r.email) + '</td>' +
          '<td>' + (bad ? '<span class="err-text">' + escAttr(r.err) + '</span>' : "") + '</td>' +
          // 叉叉只給「格式正確」的列：讓使用者排除不想匯入的人。
          // 有錯的列本來就不會被匯入，要修得回 Excel 改，給叉叉反而讓人以為點了就解決了
          '<td class="col-x">' + (bad ? "" :
            '<button class="row-remove" data-import-remove="' + i + '" aria-label="移除這一列">' + icon("x") + '</button>') + '</td>' +
          '</tr>';
      }).join("");

      // 欄寬：9 欄擠在 1100 的 modal 裡，E-mail 與錯誤原因拿最大兩份（其餘欄內容長度固定）
      // 「列」＝該筆在 Excel 檔裡的列號，方便回去修改；多這一欄，其餘 9 欄等比讓出 5%
      /* 2026-08-17：叉叉欄 4% → 6%（詳細推導見 .import-list .col-x 的 CSS 註解）。
         4%≈42px 放不下 28px 按鈕＋左右內距，按鈕溢出後 overlay 捲動軸就壓到它。
         6% 換算實際寬度 6/102×1050 ≈ 61.8px，content box 29.8px 剛好容得下按鈕。
         ⚠️ 刻意**不動其他 9 欄的宣告值**（Alvie 指定不要改別欄欄寬）——總和變成 102%，
         由瀏覽器等比正規化，多出來的 2% 由 9 欄一起分攤（每欄縮約 2%、最寬的 E-mail
         少約 3px），而不是挑某一欄單獨犧牲。 */
      html += '<div class="import-list"><table><thead><tr>' +
        '<th style="width:5%">列</th>' +
        '<th style="width:11%">帳號</th><th style="width:9%">姓名</th><th style="width:9%">部門</th>' +
        '<th style="width:10%">角色</th><th style="width:9%">員工編號</th><th style="width:12%">手機</th>' +
        '<th style="width:16%">E-mail</th><th style="width:15%">錯誤原因</th><th style="width:6%"></th>' +
        '</tr></thead><tbody>' + cells + '</tbody></table></div>';

      html += '<div class="cm-foot"><button class="btn btn-secondary" id="importBack">取消</button>' +
        (okCount === 0 ? '<button class="btn btn-secondary" id="importReupload">重新上傳</button>' : "") +
        '<button class="btn btn-primary" id="importConfirm"' + (okCount === 0 ? " disabled" : "") + '>確定匯入</button></div>';
      return html;
    }

    // ---- 匯入中：逐筆寫入的進度頁 ----
    if (st === "importing") {
      const q = orgState.importQueue || [];
      const done = q.filter(function (r) { return r.state === "done" || r.state === "failed"; }).length;
      let html = head;
      html += '<div class="import-summary"><span>正在寫入帳號，請不要關閉這個視窗。</span></div>';
      const cells = q.map(function (r, i) {
        const val = function (v) { return v ? '<span class="cell-val">' + escAttr(v) + '</span>' : '<span class="empty-val">—</span>'; };
        return '<tr id="impRow' + i + '">' +
          '<td class="col-no">' + (r.excelRow || "") + '</td>' +
          '<td class="col-state" id="impState' + i + '">' + importStateCell(r) + '</td>' +
          '<td>' + val(r.account) + '</td>' +
          '<td>' + val(r.name) + '</td>' +
          '<td>' + val(r.dept) + '</td>' +
          '<td>' + val(importRoleLabel(r.role)) + '</td>' +
          '<td>' + val(importPhoneDisplay(r)) + '</td>' +
          '<td>' + val(r.email) + '</td>' +
          '</tr>';
      }).join("");
      html += '<div class="import-list"><table><thead><tr>' +
        '<th style="width:5%">列</th>' +
        '<th style="width:11%">狀態</th><th style="width:13%">帳號</th><th style="width:11%">姓名</th>' +
        '<th style="width:11%">部門</th><th style="width:12%">角色</th><th style="width:16%">手機</th>' +
        '<th style="width:21%">電子信箱</th>' +
        '</tr></thead><tbody>' + cells + '</tbody></table></div>';
      html += '<div class="cm-foot" style="justify-content:space-between">' +
        '<div class="import-progress">正在匯入中 <span class="ip-num" id="impProgress">(' + done + '/' + q.length + ')</span></div>' +
        '<button class="btn btn-secondary" id="importStop">停止</button></div>';
      return html;
    }

    // ---- 第三段：結果 ----
    if (st === "result") {
      const res = orgState.importResult || { rows: [], ok: 0 };
      let html = head;
      /* 「共 N 筆」＝實際進入匯入的筆數（res.rows 已經只有這批，見 finishImportRun），
         不是原始上傳總數——前一段略過的格式錯誤列不屬於這次寫入的結果。
         「N 筆未匯入」＝系統失敗＋按了停止還沒輪到的，兩者都確實沒被建立；
         格式錯誤列不在 res.rows 裡，所以不可能被算進來。 */
      const notImported = res.rows.length - res.ok;
      html += '<div class="import-summary">' +
        '<span>匯入成功 <span class="is-ok">' + res.ok + '</span> 筆</span>' +
        '<span class="is-sep">/</span><span>共 ' + res.rows.length + ' 筆</span>' +
        (notImported > 0 ? '<span class="is-bad">（' + notImported + ' 筆未匯入）</span>' : "") +
        (res.stopped ? '<span class="is-bad">· 已中途停止</span>' : "") +
        '</div>';
      const cells = res.rows.map(function (r) {
        /* 結果一律看 r.state，不能只看有沒有錯誤原因——中途停止時，
           還沒輪到的那些列既沒有系統失敗也沒有成功，但它們並沒有被建立。
           三種結果：成功（已寫入）／失敗（系統失敗）／未處理（按了停止）。
           ⚠️ 這裡只認 r.runErr（系統失敗），**刻意不看 r.err**（格式錯誤）——
           來源已不含格式錯誤列，再判斷它只會讓格式文案有機會漏進這一頁。 */
        const isDone = r.state === "done";
        const isFail = !!r.runErr;
        const reason = r.runErr || (isDone ? "" : "已停止，這一筆未處理");
        const bad = isFail;
        const val = function (v) { return v ? '<span class="cell-val">' + escAttr(v) + '</span>' : '<span class="empty-val">—</span>'; };
        return '<tr' + (bad ? ' class="is-invalid"' : "") + '>' +
          '<td class="col-no">' + (r.excelRow || "") + '</td>' +
          '<td class="col-state">' + (isDone
            ? '<span class="state-ok">' + icon("check") + '成功</span>'
            : (isFail ? '<span class="state-fail">' + icon("x") + '失敗</span>'
                      : '<span class="state-wait">未處理</span>')) + '</td>' +
          '<td>' + val(r.account) + '</td>' +
          '<td>' + val(r.name) + '</td>' +
          '<td>' + val(r.dept) + '</td>' +
          '<td>' + val(importRoleLabel(r.role)) + '</td>' +
          '<td>' + val(importPhoneDisplay(r)) + '</td>' +
          '<td>' + val(r.email) + '</td>' +
          '<td>' + (reason
            ? '<span class="' + (bad ? "err-text" : "state-wait") + '">' + escAttr(reason) + '</span>'
            : "") + '</td>' +
          '</tr>';
      }).join("");
      html += '<div class="import-list"><table><thead><tr>' +
        '<th style="width:5%">列</th>' +
        '<th style="width:9%">結果</th><th style="width:12%">帳號</th><th style="width:10%">姓名</th>' +
        '<th style="width:10%">部門</th><th style="width:11%">角色</th><th style="width:14%">手機</th>' +
        '<th style="width:15%">電子信箱</th><th style="width:14%">失敗原因</th>' +
        '</tr></thead><tbody>' + cells + '</tbody></table></div>';
      html += '<div class="cm-foot"><button class="btn btn-primary" id="importFinish">完成</button></div>';
      return html;
    }

    // ---- 第一段：上傳 ----
    const f = orgState.importFile;
    const fe = orgState.importFileError;
    let html = head;
    html += '<p>上傳 Excel 檔案一次建立多筆子帳號。</p>';

    if (f && !fe) {
      html += '<div class="file-row">' + icon("fileSheet") +
        '<span class="fr-name">' + escAttr(f.name) + '</span>' +
        '<span class="fr-size">' + f.size + '</span>' +
        '<button id="importRemove" title="移除檔案">' + icon("x") + '</button></div>';
    } else {
      // icon 用 download（向下箭頭）：這一區的語意是「把資料匯入進系統」
      html += '<div class="dropzone" id="importDrop">' + icon("download") +
        '<div><button class="btn btn-secondary btn-sm" id="importPick">選擇檔案</button></div>' +
        '<div class="dz-hint">或將檔案拖曳到這裡（支援 .xlsx／.xls）</div>' +
        '</div>';
    }

    // 檔案層級錯誤：整份擋在這一段，不讓它進名單檢視
    if (fe) {
      html += '<div class="file-error">' + icon("circleAlert") +
        '<div><b>' + escAttr(fe.title) + '</b><br>' + escAttr(fe.detail) + '</div></div>';
    }

    // 「下載範例檔」不掛 icon：站內的 .btn-text 文字連結一律無圖示，
    // 而且這裡若用 download icon 會跟上方「匯入」按鈕的圖示完全一樣、語意反而混淆
    html += '<div style="margin-top:14px"><button class="btn-text" id="importSample">下載範例檔</button></div>';
    html += '<div class="cm-foot"><button class="btn btn-secondary" id="importCancel">取消</button>' +
      '<button class="btn btn-primary" id="importNext"' + (f && !fe ? "" : " disabled") + '>確定</button></div>';
    return html;
  }

  function openImportModal() {
    resetImportState();
    paintImportModal();
    document.getElementById("orgConfirmMask").classList.add("open");
  }
  function resetImportState() {
    orgState.importStep = "upload";
    orgState.importFile = null;
    orgState.importFileRaw = null;
    orgState.importFileError = null;
    orgState.importRows = null;
    orgState.importQueue = null;
    orgState.importCursor = 0;
    orgState.importStopped = true;   // 保險：關閉時讓還在跑的迴圈停下來
    orgState.importResult = null;
  }
  function closeImportModal() {
    document.getElementById("orgConfirmMask").classList.remove("open");
    // 【不留個資】關掉就把整份名單從記憶體清掉，不留在 state 裡
    resetImportState();
  }
  /* 想關閉時的統一入口：已經進到名單檢視（或之後的結果頁）才需要攔一次，
     還在上傳段就沒有東西會弄丟，直接關 */
  function requestCloseImport() {
    if (orgState.importStep === "review" || orgState.importStep === "importing" || orgState.importStep === "result") {
      orgState.importStepBeforeLeave = orgState.importStep;
      orgState.importStep = "leave";
      paintImportModal();
      return;
    }
    closeImportModal();
  }
  // 重畫 modal 內容並重新綁事件（各段共用同一個節點，狀態一換就整塊重畫）
  function paintImportModal() {
    const mask = document.getElementById("orgConfirmMask");
    // 名單檢視要放 9 欄，用更寬的 is-xwide；上傳／離開確認維持窄版
    // ⚠️ importing 一定要一起列進來：漏掉的話 loading 會掉回 480px 的窄版，
    // 欄位被擠到嚴重換行，跟前後兩段的 modal 大小也對不起來
    const wide = (orgState.importStep === "review" || orgState.importStep === "importing" || orgState.importStep === "result")
      ? "is-xwide" : "is-wide";
    mask.innerHTML = '<div class="confirm-modal ' + wide + '">' + renderImportBody() + '</div>';
    wireImportModal();
  }
  function wireImportModal() {
    const on = function (id, fn) {
      const el = document.getElementById(id);
      if (el) el.addEventListener("click", fn);
    };

    on("importClose", requestCloseImport);
    on("importCancel", closeImportModal);   // 第一段：沒有東西會弄丟，直接關
    on("importBack", requestCloseImport);   // 第二段的「取消」＝離開整個匯入，要問一次

    // 離開確認
    on("leaveStay", function () {
      orgState.importStep = orgState.importStepBeforeLeave || "review";
      paintImportModal();
    });
    on("leaveConfirm", closeImportModal);

    // 第一段 →（解析示意）→ 第二段
    on("importNext", async function () {
      const btn = document.getElementById("importNext");
      if (!orgState.importFileRaw || orgState.importFileError) return;
      btn.disabled = true;
      btn.textContent = "讀取中…";
      try {
        // 真的解析上傳的 xlsx（見上方 readXlsxRows），再逐列套驗證規則
        const buf = await orgState.importFileRaw.arrayBuffer();
        const sheetRows = await readXlsxRows(buf);
        const result = buildImportRows(sheetRows);
        if (result.fileError) {
          orgState.importFileError = result.fileError;
          paintImportModal();
          return;
        }
        orgState.importRows = result.rows;
        orgState.importStep = "review";
        paintImportModal();
      } catch (e) {
        // 解析失敗（不是有效的 xlsx／舊版 .xls 二進位格式／檔案毀損）
        orgState.importFileError = {
          title: "無法讀取這個檔案",
          detail: "檔案可能不是有效的 Excel 活頁簿，或格式為舊版 .xls。請用 Excel 另存為 .xlsx 後再上傳。"
        };
        paintImportModal();
      }
    });

    on("importRemove", function () {
      orgState.importFile = null;
      orgState.importFileRaw = null;
      orgState.importFileError = null;
      paintImportModal();
    });

    /* 下載範例檔：assets/account-import-sample.xlsx 是真的檔案（用 openpyxl 產生，
       含「帳號匯入清單」與「欄位說明」兩個工作表），不是佔位。
       用 <a download> 指定中文檔名——這是真實檔案 URL 不是 blob，Safari 對 download
       屬性的支援沒問題（登入前頁面備用碼下載那個 blob 的坑不適用於這裡）。 */
    on("importSample", function () {
      const a = document.createElement("a");
      a.href = "assets/account_import.xlsx";
      a.download = "account_import.xlsx";
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast("已下載範例檔");
    });

    // 名單逐列移除
    document.querySelectorAll("[data-import-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const i = parseInt(btn.getAttribute("data-import-remove"), 10);
        orgState.importRows.splice(i, 1);
        if (orgState.importRows.length === 0) {
          // 整份被移光就退回上傳段，不留一個空表在那裡
          orgState.importStep = "upload";
          orgState.importFile = null;
        }
        paintImportModal();
      });
    });

    // 第二段 →「匯入中」：實際建立帳號改在 loading 那一段逐筆進行（見 startImportRun）
    on("importConfirm", function () {
      if (importValidRows().length === 0) return;   // 0 筆時按鈕本來就 disabled，這裡再保一道
      startImportRun();
    });

    // 可匯入 0 筆時的「重新上傳」：回到上傳段並清掉這份檔案
    on("importReupload", function () {
      orgState.importStep = "upload";
      orgState.importFile = null;
      orgState.importFileRaw = null;
      orgState.importFileError = null;
      orgState.importRows = null;
      paintImportModal();
    });

    // 停止：已處理的保留，未處理的維持「等待中」，直接進結果頁
    on("importStop", function () {
      orgState.importStopped = true;
      const btn = document.getElementById("importStop");
      if (btn) { btn.disabled = true; btn.textContent = "停止中…"; }
    });

    on("importFinish", function () {
      const ok = (orgState.importResult || {}).ok || 0;
      closeImportModal();
      renderContent();   // 回到帳號列表，新帳號會出現在裡面
      showToast("已匯入 " + ok + " 筆帳號");
    });

    // 選檔：用隱藏的 file input，真的讀使用者選的檔名／大小（不解析內容）
    on("importPick", function () {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".xlsx,.xls";
      input.addEventListener("change", function () {
        if (this.files && this.files[0]) acceptImportFile(this.files[0]);
      });
      input.click();
    });

    // 拖曳：dragover 要 preventDefault，否則瀏覽器會直接開啟被拖進來的檔案
    const drop = document.getElementById("importDrop");
    if (drop) {
      drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("is-over"); });
      drop.addEventListener("dragleave", function () { drop.classList.remove("is-over"); });
      drop.addEventListener("drop", function (e) {
        e.preventDefault();
        drop.classList.remove("is-over");
        if (e.dataTransfer.files && e.dataTransfer.files[0]) acceptImportFile(e.dataTransfer.files[0]);
      });
    }
  }
  function acceptImportFile(file) {
    const kb = file.size / 1024;
    orgState.importFileRaw = file;   // 留住檔案本體，按「確定」時才真的解析
    orgState.importFile = {
      name: file.name,
      size: kb >= 1024 ? (kb / 1024).toFixed(1) + " MB" : Math.max(1, Math.round(kb)) + " KB"
    };
    // 檔案層級錯誤在這一刻就判斷，擋在上傳段（不進名單檢視）
    orgState.importFileError = detectFileLevelError(file);
    paintImportModal();
  }

  // ---- 角色 → 可用功能即時預覽 ----
  function renderPermPreview(role) {
    const active = featuresForRole(role);
    const items = allPermItems().map(function (item) {
      const on = active.indexOf(item.label) !== -1;
      return '<span class="perm-item' + (on ? "" : " is-off") + '">' + (on ? icon("check") : "") + item.label + '</span>';
    }).join("");
    return '<div class="perm-preview"><div class="pp-title">' + icon("idCard") + '此身份可用功能</div><div class="perm-list">' + items + '</div></div>';
  }

  // ---- 建立／編輯帳號 Drawer ----
  function openAccountDrawer(accountId) {
    orgState.editingId = accountId || null;
    const acct = accountId ? ACCOUNTS.find(function (a) { return a.id === accountId; }) : null;
    const isEdit = !!acct;
    const isAdmin = state.demoRole === "companyAdmin";
    const roleChoices = allowedRoleOptions();
    const scopedDepts = DEPARTMENTS.filter(function (d) { return isAdmin || d.id === DEMO_DEPT_FOR_MANAGER; });
    // 防呆：入口已經有 requestNewAccount 擋著，這裡再判一次空陣列——日後多一個
    // 呼叫點忘了擋，最壞只是部門下拉空白，不會像原本那樣整個 TypeError 開不起來
    const defaultDept = isAdmin ? (scopedDepts[0] ? scopedDepts[0].id : null) : DEMO_DEPT_FOR_MANAGER;

    const deptOptions = scopedDepts.map(function (d) { return { value: d.id, label: d.name }; });
    const initialDept = acct ? acct.deptId : defaultDept;
    const roleOptions = roleChoices.map(function (r) { return { value: r, label: ROLES[r].label }; });
    const countryOptions = COUNTRY_CODES.map(function (c) { return { value: c.iso, label: c.name }; });
    const initialCountry = acct ? acct.countryIso : "TW";
    const initialRole = acct ? acct.role : roleChoices[0];

    let html = '<div class="drawer-head"><h2>' + (isEdit ? "編輯帳號" : "新增帳號") + '</h2>' +
      '<button class="drawer-close" id="drawerClose">' + icon("x") + '</button></div>';
    html += '<div class="drawer-body">';
    // 帳號是唯一識別鍵，建立後鎖死不可改——避免改了帳號但登入紀錄/對外系統對不上
    // 星號維持顯示（Alvie 2026-08-12 確認：disabled 樣式底下星號不衝突，拿掉說明文字/改淡背景就夠了）
    // 2026-08-12：maxlength 改採舊網站實測值（Alvie 提供，非暫定）——帳號 50、姓名 50、
    // 員工編號 50、電子信箱 250、手機 15（純號碼，國碼另外用下拉選，不計入）、部門名稱 15、部門代碼 15
    html += field("account", "帳號", true,
      '<input type="text" id="fAccount" autocomplete="off" maxlength="50"' + (isEdit ? ' disabled class="is-readonly"' : "") + ' value="' + escAttr(acct ? acct.account : "") + '">');
    html += '<div class="field-row">';
    html += field("dept", "部門", true, renderDropdown("fDept", deptOptions, initialDept, { disabled: !isAdmin }));
    html += field("role", "角色", true, renderDropdown("fRole", roleOptions, initialRole, {
      onChange: function (v) { document.getElementById("permPreviewWrap").innerHTML = renderPermPreview(v); }
    }));
    html += '</div>';
    html += '<div id="permPreviewWrap">' + renderPermPreview(initialRole) + '</div>';
    html += field("name", "姓名", true, '<input type="text" id="fName" maxlength="50" value="' + escAttr(acct ? acct.name : "") + '">');
    // 2026-08-19（PM 裁定）：密碼只在「新增」時由母帳號設定，編輯抽屜不做重設密碼，
    // 所以整段（兩個密碼欄＋規則說明）只在新增情境畫出來。編輯時連 DOM 都不存在，
    // 下面 saveAccountFromDrawer 讀值處要一併判空。
    if (!isEdit) {
      html += '<div class="field-row">';
      html += field("pwd", "設定密碼", true, '<input type="password" id="fPwd" maxlength="16" autocomplete="new-password">');
      html += field("pwd2", "再次確認", true, '<input type="password" id="fPwd2" maxlength="16" autocomplete="new-password">');
      html += '</div>';
      html += '<div class="hint" style="margin:-10px 0 16px">長度 8–16 碼，須英數字混合並包含大寫及小寫英文字母</div>';
    }
    html += field("empNo", "員工編號", false, '<input type="text" id="fEmpNo" maxlength="50" value="' + escAttr(acct ? acct.empNo : "") + '">');
    html += '<div class="field-group" data-field="phone"><label>手機<span class="req">*</span></label><div class="field-row">' +
      '<div style="flex:1.5">' + renderDropdown("fCountry", countryOptions, initialCountry, {
        onChange: function (v) { document.getElementById("fDial").textContent = dialDisplay(v); }
      }) + '</div>' +
      '<div class="dial-code" id="fDial">' + dialDisplay(initialCountry) + '</div>' +
      '<input type="tel" id="fPhone" placeholder="手機號碼" style="flex:2" maxlength="15" value="' + escAttr(acct ? acct.phone : "") + '">' +
      '</div><div class="err-msg" id="err-phone" style="display:none"></div></div>';
    html += field("email", "電子信箱", true, '<input type="email" id="fEmail" maxlength="250" value="' + escAttr(acct ? acct.email : "") + '">');
    html += '<div class="field-divider"></div>';
    html += '<div class="toggle-row"><div><div class="tr-label">開啟國際簡訊</div><div class="tr-sub">關閉後此帳號僅能發送台灣門號簡訊</div></div>' + toggleHtml("fIntlSms", acct ? acct.intlSms : false) + '</div>';
    html += '<div class="toggle-row"><div><div class="tr-label">啟用帳號</div><div class="tr-sub">關閉後此帳號將無法登入</div></div>' + toggleHtml("fEnabled", acct ? acct.status === "active" : true) + '</div>';
    html += '</div>';
    // 刪除比照「停用」的收法（列表不放，收進編輯抽屜），放在 footer 最左邊、跟右邊的
    // 取消/儲存拉開距離（space-between），只有編輯既有帳號、且不是企業管理員（母帳號）自己時才出現
    const canDelete = isEdit && acct.role !== "companyAdmin";
    html += '<div class="drawer-foot">';
    html += canDelete ? '<button class="btn-danger-text" id="drawerDelete">刪除帳號</button>' : '<span></span>';
    html += '<div class="drawer-foot-right"><button class="btn btn-secondary" id="drawerCancel">取消</button>' +
      '<button class="btn btn-primary" id="drawerSave">' + (isEdit ? "儲存" : "建立帳號") + '</button></div>';
    html += '</div>';

    document.getElementById("orgDrawer").innerHTML = html;
    document.getElementById("orgDrawerMask").classList.add("open");
    document.getElementById("orgDrawer").classList.add("open");
    wireDrawer();
  }
  function closeDrawer() {
    document.getElementById("orgDrawerMask").classList.remove("open");
    document.getElementById("orgDrawer").classList.remove("open");
  }
  function wireDrawer() {
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
    document.getElementById("drawerCancel").addEventListener("click", closeDrawer);
    ddBind("fDept");
    ddBind("fRole");
    ddBind("fCountry");
    // 帳號格式即時提示，只在新增時掛（編輯頁欄位 disabled，不會有 input 事件）
    if (!orgState.editingId) {
      document.getElementById("fAccount").addEventListener("input", function () {
        if (this.value && !/^[A-Za-z0-9]*$/.test(this.value)) setFieldError("account", "帳號請輸入英文字母或數字");
        else clearFieldError("account");
      });
    }
    document.getElementById("drawerSave").addEventListener("click", saveAccountFromDrawer);
    const delBtn = document.getElementById("drawerDelete");
    if (delBtn) delBtn.addEventListener("click", function () { openConfirm(orgState.editingId, "account"); });
  }
  function saveAccountFromDrawer() {
    clearFieldErrors();
    const accountVal = document.getElementById("fAccount").value.trim();
    const deptVal = ddValue("fDept");
    const roleVal = ddValue("fRole");
    const nameVal = document.getElementById("fName").value.trim();
    // 編輯情境沒有密碼欄（PM 裁定編輯頁不重設密碼），DOM 不存在時取空字串避免炸掉
    const pwdEl = document.getElementById("fPwd");
    const pwd2El = document.getElementById("fPwd2");
    const pwdVal = pwdEl ? pwdEl.value : "";
    const pwd2Val = pwd2El ? pwd2El.value : "";
    const empNoVal = document.getElementById("fEmpNo").value.trim();
    const countryVal = ddValue("fCountry");
    const phoneVal = document.getElementById("fPhone").value.trim();
    const emailVal = document.getElementById("fEmail").value.trim();
    const intlSmsVal = document.getElementById("fIntlSms").checked;
    const enabledVal = document.getElementById("fEnabled").checked;
    const isEdit = !!orgState.editingId;
    const pwdRe = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{8,16}$/;
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const accountRe = /^[A-Za-z0-9]+$/;
    let hasError = false;

    if (!accountVal) { setFieldError("account", "請輸入帳號"); hasError = true; }
    else {
      const dup = ACCOUNTS.some(function (a) { return a.account.toLowerCase() === accountVal.toLowerCase() && a.id !== orgState.editingId; });
      if (dup) { setFieldError("account", "此帳號已被使用"); hasError = true; }
      // 帳號格式規則（現行 e8d 既有規則：只能英文字母/數字）只套用在新增，編輯頁帳號欄位
      // disabled、值不會變，既有帳號可能是舊規則建立的（如帶點的 ben.chen），不應該被新規則擋下
      else if (!isEdit) {
        if (!accountRe.test(accountVal)) { setFieldError("account", "帳號請輸入英文字母或數字"); hasError = true; }
        else if (accountVal.length < 4 || accountVal.length > 50) { setFieldError("account", "帳號長度需為 4–50 字元"); hasError = true; }
      }
    }
    if (!nameVal) { setFieldError("name", "請輸入姓名"); hasError = true; }
    if (!deptVal) { setFieldError("dept", "請選擇部門"); hasError = true; }
    if (!roleVal) { setFieldError("role", "請選擇角色"); hasError = true; }
    if (!isEdit) {
      if (!pwdVal) { setFieldError("pwd", "請設定密碼"); hasError = true; }
      else if (!pwdRe.test(pwdVal)) { setFieldError("pwd", "密碼須為 8–16 碼英數混合，含大小寫"); hasError = true; }
      if (pwdVal !== pwd2Val) { setFieldError("pwd2", "兩次密碼輸入不一致"); hasError = true; }
    }
    // 2026-08-12：舊 e8d 這兩欄是必填，補上（原本只有格式沒有必填）
    if (!phoneVal) { setFieldError("phone", "請輸入手機號碼"); hasError = true; }
    /* 格式必須排在重複檢查前面：phoneKey 會把非數字全部濾掉，「abc」正規化後是空字串，
       兩個亂打的帳號會互相被判成「同一支號碼」。先擋格式，非號碼就進不到比對那關。
       規則跟匯入共用同一支 phoneFormatOk（見上方），不另立一套。 */
    else if (!phoneFormatOk(dialFor(countryVal), phoneVal)) { setFieldError("phone", "手機格式錯誤"); hasError = true; }
    // 一個手機號碼只能綁一個帳號（2026-08-19 產品規則）。新增時 orgState.editingId 是 null，
    // 不會等於任何帳號 id，等於整份 ACCOUNTS 都納入比對；編輯時自動排除自己，號碼沒改也不會
    // 被自己擋下。停用中的帳號照樣算佔用（Alvie 2026-08-19 裁定：停用不釋放號碼）。
    else if (ACCOUNTS.some(function (a) {
      return a.id !== orgState.editingId && phoneKey(a.countryIso, a.phone) === phoneKey(countryVal, phoneVal);
    })) { setFieldError("phone", "此手機號碼已被使用"); hasError = true; }
    if (!emailVal) { setFieldError("email", "請輸入電子信箱"); hasError = true; }
    else if (!emailRe.test(emailVal)) { setFieldError("email", "請輸入正確的 E-mail 格式"); hasError = true; }
    if (hasError) return;

    if (isEdit) {
      const acct = ACCOUNTS.find(function (a) { return a.id === orgState.editingId; });
      acct.account = accountVal; acct.deptId = deptVal; acct.role = roleVal; acct.name = nameVal;
      acct.empNo = empNoVal; acct.countryIso = countryVal; acct.phone = normalizePhoneInput(countryVal, phoneVal); acct.email = emailVal;
      acct.intlSms = intlSmsVal; acct.status = enabledVal ? "active" : "disabled";
      showToast("已儲存「" + nameVal + "」的變更");
    } else {
      ACCOUNTS.push({
        id: "a" + (nextAccountSeq++), status: enabledVal ? "active" : "disabled", name: nameVal, account: accountVal,
        deptId: deptVal, role: roleVal, empNo: empNoVal, countryIso: countryVal,
        phone: normalizePhoneInput(countryVal, phoneVal), email: emailVal, intlSms: intlSmsVal
      });
      showToast("已建立帳號「" + nameVal + "」");
    }
    closeDrawer();
    renderContent();
  }

  // ---- 停用／啟用／刪除 確認框（沿用系統 Modal 定案：危險/一般確認無 ✕、footer 無分隔線） ----
  // 2026-08-13：帳號的單筆刪除入口從列表移進編輯抽屜（比照「停用」收法），這裡的 kind==="account"
  // 現在只會從抽屜的「刪除帳號」按鈕觸發；批次刪除另外走 openBulkConfirm("delete")。
  // ⚠️ 刪除是硬刪還是改停用還沒跟 PM 確認，所以帳號這條路徑 runConfirm() 只做二次確認 UI 本身、
  // 不真的動資料——department 分支不在這次調整範圍內，維持既有的真刪除行為。
  // 2026-08-14：這件事原本在 modal 裡有一塊黃框 TODO 寫給看原型的人，Alvie 決定拿掉，改口頭說明
  /* 「還沒有任何部門」的擋門（2026-08-19 產品規則：新增子帳號一定要指定部門，
     所以系統裡至少要先有一個部門）。
     文案刻意講「子帳號」不講「帳號」：母帳號（企業管理員）代表公司本身、不隸屬任何
     部門（列表顯示「—（總公司）」），只講「帳號」的話規則當場就有反例——使用者自己
     那個帳號就沒有部門。新增表單的角色下拉本來也選不到企業管理員，從這裡建出來的
     一定是子帳號，措辭跟實際行為對齊。
     原本 openAccountDrawer 會在 scopedDepts[0].id
     直接丟 TypeError、抽屜整個開不起來、畫面毫無回饋，等於按了像壞掉。
     擋在入口而不是把按鈕 disabled：disabled 只告訴使用者「不能按」，不會告訴他
     去哪裡解決，而且這頁沒有 tooltip 元件（要新做就變成擴充設計系統）。
     殼沿用刪除確認的 .confirm-modal／.cm-foot，沒有新樣式。 */
  function hasAnyDeptInScope() {
    if (state.demoRole === "companyAdmin") return DEPARTMENTS.length > 0;
    return DEPARTMENTS.some(function (d) { return d.id === DEMO_DEPT_FOR_MANAGER; });
  }
  function openNoDeptModal(action) {
    // 只有企業管理員能建部門，所以只有他拿得到「前往部門管理」這顆 CTA；
    // 部門管理員點過去也是唯讀，給了反而更困惑，改成單一「知道了」收掉
    const isAdmin = state.demoRole === "companyAdmin";
    const body = action === "import"
      ? "匯入的每一筆子帳號都必須指定所屬部門，請先建立至少一個部門。"
      : "新增子帳號時必須指定所屬部門，請先建立至少一個部門。";
    let foot = '<div class="cm-foot">';
    foot += isAdmin
      ? '<button class="btn btn-secondary" id="noDeptCancel">取消</button>' +
        '<button class="btn btn-primary" id="noDeptGo">前往部門管理</button>'
      : '<button class="btn btn-primary" id="noDeptCancel">知道了</button>';
    foot += '</div>';
    const html = '<div class="confirm-modal"><h3>尚未建立部門</h3><p>' + body + '</p>' + foot + '</div>';
    const mask = document.getElementById("orgConfirmMask");
    mask.innerHTML = html;
    mask.classList.add("open");
    document.getElementById("noDeptCancel").addEventListener("click", closeConfirm);
    const go = document.getElementById("noDeptGo");
    if (go) go.addEventListener("click", function () {
      closeConfirm();
      // 切頁沿用側欄 [data-child] 的既有作法：改 state 再 render()，不另外寫一套導覽
      state.activeTop = "org";
      state.activeChildId = "org-departments";
      state.activeTabIndex = 0;
      render();
    });
  }
  function openConfirm(id, kind) {
    orgState.pendingConfirm = { id: id, kind: kind };
    let title, body;
    if (kind === "department") {
      const dept = DEPARTMENTS.find(function (d) { return d.id === id; });
      title = "刪除部門"; body = "確定要刪除「" + dept.name + "」嗎？此操作無法復原。";
    } else {
      const acct = ACCOUNTS.find(function (a) { return a.id === id; });
      title = "刪除帳號"; body = "確定要刪除「" + acct.name + "」嗎？此操作無法復原。";
    }
    const html = '<div class="confirm-modal"><h3>' + title + '</h3><p>' + body + '</p>' +
      '<div class="cm-foot"><button class="btn btn-secondary" id="confirmCancel">取消</button>' +
      '<button class="btn btn-danger" id="confirmOk">刪除</button></div></div>';
    document.getElementById("orgConfirmMask").innerHTML = html;
    document.getElementById("orgConfirmMask").classList.add("open");
    document.getElementById("confirmCancel").addEventListener("click", closeConfirm);
    document.getElementById("confirmOk").addEventListener("click", runConfirm);
  }
  function closeConfirm() {
    document.getElementById("orgConfirmMask").classList.remove("open");
    orgState.pendingConfirm = null;
  }
  function runConfirm() {
    const pc = orgState.pendingConfirm;
    if (!pc) return;
    if (pc.kind === "department") {
      const idx = DEPARTMENTS.findIndex(function (d) { return d.id === pc.id; });
      const name = DEPARTMENTS[idx].name;
      DEPARTMENTS.splice(idx, 1);
      showToast("已刪除部門「" + name + "」");
      closeConfirm();
      renderContent();
    } else {
      // 帳號刪除先不接實際行為（硬刪/改停用待 PM 確認），只示意二次確認流程：
      // 關掉確認框，順便關掉背後還開著的編輯抽屜（刪除入口在抽屜裡），不動 ACCOUNTS 資料
      closeConfirm();
      closeDrawer();
    }
  }

  // ============================================================
  // 二、部門（含指派主管，不另開頁）
  // ============================================================
  /* 2026-08-14：主管欄變成純資料欄。原本這裡還掛一顆「重新指派／指派」的 inline 按鈕，
     已收進「編輯部門」modal（見 openDeptFormModal 的說明），表格每列因此只剩編輯／刪除兩個操作。 */
  function renderManagerCell(d) {
    const manager = d.managerId ? ACCOUNTS.find(function (a) { return a.id === d.managerId; }) : null;
    return manager ? escAttr(manager.name) : '<span class="muted">未指派</span>';
  }
  function renderDeptList() {
    const isAdmin = state.demoRole === "companyAdmin";
    const depts = isAdmin ? DEPARTMENTS : DEPARTMENTS.filter(function (d) { return d.id === DEMO_DEPT_FOR_MANAGER; });
    const rows = depts.map(function (d) {
      const cnt = ACCOUNTS.filter(function (a) { return a.deptId === d.id; }).length;
      let actions = "";
      if (isAdmin) {
        /* 刪除停用時，原因用「就地說明」呈現（見 .dept-note-row）。
           2026-08-14 第三版：hover 監聽從整個操作欄（td，約 240px 寬）縮到緊貼按鈕的
           .del-hint-zone —— 掛在 td 上時，滑鼠還在欄位左側空白處就觸發了，離按鈕很遠卻一直跳出說明。
           為什麼要包一層 span：disabled 的 <button> 不會發出滑鼠事件，事件必須由外層元素接。
           span 用 inline-flex 剛好貼合按鈕，觸發範圍＝按鈕本身。 */
        const delBtn = '<button class="btn-danger-text" data-del-dept="' + d.id + '"' + (cnt > 0 ? ' disabled' : "") + '>刪除</button>';
        const delPart = cnt > 0
          ? '<span class="del-hint-zone" data-del-note="' + escAttr("此部門尚有 " + cnt + " 個帳號，無法刪除。請先將帳號移至其他部門或刪除帳號後，再刪除此部門。") + '">' + delBtn + '</span>'
          : delBtn;
        actions = '<div class="row-actions">' +
          '<button class="btn-text" data-edit-dept="' + d.id + '">編輯</button>' +
          delPart +
          '</div>';
      }
      return '<tr>' +
        '<td class="name-cell wrap-cell">' + escAttr(d.name) + '</td>' +
        '<td class="muted num-cell">' + d.code + '</td>' +
        '<td class="wrap-cell">' + renderManagerCell(d) + '</td>' +
        '<td class="num-cell muted">' + cnt + ' 人</td>' +
        '<td class="col-actions">' + actions + '</td>' +
        '</tr>';
    }).join("");
    return '<div class="table-card"><div class="table-scroll"><table class="data-table is-interactive dept-table"><thead><tr>' +
      '<th style="width:27%">部門名稱</th><th style="width:17%">部門代碼</th><th style="width:25%">目前部門主管</th>' +
      '<th style="width:14%">帳號數</th><th class="col-actions" style="width:17%">操作</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }
  function renderDepartmentsPage() {
    const isAdmin = state.demoRole === "companyAdmin";
    let html = '<div class="page-head"><h1>部門管理</h1></div>';
    if (isAdmin) html += '<div class="filter-bar" style="justify-content:flex-end"><button class="btn btn-primary" id="btnNewDept">' + icon("plus") + '新增部門</button></div>';
    html += '<div id="deptListWrap">' + renderDeptList() + '</div>';
    return html;
  }
  // 新增／編輯部門共用同一個小型表單 modal（deptId=null 代表新增）。
  // 2026-08-11 第二輪：原本「改名」是表格 inline 編輯，但補了必填的「部門代碼」欄位後
  // 一個儲存格塞兩個輸入框太擠，改成跟新增部門同一個 modal，順便統一了兩條路徑的驗證邏輯
  function deptCodeTaken(code, excludeId) {
    return DEPARTMENTS.some(function (d) { return d.id !== excludeId && d.code.toLowerCase() === code.toLowerCase(); });
  }
  function openDeptFormModal(deptId) {
    const dept = deptId ? DEPARTMENTS.find(function (d) { return d.id === deptId; }) : null;
    const isEdit = !!dept;
    // maxlength 採舊網站實測值（見 openAccountDrawer 開頭的說明）
    /* 2026-08-14：主管從表格上的 inline「重新指派」收進這個 modal，變成第三個欄位。
       理由：① 子帳號管理頁就是「列上只有編輯、所有屬性在面板裡改」，這頁原本是全站唯一的例外
             ② 主管欄原本一格塞了資料（Ben）＋動作（重新指派），掃讀被打斷
             ③ 一列三個橘色連結（重新指派／編輯／刪除）主次不分
       指派主管是低頻動作（建立時設一次、偶爾換人），不該長期佔用每一列的視覺空間。
       ⚠️ 主管與帳號角色不連動（Alvie 2026-08-14 裁示）：任何帳號都能當主管，
          這裡只寫 dept.managerId，絕不去改 ACCOUNTS 裡的 role。 */
    const deptAccounts = deptId ? ACCOUNTS.filter(function (a) { return a.deptId === deptId; }) : [];

    const mgrField = '<div class="field-group" data-field="deptManager"><label>部門主管</label>' +
      renderDropdown("deptManagerSelect", mgrOptions, (dept && dept.managerId) || "", { disabled: !isEdit }) +
      (isEdit
        ? (deptAccounts.length === 0 ? '<div class="hint">此部門目前沒有帳號，請先將帳號指派到這個部門</div>' : "")
        : '<div class="hint">部門建立後，將帳號指派到此部門才能選主管</div>') +
      '</div>';

    const html = '<div class="confirm-modal"><h3>' + (isEdit ? "編輯部門" : "新增部門") + '</h3>' +
      '<div class="field-group" data-field="deptName" style="margin-top:14px"><label>部門名稱<span class="req">*</span></label>' +
      '<input type="text" id="deptNameInput" maxlength="15" value="' + escAttr(dept ? dept.name : "") + '"><div class="err-msg" id="err-deptName" style="display:none"></div></div>' +
      '<div class="field-group" data-field="deptCode"><label>部門代碼<span class="req">*</span></label>' +
      '<input type="text" id="deptCodeInput" placeholder="例如 SALES01" maxlength="15" value="' + escAttr(dept ? dept.code : "") + '">' +
      '<div class="err-msg" id="err-deptCode" style="display:none"></div></div>' +
      mgrField +
      '<div class="cm-foot"><button class="btn btn-secondary" id="deptFormCancel">取消</button><button class="btn btn-primary" id="deptFormOk">' + (isEdit ? "儲存" : "建立") + '</button></div></div>';
    document.getElementById("orgConfirmMask").innerHTML = html;
    document.getElementById("orgConfirmMask").classList.add("open");
    ddBind("deptManagerSelect");
    document.getElementById("deptNameInput").focus();
    document.getElementById("deptFormCancel").addEventListener("click", closeConfirm);
    document.getElementById("deptFormOk").addEventListener("click", function () {
      clearFieldErrors();
      const nameVal = document.getElementById("deptNameInput").value.trim();
      const codeVal = document.getElementById("deptCodeInput").value.trim();
      let hasError = false;
      if (!nameVal) { setFieldError("deptName", "請輸入部門名稱"); hasError = true; }
      if (!codeVal) { setFieldError("deptCode", "請輸入部門代碼"); hasError = true; }
      else if (!/^[A-Za-z0-9]+$/.test(codeVal)) { setFieldError("deptCode", "只能是英文字母與數字"); hasError = true; }
      else if (deptCodeTaken(codeVal, deptId)) { setFieldError("deptCode", "這個部門代碼已經被使用"); hasError = true; }
      if (hasError) return;
      if (isEdit) {
        dept.name = nameVal; dept.code = codeVal.toUpperCase();
        // 主管跟名稱/代碼一起在按下「儲存」時才生效；中途取消什麼都不會變
        dept.managerId = ddValue("deptManagerSelect") || null;
        showToast("已儲存「" + nameVal + "」的變更");
      } else {
        DEPARTMENTS.push({ id: "d" + Date.now().toString(36), name: nameVal, code: codeVal.toUpperCase(), managerId: null });
        showToast("已新增部門「" + nameVal + "」");
      }
      closeConfirm();
      renderContent();
    });
  }
  function wireDepartmentsPage() {
    const btnNew = document.getElementById("btnNewDept");
    if (btnNew) btnNew.addEventListener("click", function () { openDeptFormModal(null); });
    document.querySelectorAll("[data-edit-dept]").forEach(function (btn) {
      btn.addEventListener("click", function () { openDeptFormModal(btn.getAttribute("data-edit-dept")); });
    });
    document.querySelectorAll("[data-del-dept]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.hasAttribute("disabled")) return;
        openConfirm(btn.getAttribute("data-del-dept"), "department");
      });
    });
    /* 刪除停用的就地說明：hover 哪一列就在那一列正下方插一列說明，滑走移除。

    function clearDeptNoteRow() {

  /* 新事件寫入 Audit Log（目前只有匯入會呼叫）。

  function addAuditEntry(e) {

  /* ============================================================
     操作紀錄匯出（2026-08-17）
     ------------------------------------------------------------
     🔒【個資原則】這一段是整個匯出功能的防線，改動前務必讀完：
       ① 匯出欄位**只有下面這 6 個**，全部直接取自 AUDIT_LOG 這筆紀錄本身。
       ② **絕對不可**用 e.actor / e.target 去 join ACCOUNTS 撈姓名／手機／信箱——
          畫面上只顯示帳號代號，匯出檔卻是明文，那就是個資外洩。
          （所以這裡刻意不引用 ACCOUNTS，日後也不要為了「檔案好讀」加上去）
       ③ e.desc 在資料源就已經是去識別化的寫法（只記欄位名、不記變更值、匯出類不記內容），
          這裡原樣輸出、**不做任何還原或補值**。
     ============================================================ */
  const AUDIT_EXPORT_COLUMNS = [
    { key: "time",   label: "時間" },
    { key: "actor",  label: "操作者" },
    { key: "cat",    label: "類別" },
    { key: "action", label: "動作" },
    { key: "target", label: "對象" },
    { key: "desc",   label: "說明" }
  ];

  // 一筆紀錄 → 一列的 6 個值。白名單式：只有這裡列出的欄位會進檔案
  function auditExportRow(e) {
    return {
      time: fmtAuditTime(auditTimeOf(e)),
      actor: e.actor,                    // 帳號代號，不是姓名
      cat: auditCatLabel(e.cat),
      action: e.action,
      target: e.target || "",            // 帳號代號或空，不是姓名
      desc: e.desc                       // 已去識別化的說明，原樣輸出
    };
  }

  /* CSV escape：含逗號／雙引號／換行的值要用雙引號包住，內部的雙引號要 double up。
     說明欄有「、」串起來的長句，也可能出現逗號，所以這一步不能省。 */
  function csvCell(v) {
    const s = v == null ? "" : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function auditToCsv(list) {
    const lines = [AUDIT_EXPORT_COLUMNS.map(function (c) { return csvCell(c.label); }).join(",")];
    list.forEach(function (e) {
      const row = auditExportRow(e);
      lines.push(AUDIT_EXPORT_COLUMNS.map(function (c) { return csvCell(row[c.key]); }).join(","));
    });
    return lines.join("\r\n");   // CSV 標準換行是 CRLF
  }

  /* 觸發下載。⚠️ 開頭要加 UTF-8 BOM（﻿），否則 Excel 開啟中文會變亂碼——
     這是選 CSV 的已知代價，不加 BOM 使用者會直接說「匯出檔壞了」。 */
  function downloadCsv(filename, csvText) {
    const blob = new Blob(["﻿" + csvText], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  /* 匯出當下的篩選條件摘要，寫進 Audit Log 用。
     ⚠️ 搜尋關鍵字**只記有沒有用**、不記內容——搜尋框是自由輸入，把使用者打的字
     原樣寫進稽核紀錄有不可控風險（可能貼進不該留存的字串）。類別與時間是結構化的
     選項值，記下來沒有這個問題。 */
  function auditFilterSummary() {
    const parts = [];
    const cat = AUDIT_CATEGORIES.find(function (c) { return c.value === auditState.cat; });
    parts.push("類別=" + (auditState.cat === "all" ? "全部" : (cat ? cat.label : auditState.cat)));
    if (auditState.range === "custom") {
      parts.push("時間=" + (auditState.customStart && auditState.customEnd
        ? auditState.customStart + "~" + auditState.customEnd : "自訂（未選完整區間）"));
    } else {
      const r = AUDIT_RANGES.find(function (x) { return x.value === auditState.range; });
      parts.push("時間=" + (r ? r.label : auditState.range));
    }
    parts.push("關鍵字搜尋=" + (auditState.search.trim() ? "有" : "無"));
    return parts.join("、");
  }

  let auditExporting = false;   // 防重複點擊
  function runAuditExport() {
    if (auditExporting) return;
    const list = filteredAudit();   // ⚠️ 完整篩選結果，不是當前分頁（pagedAudit）
    if (list.length === 0) { showToast("目前條件下沒有可匯出的紀錄", "error"); return; }

    auditExporting = true;
    syncAuditExportBtn();

    /* ⚠️ 實際產檔與錯誤處理待正式開發：這裡用 setTimeout 模擬「送出請求→後端產檔」的
       等待，正式版換成真的呼叫後端匯出 API，並依回傳結果決定成功／失敗。
       原型要測失敗路徑時在網址加 ?exportfail=1（不用亂數，否則每次點都可能失敗很難測）。 */
    const forceFail = new URLSearchParams(location.search).get("exportfail") === "1";
    setTimeout(function () {
      auditExporting = false;
      syncAuditExportBtn();

      if (forceFail) {
        showToast("操作失敗，請稍後再試", "error");
        return;
      }

      downloadCsv("操作紀錄_" + drISO(new Date(AUDIT_BASE)) + ".csv", auditToCsv(list));

      /* 【不留個資】只記事件本身：筆數與篩選條件，不記任何一列的內容。
         注意這筆紀錄是在匯出**之後**才產生的，所以剛匯出的那個檔案裡不會有它——
         這是正確的時序，不是漏記。 */
      addAuditEntry({
        cat: "data", action: "匯出操作紀錄", target: null,
        desc: "匯出 " + list.length + " 筆（" + auditFilterSummary() + "），不記錄匯出內容"
      });

      showToast("已匯出 " + list.length + " 筆操作紀錄");
      // 重畫列表，讓剛才那筆「匯出操作紀錄」出現在畫面上（稽核的透明性）
      refreshAuditList();
    }, 600);
  }

  // 匯出中要 disabled 並改文字（防重複點擊；checklist 的「提交中」要求）
  function syncAuditExportBtn() {
    const btn = document.getElementById("btnAuditExport");
    if (!btn) return;
    btn.disabled = auditExporting;
    btn.innerHTML = icon("upload") + (auditExporting ? "匯出中…" : "匯出");
  }

  // customStart / customEnd：range === "custom" 時才有意義，格式是 ISO "YYYY-MM-DD"
  // （跟 DateRangePicker 對外的格式一致，不存 Date 物件）
  const auditState = { search: "", cat: "all", range: "30d", page: 1, pageSize: PAGE_SIZE_DEFAULT, customStart: null, customEnd: null };
  // 區間選項：預設區間用 Dropdown；「自訂範圍」用共用的 DateRangePicker 元件
  // （2026-08-17 補上，這階段是原生日期欄位、未來可整顆換成月曆面板）
  const AUDIT_RANGES = [
    { value: "today", label: "今天" },
    { value: "7d", label: "近 7 天" },
    { value: "30d", label: "近 30 天" },
    { value: "90d", label: "近 90 天" },
    { value: "all", label: "全部時間" },
    // 2026-08-17：選了這個才會在篩選列展開 DateRangePicker（共用元件）
    { value: "custom", label: "自訂範圍" }
  ];

  function auditTimeOf(e) { return new Date(AUDIT_BASE - e.min * 60000); }
  function fmtAuditTime(d) {
    const p = function (n) { return n < 10 ? "0" + n : "" + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  /* ⚠️ 前端示意篩選，正式版改後端查詢。
     這裡是在記憶體裡的 39 筆假資料上做真實過濾（類別／時間區間／操作者三個條件同時作用，
     筆數跟著結果即時更新），純粹為了讓 demo 點得動、看得出篩選行為。
     正式版的稽核紀錄動輒數十萬筆，不可能整批送到前端再過濾——三個條件要當成查詢參數
     送給後端（配合索引與分頁），前端只負責呈現回傳結果。 */
  function filteredAudit() {
    const kw = auditState.search.trim().toLowerCase();
    const today = new Date(AUDIT_BASE).toDateString();
    return AUDIT_LOG.filter(function (e) {
      if (auditState.cat !== "all" && e.cat !== auditState.cat) return false;
      if (auditState.range === "today") {
        if (auditTimeOf(e).toDateString() !== today) return false;
      } else if (auditState.range === "custom") {
        /* 自訂區間（含頭含尾）。還沒選完整區間時不過濾——使用者剛切到「自訂範圍」
           但日期還沒填，不該看到空列表。 */
        if (auditState.customStart && auditState.customEnd) {
          const d = drISO(auditTimeOf(e));
          if (d < auditState.customStart || d > auditState.customEnd) return false;
        }
      } else if (auditState.range !== "all") {
        const days = parseInt(auditState.range, 10);
        if (e.min > days * 24 * 60) return false;
      }
      // 只比對操作者（規格指定）。若之後要連「對象」一起搜，改這裡加一個 or 條件即可
      if (kw && e.actor.toLowerCase().indexOf(kw) === -1) return false;
      return true;
    }).sort(function (a, b) { return a.min - b.min; }); // 新 → 舊
  }

  /* ---- 分頁：2026-08-17 起用共用的 pagerXxx／renderPagerBar（見上方「分頁（共用）」）----
     原本這一段是操作紀錄頁自己一份（auditTotalPages／pagedAudit／auditPageList／
     renderAuditPager，約 60 行），子帳號管理要用同一套分頁，所以整段抽成通用函式，
     這裡只留兩個薄包裝（保留原本的名字，其他呼叫點不用動）。
     仍是前端示意：正式版換成後端查詢後，slice 要改成把 page/pageSize 當查詢參數送出，
     由後端只回傳當頁那幾筆（稽核紀錄量大，不可能整批撈到前端再切）。 */
  function pagedAudit() {
    return pagedSlice(filteredAudit(), auditState);
  }
  function renderAuditPager() {
    return renderPagerBar({
      ddId: "auditPageSize", st: auditState,
      total: filteredAudit().length,   // 總數跟著篩選結果變動
      refresh: refreshAuditList
    });
  }

  function renderAuditFilterBar() {
    let html = '<div class="filter-bar">';
    html += '<div class="filter-search">' + icon("search") + '<input type="text" id="auditSearch" placeholder="搜尋帳號" value="' + escAttr(auditState.search) + '"></div>';
    const catOptions = [{ value: "all", label: "所有類別" }].concat(AUDIT_CATEGORIES);
    // 任何篩選條件改變都要回到第 1 頁——停在舊頁碼上會看到「篩選好像沒反應」（其實是那頁已經沒資料）
    html += renderDropdown("auditCatFilter", catOptions, auditState.cat, {
      onChange: function (v) { auditState.cat = v; auditState.page = 1; refreshAuditList(); }
    });
    html += renderDropdown("auditRangeFilter", AUDIT_RANGES, auditState.range, {
      onChange: function (v) {
        auditState.range = v;
        auditState.page = 1;
        /* 切離「自訂範圍」時把日期清掉：留著會造成「下拉顯示近 7 天、但心裡以為
           自訂的日期還在生效」的困惑。整條篩選列要重畫（自訂欄位要出現／消失），
           所以走 refreshAuditFilterBar() 而不是只 refreshAuditList()。 */
        if (v !== "custom") { auditState.customStart = null; auditState.customEnd = null; }
        refreshAuditFilterBar();
        refreshAuditList();
      }
    });
    // 只有選了「自訂範圍」才展開日期區間欄位（共用的 DateRangePicker 元件）
    if (auditState.range === "custom") {
      html += renderDateRange("auditDateRange",
        { start: auditState.customStart, end: auditState.customEnd },
        {
          max: drISO(new Date(AUDIT_BASE)),   // 不能選未來：稽核紀錄不會有未來的事件
          onChange: function (v) {
            auditState.customStart = v.start;
            auditState.customEnd = v.end;
            auditState.page = 1;
            refreshAuditList();
          }
        });
    }
    // 2026-08-14：筆數從這裡移到底部分頁列（跟每頁筆數選單、分頁器集中在同一條線，語意一致）
    /* 匯出鈕靠右（spacer 推開），位置比照子帳號管理頁把動作鈕放篩選列右側的慣例。
       icon 用 upload（箭頭向上＝資料離開系統），跟匯入用 download（向下＝帶進系統）
       形成對稱——沿用 2026-08-13 定的方向感邏輯，不是隨手挑的。
       權限：這一頁本身就只有企業管理員進得來（PERM_MATRIX 的「操作紀錄」是 companyAdmin，
       側欄已過濾），所以按鈕不用再判斷一次身份。 */
    html += '<div class="filter-bar-spacer"></div>';
    html += '<button class="btn btn-secondary" id="btnAuditExport">' + icon("upload") + '匯出</button>';
    html += '</div>';
    return html;
  }

  /* 篩選列自己重畫（自訂日期欄位要跟著「範圍」下拉出現／消失）。
     重畫後 dropdown 與日期欄位都是新節點，事件要重綁。 */
  function refreshAuditFilterBar() {
    const wrap = document.getElementById("auditFilterWrap");
    if (!wrap) return;
    wrap.innerHTML = renderAuditFilterBar();
    bindAuditFilterBar();
  }
  function bindAuditFilterBar() {
    const searchEl = document.getElementById("auditSearch");
    if (searchEl) searchEl.addEventListener("input", function () {
      auditState.search = this.value; auditState.page = 1; refreshAuditList();
    });
    ddBind("auditCatFilter");
    ddBind("auditRangeFilter");
    if (auditState.range === "custom") drBind("auditDateRange");
    const exportBtn = document.getElementById("btnAuditExport");
    if (exportBtn) {
      exportBtn.addEventListener("click", runAuditExport);
      syncAuditExportBtn();   // 篩選列重畫時要還原匯出中的狀態
    }
  }

  function renderAuditList() {
    const list = pagedAudit(); // 只畫當前這一頁；篩選後的總筆數用 filteredAudit().length
    if (filteredAudit().length === 0) {
      return '<div class="table-card"><div class="empty-state">' + icon("search") +
        '<p>這個條件下沒有紀錄</p>' +
        '<button class="btn btn-secondary" id="btnClearAuditFilters">清除篩選</button>' +
        '</div></div>';
    }
    /* 欄寬同樣用百分比（table-layout:fixed）。6 欄比帳號表的 9 欄寬鬆很多，
       說明欄拿走最大一份（它是唯一長度不定的欄），其餘依實際內容配置。 */
    /* 欄寬＝實測值換算，不是憑感覺調的。字級對齊帳號表（時間/類別/動作/對象從 Small 14
       拉回 Body 16）之後每欄都變寬，這組比例是在**最窄的驗證情境**（1280 視窗 → 表格 936px）
       用 clone 量每欄「表頭與內容取較大值 + 32px padding」的 nowrap 需求換算的：
         時間 173（"2026-08-13 16:40" 16px＝141）｜操作者 101｜類別 112（"登入與帳號"＝80）
         動作 128（"調整權限設定"＝96）｜對象 99｜說明 290（最長那句＝258）
       ⚠️ 表頭一定要一起算：帳號表那次就是只看內容寬度，結果「員工編號」表頭自己換行。
       2026-08-14 重配：說明欄字級拉回 Body 16 後需求從 290 → 326，且 ≤1366px 時 cell padding
       收成 12px（見上面的 media query）。以 1280（表格 936px、padding 24）重算每欄
       「max(表頭, 內容) + padding」的需求：時間 169｜操作者 93｜類別 104｜動作 120｜對象 91｜說明 318，
       合計 895，剩下 41px 當緩衝分散給各欄（避免四捨五入剛好差 1px 就換行）。 */
    const W = { time: 18.5, actor: 10.2, cat: 11.4, action: 13.2, target: 10, desc: 36.7 };
    const rows = list.map(function (e) {
      const alertDot = e.alert ? '<span class="alert-dot"></span>' : "";
      // 對象欄比照帳號表的「帳號」欄＝次要識別碼，用共用的 .muted 灰、不加粗
      const target = e.target ? escAttr(e.target) : '<span class="audit-dash">—</span>';
      return '<tr>' +
        '<td class="audit-time">' + fmtAuditTime(auditTimeOf(e)) + '</td>' +
        '<td class="wrap-cell"><span class="audit-id">' + escAttr(e.actor) + '</span></td>' +
        '<td class="wrap-cell">' + auditCatLabel(e.cat) + '</td>' +
        '<td class="wrap-cell"><span class="audit-act">' + alertDot + escAttr(e.action) + '</span></td>' +
        '<td class="muted wrap-cell">' + target + '</td>' +
        '<td class="audit-desc wrap-cell">' + escAttr(e.desc) + '</td>' +
        '</tr>';
    }).join("");
    return '<div class="table-card"><div class="table-scroll"><table class="data-table audit-table"><thead><tr>' +
      '<th style="width:' + W.time + '%">時間</th>' +
      '<th style="width:' + W.actor + '%">操作者</th>' +
      '<th style="width:' + W.cat + '%">類別</th>' +
      '<th style="width:' + W.action + '%">動作</th>' +
      '<th style="width:' + W.target + '%">對象</th>' +
      '<th style="width:' + W.desc + '%">說明</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      renderAuditPager() + '</div>';
  }

  function renderAuditPage() {
    /* 2026-08-13：頁尾原本還有一個黃框 .flag-note（「紀錄產生與寫入待正式開發」），
       Alvie 決定拿掉——這件事他會在報告時口頭講，畫面上不用再佔一塊版面。
       表格下方只留保存期限那行灰字（那是產品規格，不是原型註記，兩者性質不同）。 */
    let html = '<div class="page-head"><h1>操作紀錄</h1></div>';
    // 包一層 wrap：切換「自訂範圍」時要能只重畫篩選列（日期欄位要出現／消失）
    html += '<div id="auditFilterWrap">' + renderAuditFilterBar() + '</div>';
    html += '<div id="auditListWrap">' + renderAuditList() + '</div>';
    const years = Math.round(AUDIT_RETENTION_DAYS / 365 * 10) / 10;
    html += '<div class="audit-retention">' + icon("history") +
      '<span>紀錄保存 ' + AUDIT_RETENTION_DAYS + ' 天（約 ' + years + ' 年），期限到自動清除。操作者與對象僅記錄帳號代號，不含姓名、手機與信箱。</span></div>';
    return html;
  }

  function refreshAuditList() {
    const wrap = document.getElementById("auditListWrap");
    if (!wrap) return;
    // 筆數現在包在分頁列裡、跟著這次重畫一起產生，不用再另外同步一次
    wrap.innerHTML = renderAuditList();
    bindAuditListButtons();
  }
  // 列表區（表格＋分頁列）每次重畫都是新節點，事件要重綁——包含分頁列裡的每頁筆數下拉
  function bindAuditListButtons() {
    const clearBtn = document.getElementById("btnClearAuditFilters");
    if (clearBtn) clearBtn.addEventListener("click", function () {
      auditState.search = ""; auditState.cat = "all"; auditState.range = "all"; auditState.page = 1;
      // 自訂日期也要一起清掉（否則清除篩選後 range 變 all、但日期還留在 state 裡）
      auditState.customStart = null; auditState.customEnd = null;
      // 篩選列整條重畫：range 從 custom 變回 all 時，日期欄位要消失
      refreshAuditFilterBar();
      refreshAuditList();
    });
    bindPagerBar("#auditListWrap", { ddId: "auditPageSize", st: auditState, refresh: refreshAuditList });
  }
  function wireAuditPage() {
    // 篩選列的事件綁定統一收在 bindAuditFilterBar()（重畫篩選列時會再呼叫一次），
    // 不要在這裡另寫一份，否則兩處會對不上
    bindAuditFilterBar();
    bindAuditListButtons();
  }

  // ============================================================
  // Demo 身份切換（純原型工具，正式產品不會有，見左下角深色藥丸列）
  // ============================================================
  function setDemoRole(role) {
    if (role === state.demoRole) return;
    state.demoRole = role;
    orgState.search = ""; orgState.deptFilter = "all"; orgState.roleFilter = "all"; orgState.statusFilter = "all";
    orgState.page = 1;   // 換身份後看得到的帳號範圍變了，不能停在舊頁碼

    // 切身份後，目前停留的頁面可能整組消失（如「組織與子帳號」）或只是該子項目被過濾掉
    // （如「管理報表」）——兩種都要把人帶回總覽，不能留在一個側欄已經點不到的頁面上
    const currentGroup = NAV.find(function (n) { return n.id === state.activeTop; });
    const groupHidden = currentGroup && currentGroup.kind === "group" && visibleChildren(currentGroup).length === 0;
    const childHidden = currentGroup && currentGroup.kind === "group" && !groupHidden && state.activeChildId &&
      !visibleChildren(currentGroup).some(function (c) { return c.id === state.activeChildId; });

    if (groupHidden || childHidden) {
      const hiddenLabel = groupHidden ? currentGroup.label : (findChild(currentGroup, state.activeChildId) || {}).label;
      state.activeTop = "overview"; state.activeChildId = null; state.expandedGroup = null; state.activeTabIndex = 0;
      showToast("已切換為「" + ROLES[role].label + "」身份（demo）：看不到「" + hiddenLabel + "」，已返回總覽");
    } else {
      showToast("已切換為「" + ROLES[role].label + "」身份（demo）");
    }
    buildSidebar();
    syncSidebar(true);
    renderContent();
    syncDemoRoleBar();
  }
  function syncDemoRoleBar() {
    document.querySelectorAll("#demoRoleBar [data-demo-role]").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-demo-role") === state.demoRole);
    });
  }
  document.querySelectorAll("#demoRoleBar [data-demo-role]").forEach(function (btn) {
    btn.addEventListener("click", function () { setDemoRole(btn.getAttribute("data-demo-role")); });
  });

  // 合約狀態切換（2026-08-14 新增）：跟身份切換是獨立維度，只管總覽頁合約摘要卡版本，
  // 不影響側欄權限可見範圍。合約卡僅企業管理員可見，切到其他身份時這組切換不會反映在畫面上
  function setDemoContract(status) {
    if (status === state.demoContract) return;
    state.demoContract = status;
    syncDemoContractBar();
    if (state.activeTop === "overview") renderContent();
  }
  function syncDemoContractBar() {
    document.querySelectorAll("#demoRoleBar [data-demo-contract]").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-demo-contract") === state.demoContract);
    });
  }
  document.querySelectorAll("#demoRoleBar [data-demo-contract]").forEach(function (btn) {
    btn.addEventListener("click", function () { setDemoContract(btn.getAttribute("data-demo-contract")); });
  });

  document.getElementById("orgDrawerMask").addEventListener("click", closeDrawer);
  syncDemoRoleBar();
  syncDemoContractBar();

  /* 截圖模式：網址加 ?demo=0 隱藏左下角的 demo 切換列（身份／合約狀態）。
     那條列是純原型工具、正式版不存在，要把畫面截圖交出去（放進 Figma、簡報）時不該出現。
     沿用登入前流程 demo-mode.js 的參數慣例（?demo=0 關、預設開），只藏不刪——
     身份切換的邏輯與狀態都還在，拿掉參數重新整理就回來了。 */
  if (new URLSearchParams(location.search).get("demo") === "0") {
    const demoBar = document.getElementById("demoRoleBar");
    if (demoBar) demoBar.style.display = "none";
  }

  // ---- topbar popovers ----
  function wirePopover(btnId, popId) {
    const btn = document.getElementById(btnId);
    const pop = document.getElementById(popId);
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      const willOpen = !pop.classList.contains("open");
      document.querySelectorAll(".popover.open").forEach(function (p) { p.classList.remove("open"); });
      if (willOpen) pop.classList.add("open");
    });
  }
  wirePopover("btnAnnounce", "popAnnounce");
  wirePopover("btnFaq", "popFaq");
  wirePopover("btnApi", "popApi");
  wirePopover("btnAvatar", "popAvatar");
  document.addEventListener("click", function () {
    document.querySelectorAll(".popover.open").forEach(function (p) { p.classList.remove("open"); });
  });
  /* 登出 → 導回登入頁（2026-08-19）。
     登入前流程是另一個 repo／另一個 GitHub Pages（e8d-design-system），所以用絕對 URL——
     跟反方向的做法對稱：登入流程走完 2FA 後也是用絕對 URL 導到這個後台
     （見 `E8D 設計系統/F1-2FA驗證頁-提案.html` 的 window.location.href）。
     ⚠️ 指到「登入頁」本身，不是該站的首頁（那是有三個入口按鈕的流程總覽頁，
        只給我們自己在本機挑流程用，不放進給 PM 的動線裡——登出後應該看到的是
        登入畫面，跳到一個選單頁會讓人以為自己走錯地方）。Alvie 2026-08-19 指定。
        檔名是中文（F1登入頁-提案.html），這裡用 percent-encoded 寫法避免任何
        編碼環節出錯；解碼後就是那個檔名。
     ⚠️ 已知取捨：本機 localhost:8744 測試時點登出會跳到線上的登入頁
     （因為登入前那套沒跟這支一起起 server）。demo 都在線上跑，這個落差可接受。
     先讓 toast 閃一下再跳，觀看 demo 的人才知道剛剛發生了什麼；不做二次確認——
     登出不是破壞性操作（可以再登入），不需要攔一道。 */
  const LOGIN_FLOW_URL = "https://alvieforwork.github.io/e8d-design-system/F1%E7%99%BB%E5%85%A5%E9%A0%81-%E6%8F%90%E6%A1%88.html";
  document.getElementById("btnLogout").addEventListener("click", function (e) {
    e.stopPropagation();
    document.getElementById("popAvatar").classList.remove("open");
    showToast("已登出，正在返回登入頁…");
    setTimeout(function () { window.location.href = LOGIN_FLOW_URL; }, 700);
  });

  /* ---- toast（全站共用）----
     showToast(msg)            成功（預設，既有 13 個呼叫點都走這個，不用改）
     showToast(msg, "error")   系統失敗（網路／逾時／伺服器出錯，跟表單欄位驗證錯誤不同層級）
     2026-08-17 加上 error 態，對齊 Figma 的 Toast component（State=Success／Error）。
     卡片本體兩態完全相同，只換 icon 與 icon 顏色。 */
  let toastTimer = null;
  function showToast(msg, type) {
    const t = document.getElementById("toast");
    const isError = type === "error";
    // 每次都重設 class，避免上一次的 is-error 殘留到下一則成功訊息
    t.className = "toast" + (isError ? " is-error" : "");
    t.innerHTML = icon(isError ? "xToast" : "check") + "<span>" + escAttr(msg) + "</span>";
    // 重設完 class 才加 show，否則 transition 不會跑
    void t.offsetWidth;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3500);
  }

  // ---- 側欄點數卡：儲值捷徑 ----
  document.getElementById("btnTopup").addEventListener("click", function () {
    state.activeTop = "billing";
    state.activeChildId = "topup";
    state.expandedGroup = "billing";
    state.activeTabIndex = 0;
    render();
    showToast("全域元件：點數卡的儲值捷徑，直達 帳務與點數 › 儲值");
  });

  // ---- 側邊欄收合 ----
  // 箭頭方向要跟著狀態換 icon（不用旋轉，否則面板的分隔線會跑到右邊，但側欄一直在左邊）
  const PANEL_ARROW = {
    close: '<path d="m16 15-3-3 3-3"/>',   // Lucide panel-left-close
    open:  '<path d="m14 9 3 3-3 3"/>'     // Lucide panel-left-open
  };
  document.getElementById("sidebarToggle").addEventListener("click", function () {
    const collapsed = document.getElementById("sidebar").classList.toggle("collapsed");
    document.getElementById("shell").classList.toggle("sidebar-collapsed");
    this.classList.toggle("active");
    document.getElementById("sidebarToggleIcon").innerHTML =
      '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>' +
      (collapsed ? PANEL_ARROW.open : PANEL_ARROW.close);
    this.setAttribute("aria-label", collapsed ? "展開側邊欄" : "收合側邊欄");
  });

  buildSidebar();
  syncSidebar(true);   // 首次進站直接定位，不跑展開動畫
  renderContent();
})();
</script>
