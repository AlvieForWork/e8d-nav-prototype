  /* 側欄的 DOM 只建一次（含全部子選單），之後狀態改變一律用 syncSidebar() 改既有節點。
     不能每次都 innerHTML 重建 —— 全新節點沒有前一個值可以補間，高度與旋轉動畫都跑不出來。 */
  function buildSidebar() {
    const scroll = document.getElementById("navScroll");
    let html = "";
    visibleNav().forEach(function (item) {
      if (item.kind === "group") {
        html += '<button class="nav-row" data-group="' + item.id + '" aria-expanded="false">' +
          icon(item.icon) + '<span class="label">' + item.label + '</span>' + icon("chevDown", 'class="ico chev"') +
          '</button>';
        // 子選單一律輸出，收合時靠 .nav-group-wrap 的 height:0 藏起來
        html += '<div class="nav-group-wrap" data-wrap="' + item.id + '">';
        html += '<div class="nav-group-children">';
        visibleChildren(item).forEach(function (child) {
          html += '<button class="nav-child" data-group="' + item.id + '" data-child="' + child.id + '">' +
            '<span class="label">' + child.label + '</span>' +
            (child.phase2 ? '<span class="p2-badge">P2</span>' : '') +
            '</button>';
        });
        html += '</div></div>';
      } else {
        html += '<button class="nav-row' + (item.useLogo ? ' has-logo' : '') + '" data-top="' + item.id + '">' +
          (item.useLogo ? TALKOD_LOGO_SVG : icon(item.icon)) +
          '<span class="label">' + item.label + '</span>' +
          (item.kind === "external" ? icon("external", 'class="ico ext-mark"') : "") +
          '</button>';
        // 獨立產品入口跟下面的平台功能群組用一條線隔開，視覺分兩塊
        if (item.dividerAfter) html += '<div class="nav-divider"></div>';
      }
    });
    scroll.innerHTML = html;

    scroll.querySelectorAll("[data-group]:not([data-child])").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const gid = btn.getAttribute("data-group");
        state.expandedGroup = state.expandedGroup === gid ? null : gid;
        if (state.expandedGroup === gid) {
          state.activeTop = gid;
          const group = NAV.find(function (n) { return n.id === gid; });
          const kids = visibleChildren(group);
          const stillValid = state.activeChildId && kids.some(function (c) { return c.id === state.activeChildId; });
          if (!stillValid) {
            state.activeChildId = kids[0].id;
            state.activeTabIndex = 0;
          }
        }
        render();
      });
    });
    scroll.querySelectorAll("[data-child]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        state.activeTop = btn.getAttribute("data-group");
        state.activeChildId = btn.getAttribute("data-child");
        state.activeTabIndex = 0;
        render();
      });
    });
    scroll.querySelectorAll("[data-top]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.activeTop = btn.getAttribute("data-top");
        state.activeChildId = null;
        state.expandedGroup = null;
        state.activeTabIndex = 0;
        render();
        if (state.activeTop === "talkod") showToast("外部連結：實際點擊會另開 TalkOD 分頁");
      });
    });
  }

  /* 只改既有節點的狀態與高度，不動 DOM 結構。
     第一次呼叫（initial=true）直接跳到最終高度、不跑動畫，
     否則一進站就會看到選單自己展開一次，很像畫面壞掉。 */
  function syncSidebar(initial) {
    const scroll = document.getElementById("navScroll");

    scroll.querySelectorAll("[data-group]:not([data-child])").forEach(function (btn) {
      const gid = btn.getAttribute("data-group");
      const expanded = state.expandedGroup === gid;
      btn.setAttribute("aria-expanded", String(expanded));
      // 展開時群組本身不標 active（active 交給展開的子項），跟原本的邏輯一致
      btn.classList.toggle("active", state.activeTop === gid && !expanded);

      const wrap = scroll.querySelector('[data-wrap="' + gid + '"]');
      if (!wrap) return;

      if (initial) {
        // 不要動畫：先關掉 transition，設完高度再還原
        const prev = wrap.style.transition;
        wrap.style.transition = "none";
        wrap.style.height = expanded ? "auto" : "0px";
        void wrap.offsetHeight;          // 強制 reflow，讓上面這行立刻生效
        wrap.style.transition = prev;
      } else if (expanded) {
        // auto 沒辦法做 transition，要先量出實際高度
        wrap.style.height = wrap.scrollHeight + "px";
      } else {
        // 若目前是 auto（展開狀態），得先固定成具體數值才收得動
        if (wrap.style.height === "auto") {
          wrap.style.height = wrap.scrollHeight + "px";
          void wrap.offsetHeight;
        }
        wrap.style.height = "0px";
      }
    });

    scroll.querySelectorAll("[data-child]").forEach(function (btn) {
      const isActive = state.activeTop === btn.getAttribute("data-group") &&
                       state.activeChildId === btn.getAttribute("data-child");
      btn.classList.toggle("active", isActive);
    });

    scroll.querySelectorAll("[data-top]").forEach(function (btn) {
      btn.classList.toggle("active", state.activeTop === btn.getAttribute("data-top"));
    });
  }

  /* 展開動畫結束後把高度改回 auto，這樣子選單內容之後若有變動
     （例如加了新項目）不會被卡在當初量到的固定高度 */
  document.getElementById("navScroll").addEventListener("transitionend", function (e) {
    const wrap = e.target;
    if (e.propertyName !== "height" || !wrap.classList.contains("nav-group-wrap")) return;
    const gid = wrap.getAttribute("data-wrap");
    if (state.expandedGroup === gid) wrap.style.height = "auto";
  });

  function renderContent() {
    const content = document.getElementById("content");
    const topItem = NAV.find(function (n) { return n.id === state.activeTop; });

    const protoNote = '';

    if (topItem.kind === "dashboard") {
      content.innerHTML = protoNote + renderDashboardHTML();
      initDashboardCharts();
      initStatCountUp();
      return;
    }

    if (topItem.kind === "external") {
      content.innerHTML = protoNote +
        '<div class="ext-card">' + icon("external", 'style="width:22px;height:22px"') +
        '<div><h2>互動回覆簡訊（TalkOD）</h2><p>' + topItem.detail + ' 建議在側邊欄用外部連結圖示標示，讓使用者知道這不是站內頁面。</p></div></div>';
      return;
    }

    // group -> child
    const child = findChild(topItem, state.activeChildId) || topItem.children[0];

    // 組織與子帳號整個群組走專用渲染器（樹狀/篩選/表格/抽屜），不吃下面通用的 tabs/placeholder 邏輯
    if (topItem.id === "org") {
      content.innerHTML = protoNote + renderOrgHTML(child.id);
      wireOrgPage(child.id);
      return;
    }

    let html = protoNote + '<div class="page-head"><h1>' + child.label +
      (child.phase2 ? '<span class="p2-badge" style="margin-left:8px;vertical-align:middle;">Phase 2</span>' : '') + '</h1></div>';

    if (child.tabs && child.tabs.length > 0) {
      let tabsHtml = '<div class="tabbar">';
      child.tabs.forEach(function (t, i) {
        const label = typeof t === "string" ? t : t.label;
        const tabIsPhase2 = typeof t === "object" && t.phase2;
        tabsHtml += '<button class="tab' + (i === state.activeTabIndex ? " active" : "") + '" data-tab="' + i + '">' + label +
          (tabIsPhase2 ? '<span class="p2-badge" style="margin-left:5px;">P2</span>' : '') + '</button>';
      });
      tabsHtml += '</div>';
      html += tabsHtml;
      if (child.detail) html += '<div class="detail-note">' + child.detail + '</div>';
      if (child.flag) html += '<div class="flag-note">' + icon("flag") + '<div>' + child.flag + '</div></div>';
      const activeTab = child.tabs[state.activeTabIndex];
      const activeTabLabel = typeof activeTab === "string" ? activeTab : activeTab.label;
      html += '<div class="placeholder-card"><div class="big">〔內容區〕' + activeTabLabel + '</div>此 Tab 對應原架構圖中的第三層節點，實際頁面內容之後再設計</div>';
    } else {
      if (child.detail) html += '<div class="detail-note">' + child.detail + '</div>';
      if (child.flag) html += '<div class="flag-note">' + icon("flag") + '<div>' + child.flag + '</div></div>';
      html += '<div class="placeholder-card"><div class="big">〔內容區〕' + child.label + '</div>此項目沒有下一層 Tab，直接是單一頁面</div>';
    }

    content.innerHTML = html;
    content.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.activeTabIndex = parseInt(btn.getAttribute("data-tab"), 10);
        renderContent();
      });
    });
  }

  /* ============================================================
     組織與子帳號模組（2026-08-11 新增，UX 重設版 v3）
     ------------------------------------------------------------
     不沿用舊後台「勾選列+上方按鈕」慣例，改成：即時篩選、每列自帶操作、
     右側抽屜（Drawer）建立/編輯、demo 身份切換連動可見範圍。
     Drawer／Toggle／組織樹／⋯拿掉改文字連結——這些是系統目前沒有的元件，
     照既有 token 語言（surface/radius-xl/shadow-card 等）自己設計，
     之後要不要收進 Figma 由 Alvie 決定。
     ============================================================ */

  function escAttr(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  /* ============================================================
     全站共用 tooltip 引擎（2026-08-12，第二輪加延遲）：任何元素只要帶 data-tip="..."
     hover 就會跳出提示——表格截斷欄位（姓名/帳號/部門/E-mail）、頂部圖示按鈕
     （公告/常見問題/API文件）都吃同一套，不是分開兩套邏輯。單一 fixed 節點掛在 body
     底下（跟 dropdown 的 portal 同一種做法，不會被卡片的 overflow:hidden 裁切），
     監聽直接掛在 document 上（涵蓋 #content 之外的頂部列，子節點重繪也不用重新綁）。
     2026-08-12：Alvie 反映「API 文件下載」那類圖示原本用瀏覽器原生 title屬性，
     跳出延遲是瀏覽器內建、沒辦法調——這是這輪把它們也改吃這套引擎的原因，
     原生 title 完全沒有可控的顯示延遲。300–400ms 抓中間值 350ms：太短滑過去就閃現，
     太長會覺得卡頓；移開時不等待、立刻觸發淡出（CSS transition 本身 120ms，已經夠快）
     ============================================================ */
  const CELL_TIP_DELAY = 350;
  let cellTipEl = null;
  let cellTipShowTimer = null;
  function ensureCellTip() {
    if (!cellTipEl) {
      cellTipEl = document.createElement("div");
      cellTipEl.className = "cell-tip";
      document.body.appendChild(cellTipEl);
    }
    return cellTipEl;
  }
  function positionCellTip(target) {
    const tip = ensureCellTip();
    const r = target.getBoundingClientRect();
    const tr = tip.getBoundingClientRect();
    let top = r.top - tr.height - 8;
    if (top < 8) top = r.bottom + 8; // 上方空間不夠就往下開
    let left = r.left + r.width / 2 - tr.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
    tip.style.top = top + "px";
    tip.style.left = left + "px";
  }
  function showCellTip(target) {
    const text = target.getAttribute("data-tip");
    if (!text) return;
    const tip = ensureCellTip();
    tip.textContent = text;
    tip.classList.add("open");
    positionCellTip(target);
  }
  function hideCellTip() {
    clearTimeout(cellTipShowTimer);
    if (cellTipEl) cellTipEl.classList.remove("open");
  }
  document.addEventListener("mouseover", function (e) {
    const t = e.target.closest("[data-tip]");
    if (!t) return;
    clearTimeout(cellTipShowTimer);
    cellTipShowTimer = setTimeout(function () { showCellTip(t); }, CELL_TIP_DELAY);
  });
  document.addEventListener("mouseout", function (e) {
    const t = e.target.closest("[data-tip]");
    if (t && !t.contains(e.relatedTarget)) hideCellTip();
  });
  window.addEventListener("scroll", function () { hideCellTip(); }, true);

  /* ============================================================
     自訂 Dropdown 引擎（2026-08-11 第三輪，取代原生 <select>）
     ------------------------------------------------------------
     一個共用註冊表 ddRegistry（id → {options, value, onChange, disabled}）＋
     一個掛在 document.body 的 portal，面板一律 fixed 定位、開啟時當場量觸發按鈕的
     getBoundingClientRect() 算座標，捲動／resize 時即時重算（不是關掉，是真的跟著移動）。
     面板獨立掛在 body 下，不受 .drawer-body 的 overflow:hidden 或 .drawer 的
     transform 影響——這是先前「面板位置跑掉」的根本原因（每個下拉各自 relative 定位，
     一旦外層有 overflow/transform 就被裁切或位移），改成 portal 之後全站下拉共用同一套邏輯，
     不用每個下拉各補位移。
     ============================================================ */
  const ddRegistry = {};
  let ddActive = null; // { id, triggerEl, panelEl }

  function ddPortal() {
    let el = document.getElementById("ddPortal");
    if (!el) { el = document.createElement("div"); el.id = "ddPortal"; document.body.appendChild(el); }
    return el;
  }
  // 產生觸發按鈕的 HTML，並把這個下拉的選項/當前值/onChange 登記進 ddRegistry
  function renderDropdown(id, options, value, opts) {
    opts = opts || {};
    ddRegistry[id] = { options: options, value: value, disabled: !!opts.disabled, onChange: opts.onChange || null };
    const selected = options.find(function (o) { return o.value === value; });
    const label = selected ? selected.label : (opts.placeholder || "");
    return '<div class="dd' + (opts.className ? " " + opts.className : "") + '">' +
      '<button type="button" class="dd-trigger" id="dd-' + id + '" data-dd="' + id + '"' + (opts.disabled ? " disabled" : "") + ' aria-haspopup="listbox" aria-expanded="false">' +
      '<span class="dd-label">' + escAttr(label) + '</span>' + icon("chevDown", 'class="ico dd-chev"') +
      '</button></div>';
  }
  // 每次把 renderDropdown() 的 HTML 塞進 DOM 之後，呼叫這個把 click 事件接上（HTML 是新的節點，要重新綁）
  function ddBind(id) {
    const trigger = document.getElementById("dd-" + id);
    if (!trigger) return;
    trigger.addEventListener("click", function (e) {
      e.stopPropagation();
      if (ddActive && ddActive.id === id) { ddClose(); return; }
      ddOpen(trigger);
    });
  }
  function ddPanelHtml(id) {
    const state = ddRegistry[id];
    return '<div class="dd-panel" id="ddpanel-' + id + '" role="listbox">' + state.options.map(function (o) {
      const isSelected = o.value === state.value;
      return '<button type="button" class="dd-item" data-value="' + escAttr(o.value) + '">' +
        (isSelected ? icon("check", 'class="ico dd-check"') : "") + '<span>' + escAttr(o.label) + '</span></button>';
    }).join("") + '</div>';
  }
  function ddOpen(triggerEl) {
    const id = triggerEl.getAttribute("data-dd");
    const state = ddRegistry[id];
    if (!state || state.disabled) return;
    ddClose();
    ddPortal().innerHTML = ddPanelHtml(id);
    const panel = document.getElementById("ddpanel-" + id);
    triggerEl.setAttribute("aria-expanded", "true");
    triggerEl.classList.add("is-open");
    ddActive = { id: id, triggerEl: triggerEl, panelEl: panel };
    positionDdPanel(triggerEl, panel);
    requestAnimationFrame(function () { panel.classList.add("open"); });
    panel.querySelectorAll(".dd-item").forEach(function (item) {
      item.addEventListener("click", function () {
        ddSetValue(id, item.getAttribute("data-value"));
        ddClose();
      });
    });
  }
  function ddClose() {
    if (!ddActive) return;
    ddActive.triggerEl.setAttribute("aria-expanded", "false");
    ddActive.triggerEl.classList.remove("is-open");
    if (ddActive.panelEl.parentNode) ddActive.panelEl.parentNode.removeChild(ddActive.panelEl);
    ddActive = null;
  }
  function positionDdPanel(trigger, panel) {
    const rect = trigger.getBoundingClientRect();
    panel.style.width = rect.width + "px";
    panel.style.left = rect.left + "px";
    const panelHeight = panel.offsetHeight;
    const spaceBelow = window.innerHeight - rect.bottom;
    const openUp = spaceBelow < panelHeight + 8 && rect.top > panelHeight + 8;
    panel.style.top = (openUp ? (rect.top - panelHeight - 4) : (rect.bottom + 4)) + "px";
  }
  function ddValue(id) { return ddRegistry[id] ? ddRegistry[id].value : undefined; }
  function ddSetValue(id, value, opts) {
    opts = opts || {};
    const state = ddRegistry[id];
    if (!state) return;
    state.value = value;
    const trigger = document.getElementById("dd-" + id);
    if (trigger) {
      const selected = state.options.find(function (o) { return o.value === value; });
      trigger.querySelector(".dd-label").textContent = selected ? selected.label : "";
    }
    if (!opts.silent && state.onChange) state.onChange(value);
  }
  // 觸發按鈕本身沒重繪、只是選項清單變了（例如身份切換後部門選項變少）時用這個，不會誤觸發 onChange
  function ddSetOptions(id, options, value) {
    const state = ddRegistry[id];
    if (!state) return;
    state.options = options;
    ddSetValue(id, value !== undefined ? value : state.value, { silent: true });
  }
  document.addEventListener("click", function (e) {
    if (!ddActive) return;
    if (ddActive.panelEl.contains(e.target) || ddActive.triggerEl.contains(e.target)) return;
    ddClose();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && ddActive) ddClose(); });
  window.addEventListener("scroll", function () { if (ddActive) positionDdPanel(ddActive.triggerEl, ddActive.panelEl); }, true);
  window.addEventListener("resize", function () { if (ddActive) positionDdPanel(ddActive.triggerEl, ddActive.panelEl); });

  function dialFor(iso) {
    const c = COUNTRY_CODES.find(function (c) { return c.iso === iso; });
    return c ? c.dial : "";
  }
  function dialDisplay(iso) {
    return "+" + dialFor(iso);
  }
  function field(key, label, required, inputHtml) {
    return '<div class="field-group" data-field="' + key + '"><label>' + label +
      (required ? '<span class="req">*</span>' : '') + '</label>' + inputHtml +
      '<div class="err-msg" id="err-' + key + '" style="display:none"></div></div>';
  }
  function toggleHtml(id, checked) {
    return '<label class="toggle"><input type="checkbox" id="' + id + '"' + (checked ? " checked" : "") +
      '><span class="track"></span><span class="thumb"></span></label>';
  }
  // attrs 直接塞進 <input>（class/id/data-*），沿用 Figma Checkbox 元件規格，取代原生 checkbox 外觀
  function checkboxHtml(attrs, checked) {
    return '<label class="chk"><input type="checkbox"' + attrs + (checked ? " checked" : "") + '><span class="chk-box">' +
      icon("check", 'class="ico ico-check"') + icon("minus", 'class="ico ico-minus"') + '</span></label>';
  }
  function setFieldError(key, msg) {
    const scope = document.querySelector('[data-field="' + key + '"]');
    if (scope) {
      // 2026-08-12：優先找 #f+Key 這個精確 id（大多數欄位的輸入框都照這個命名）。
      // 「手機」這個 field-group 裡同時有國碼下拉（.dd-trigger）跟門號 input 兩個可互動元素，
      // 沒有這條的話 querySelector("input, select, .dd-trigger") 會選到排在前面的國碼下拉，
      // 手機號碼沒填的錯誤會誤標在國碼欄位上。找不到精確 id 的欄位（部門/角色這類純下拉、
      // 或部門表單的 deptName/deptCode）維持原本的通用 fallback，不受影響
      const exactId = "f" + key.charAt(0).toUpperCase() + key.slice(1);
      const input = scope.querySelector("#" + exactId) || scope.querySelector("input, select, .dd-trigger");
      if (input) input.classList.add("is-error");
    }
    const err = document.getElementById("err-" + key);
    if (err) { err.textContent = msg; err.style.display = "flex"; }
  }
  // 跟 setFieldError 相同的定位邏輯，反過來清單一欄位——即時輸入驗證（如帳號格式）
  // 用這個而不是 clearFieldErrors()，才不會把使用者還沒修正的其他欄位錯誤一起清掉
  function clearFieldError(key) {
    const scope = document.querySelector('[data-field="' + key + '"]');
    if (scope) {
      const exactId = "f" + key.charAt(0).toUpperCase() + key.slice(1);
      const input = scope.querySelector("#" + exactId) || scope.querySelector("input, select, .dd-trigger");
      if (input) input.classList.remove("is-error");
    }
    const err = document.getElementById("err-" + key);
    if (err) { err.style.display = "none"; err.textContent = ""; }
  }
  function clearFieldErrors() {
    document.querySelectorAll(".field-group input.is-error, .field-group select.is-error, .field-group .dd-trigger.is-error").forEach(function (el) { el.classList.remove("is-error"); });
    document.querySelectorAll(".err-msg").forEach(function (el) { el.style.display = "none"; el.textContent = ""; });
  }

  // ---- 可見範圍（依 demo 身份） ----
  function scopeDeptIds() {
    if (state.demoRole === "companyAdmin") return DEPARTMENTS.map(function (d) { return d.id; });
    if (state.demoRole === "deptManager") return [DEMO_DEPT_FOR_MANAGER];
    return [];
  }
  function scopedAccounts() {
    const deptIds = scopeDeptIds();
    return ACCOUNTS.filter(function (a) {
      if (a.deptId === null) return state.demoRole === "companyAdmin"; // 母帳號只有企業管理員自己看得到
      return deptIds.indexOf(a.deptId) !== -1;
    });
  }
  function filteredAccounts() {
    let list = scopedAccounts();
    if (orgState.deptFilter !== "all") list = list.filter(function (a) { return a.deptId === orgState.deptFilter; });
    if (orgState.roleFilter !== "all") list = list.filter(function (a) { return a.role === orgState.roleFilter; });
    if (orgState.statusFilter !== "all") list = list.filter(function (a) { return a.status === orgState.statusFilter; });
    const q = orgState.search.trim().toLowerCase();
    if (q) {
      list = list.filter(function (a) {
        return a.name.toLowerCase().indexOf(q) !== -1 || a.account.toLowerCase().indexOf(q) !== -1 || a.email.toLowerCase().indexOf(q) !== -1;
      });
    }
    return list;
  }
  // 依當前登入者身份，決定新增/編輯帳號時可以選哪些角色（見規格「可見範圍」表）
  function allowedRoleOptions() {
    if (state.demoRole === "companyAdmin") return ["deptManager", "user"];
    if (state.demoRole === "deptManager") return ["user", "deptManager"];
    return [];
  }

  // ---- 頂層分流 ----
  function renderOrgHTML(childId) {
    if (childId === "org-departments") return renderDepartmentsPage();
    return renderAccountsPage();
  }
  function wireOrgPage(childId) {
    if (childId === "org-departments") { wireDepartmentsPage(); return; }
    wireAccountsPage();
  }

  // ============================================================
  // 一、帳號（主頁）
  // ============================================================
  function renderOrgTree() {
    let html = '<div class="org-tree">';
    html += '<div class="org-tree-company">' + icon("org", 'style="width:15px;height:15px"') + 'EVERY8D 股份有限公司</div>';
    const allCount = ACCOUNTS.filter(function (a) { return a.deptId !== null; }).length;
    html += '<button class="org-tree-item' + (orgState.deptFilter === "all" ? " active" : "") + '" data-tree="all">全部帳號<span class="cnt">' + allCount + '</span></button>';
    DEPARTMENTS.forEach(function (d) {
      const cnt = ACCOUNTS.filter(function (a) { return a.deptId === d.id; }).length;
      html += '<button class="org-tree-item' + (orgState.deptFilter === d.id ? " active" : "") + '" data-tree="' + d.id + '">' + d.name + '<span class="cnt">' + cnt + '</span></button>';
    });
    html += '</div>';
    return html;
  }

  function renderFilterBar() {
    const isAdmin = state.demoRole === "companyAdmin";
    let html = '<div class="filter-bar">';
    html += '<div class="filter-search">' + icon("search") + '<input type="text" id="acctSearch" placeholder="搜尋姓名／帳號／E-mail" value="' + escAttr(orgState.search) + '"></div>';
    if (isAdmin) {
      const deptOptions = [{ value: "all", label: "所有部門" }].concat(DEPARTMENTS.map(function (d) { return { value: d.id, label: d.name }; }));
      html += renderDropdown("acctDeptFilter", deptOptions, orgState.deptFilter, {
        onChange: function (v) { orgState.deptFilter = v; syncOrgTreeActive(); refreshAccountsScope(); }
      });
    }
    const roleOptions = [{ value: "all", label: "所有角色" }, { value: "deptManager", label: "部門管理員" }, { value: "user", label: "一般使用者" }];
    html += renderDropdown("acctRoleFilter", roleOptions, orgState.roleFilter, {
      onChange: function (v) { orgState.roleFilter = v; refreshAccountsList(); }
    });
    const statusOptions = [{ value: "all", label: "所有狀態" }, { value: "active", label: "啟用" }, { value: "disabled", label: "停用" }];
    html += renderDropdown("acctStatusFilter", statusOptions, orgState.statusFilter, {
      onChange: function (v) { orgState.statusFilter = v; refreshAccountsList(); }
    });
    html += '<div class="filter-bar-spacer"></div>';
    if (!orgState.bulkMode) html += '<button class="btn btn-secondary" id="btnBulkToggle">批次操作</button>';
    html += '<button class="btn btn-primary" id="btnNewAccount">' + icon("plus") + '新增帳號</button>';
    html += '</div>';
    return html;
  }

  function renderBulkBar() {
    if (!orgState.bulkMode) return "";
    const n = orgState.selectedIds.size;
    return '<div class="bulk-bar"><span class="bb-count">已選 ' + n + ' 筆</span>' +
      '<div class="bulk-bar-spacer"></div>' +
      '<button class="btn btn-secondary btn-sm" id="btnBulkDisable"' + (n === 0 ? " disabled" : "") + '>批次停用</button>' +
      '<button class="btn btn-secondary btn-sm" id="btnBulkEnable"' + (n === 0 ? " disabled" : "") + '>批次啟用</button>' +
      '<button class="btn-text" id="btnBulkCancel">取消</button>' +
      '</div>';
  }

  // 三種空狀態分開判斷，文案/CTA 都不一樣（2026-08-12）：
  // ① 這個身份看得到的範圍裡完全沒帳號（全新公司／被清空）② 單純點了一個 0 帳號的部門
  // （沒有另外打字搜尋或選角色/狀態）③ 真的有下條件（搜尋/角色/狀態）但篩不出東西
  function renderAccountsList() {
    const list = filteredAccounts();
    if (list.length === 0) {
      const totalInScope = scopedAccounts().length;
      const hasSearchOrOtherFilter = orgState.search.trim() !== "" || orgState.roleFilter !== "all" || orgState.statusFilter !== "all";
      const deptOnlySelected = orgState.deptFilter !== "all" && !hasSearchOrOtherFilter;

      if (totalInScope === 0) {
        return '<div class="table-card"><div class="empty-state">' + icon("users") +
          '<p>還沒有任何子帳號，建立第一個子帳號開始管理</p>' +
          '<button class="btn btn-primary" id="btnNewAccountEmpty">' + icon("plus") + '新增帳號</button>' +
          '</div></div>';
      }
      if (deptOnlySelected) {
        const deptName = DEPARTMENTS.find(function (d) { return d.id === orgState.deptFilter; }).name;
        return '<div class="table-card"><div class="empty-state">' + icon("users") +
          '<p>「' + escAttr(deptName) + '」目前還沒有帳號</p>' +
          '<button class="btn btn-primary" id="btnNewAccountEmpty">' + icon("plus") + '新增帳號</button>' +
          '</div></div>';
      }
      return '<div class="table-card"><div class="empty-state">' + icon("search") +
        '<p>找不到符合條件的帳號</p>' +
        '<button class="btn btn-secondary" id="btnClearFilters">清除篩選</button>' +
        '</div></div>';
    }
    const bulkMode = orgState.bulkMode;
    const rows = list.map(function (a) {
      const dept = a.deptId ? DEPARTMENTS.find(function (d) { return d.id === a.deptId; }).name : "—（總公司）";
      const statusBadge = a.status === "active"
        ? '<span class="badge-dot is-active"><span class="dot"></span>啟用</span>'
        : '<span class="badge-dot is-disabled"><span class="dot"></span>停用</span>';
      const manageable = a.role !== "companyAdmin";
      let actions = '<button class="btn-text" data-edit="' + a.id + '">編輯</button>';
      if (manageable) actions += '<button class="btn-danger-text" data-delete="' + a.id + '">刪除</button>';
      const checkCell = bulkMode
        ? '<td class="col-check">' + (manageable ? checkboxHtml(' class="rowChk" data-id="' + a.id + '"', orgState.selectedIds.has(a.id)) : "") + '</td>'
        : "";
      // 姓名／帳號／所屬部門／E-mail 是長度不固定的欄位，內容超出欄寬時往下換行、完整顯示
      // （不截斷、不掛 tooltip——帳號管理要一眼看到完整資料）；員工編號／手機走 .num-cell，
      // 固定不換行、給足欄寬（見表頭 width）
      return '<tr>' + checkCell +
        '<td>' + statusBadge + '</td>' +
        '<td class="name-cell wrap-cell">' + escAttr(a.name) + '</td>' +
        '<td class="muted wrap-cell">' + escAttr(a.account) + '</td>' +
        '<td class="wrap-cell">' + escAttr(dept) + '</td>' +
        '<td>' + ROLES[a.role].label + '</td>' +
        '<td class="muted num-cell">' + (a.empNo || "—") + '</td>' +
        '<td class="muted num-cell">' + dialDisplay(a.countryIso) + " " + a.phone + '</td>' +
        '<td class="muted wrap-cell">' + escAttr(a.email) + '</td>' +
        '<td class="col-actions"><div class="row-actions">' + actions + '</div></td>' +
        '</tr>';
    }).join("");
    // 2026-08-12 第三版：欄寬全部改成「百分比」而不是固定 px。上一版用 px 寫死每欄寬度，
    // 加總（~1150px）常常超過容器實際寬度（側欄+部門樹吃掉不少空間），table-layout:fixed
    // 底下 px 欄寬是「最小需求」不是「上限」，容器裝不下時表格會被撐寬到超出去，這才是
    // 上一輪表格還在橫向捲動、操作欄被切掉的根本原因。百分比欄寬 + 表格 width:100%，
    // 欄寬永遠等於「容器寬度 × 各欄比例」，加總精確等於容器寬度，數學上不可能超出去，
    // 不需要再靠橫向捲動或 sticky 補救。批次模式多一欄 checkbox，比例要重新分配過，
    // 不能直接在原本 100% 之外加一欄（那樣一樣會超出 100%），所以兩組比例分開算
    const W = bulkMode
      ? { check: 4, status: 6.7, name: 9, account: 10.5, dept: 9.5, role: 8.5, empNo: 12.5, phone: 13.5, email: 12.5, actions: 12.5 }
      : { status: 7, name: 9.5, account: 11, dept: 10, role: 9, empNo: 13, phone: 14, email: 13.5, actions: 13 };
    const checkHeadCell = bulkMode ? '<th class="col-check" style="width:' + W.check + '%">' + checkboxHtml(' id="selectAllChk"', false) + '</th>' : "";
    return '<div class="table-card"><div class="table-scroll"><table class="data-table is-interactive acct-table"><thead><tr>' + checkHeadCell +
      '<th style="width:' + W.status + '%">帳號狀態</th><th style="width:' + W.name + '%">姓名</th><th style="width:' + W.account + '%">帳號</th>' +
      '<th style="width:' + W.dept + '%">所屬部門</th><th style="width:' + W.role + '%">角色</th><th style="width:' + W.empNo + '%">員工編號</th>' +
      '<th style="width:' + W.phone + '%">手機</th><th style="width:' + W.email + '%">E-mail</th><th class="col-actions" style="width:' + W.actions + '%">操作</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  // 2026-08-11 第四輪：部門管理員原本看到的是一整條橘色警示 banner（「目前身份僅能管理…」），
  // Alvie 覺得太重，改成跟企業管理員點部門樹時同一種輕量小字（icon+部門名稱+主管），
  // 兩處共用同一個 renderer，不同身份看到的資訊呈現方式統一
  function renderDeptContextLine(deptId) {
    const dept = DEPARTMENTS.find(function (d) { return d.id === deptId; });
    if (!dept) return "";
    const manager = dept.managerId ? ACCOUNTS.find(function (a) { return a.id === dept.managerId; }) : null;
    return '<div class="dept-context">' + icon("users") + dept.name + ' · 主管：' + (manager ? manager.name : "未指派") + '</div>';
  }
  function renderDeptContext() {
    if (orgState.deptFilter === "all") return "";
    return renderDeptContextLine(orgState.deptFilter);
  }

  function renderAccountsPage() {
    const isAdmin = state.demoRole === "companyAdmin";
    let html = '<div class="page-head"><h1>子帳號管理</h1></div>';
    html += '<div class="page-sub">管理公司底下所有子帳號，建立、停用、指派部門與角色</div>';
    html += '<div class="org-shell">';
    if (isAdmin) html += renderOrgTree();
    html += '<div class="org-main">';
    if (!isAdmin) html += renderDeptContextLine(DEMO_DEPT_FOR_MANAGER);
    if (isAdmin) html += '<div id="deptContextWrap">' + renderDeptContext() + '</div>';
    html += renderFilterBar();
    html += '<div id="bulkBarWrap">' + renderBulkBar() + '</div>';
    html += '<div id="orgAccountsListWrap">' + renderAccountsList() + '</div>';
    html += '</div></div>';
    return html;
  }

  function syncOrgTreeActive() {
    document.querySelectorAll("[data-tree]").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-tree") === orgState.deptFilter);
    });
  }
  // 部門樹／部門篩選 → 除了重畫列表，還要重畫「部門情境列」（部門名稱＋主管）
  function refreshAccountsScope() {
    const ctxWrap = document.getElementById("deptContextWrap");
    if (ctxWrap) ctxWrap.innerHTML = renderDeptContext();
    refreshAccountsList();
  }
  function refreshAccountsList() {
    const wrap = document.getElementById("orgAccountsListWrap");
    if (!wrap) return;
    wrap.innerHTML = renderAccountsList();
    bindListRowActions();
  }
  function bindListRowActions() {
    document.querySelectorAll("[data-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () { openAccountDrawer(btn.getAttribute("data-edit")); });
    });
    document.querySelectorAll("[data-delete]").forEach(function (btn) {
      btn.addEventListener("click", function () { openConfirm(btn.getAttribute("data-delete"), "account"); });
    });
    document.querySelectorAll("#btnNewAccountEmpty").forEach(function (btn) {
      btn.addEventListener("click", function () { openAccountDrawer(null); });
    });
    document.querySelectorAll("#btnClearFilters").forEach(function (btn) {
      btn.addEventListener("click", function () {
        orgState.search = ""; orgState.deptFilter = "all"; orgState.roleFilter = "all"; orgState.statusFilter = "all";
        const searchEl = document.getElementById("acctSearch");
        if (searchEl) searchEl.value = "";
        syncOrgTreeActive();
        ddSetValue("acctDeptFilter", "all", { silent: true });
        ddSetValue("acctRoleFilter", "all", { silent: true });
        ddSetValue("acctStatusFilter", "all", { silent: true });
        refreshAccountsScope();
      });
    });
    if (orgState.bulkMode) {
      document.querySelectorAll(".rowChk").forEach(function (cb) {
        cb.addEventListener("change", function () {
          if (this.checked) orgState.selectedIds.add(this.getAttribute("data-id"));
          else orgState.selectedIds.delete(this.getAttribute("data-id"));
          syncSelectAllChk();
          syncBulkBar();
        });
      });
      const selAll = document.getElementById("selectAllChk");
      if (selAll) {
        syncSelectAllChk();
        // 主流全選邏輯（Gmail 那種）：只要目前「有任何已選」（不管全選還是部分選取），
        // 點下去都是清空；只有完全沒選時點下去才是全選。用 click+preventDefault 自己控制
        // checked/indeterminate，不能信任瀏覽器對 indeterminate checkbox 的原生點擊行為
        // ——原生行為是「indeterminate 點一下變全選」，跟這裡要的邏輯相反
        selAll.addEventListener("click", function (e) {
          e.preventDefault();
          const ids = filteredAccounts().filter(function (a) { return a.role !== "companyAdmin"; }).map(function (a) { return a.id; });
          const anySelected = ids.some(function (id) { return orgState.selectedIds.has(id); });
          if (anySelected) ids.forEach(function (id) { orgState.selectedIds.delete(id); });
          else ids.forEach(function (id) { orgState.selectedIds.add(id); });
          refreshAccountsList();
          syncBulkBar();
        });
      }
    }
  }
  function syncSelectAllChk() {
    const selAll = document.getElementById("selectAllChk");
    if (!selAll) return;
    const ids = filteredAccounts().filter(function (a) { return a.role !== "companyAdmin"; }).map(function (a) { return a.id; });
    const selectedCount = ids.filter(function (id) { return orgState.selectedIds.has(id); }).length;
    selAll.checked = ids.length > 0 && selectedCount === ids.length;
    selAll.indeterminate = selectedCount > 0 && selectedCount < ids.length;
  }
  function syncBulkBar() {
    const wrap = document.getElementById("bulkBarWrap");
    if (!wrap) return;
    wrap.innerHTML = renderBulkBar();
    wireBulkBar();
  }
  function wireBulkBar() {
    const dis = document.getElementById("btnBulkDisable");
    if (dis) dis.addEventListener("click", function () { openBulkConfirm("disable"); });
    const en = document.getElementById("btnBulkEnable");
    if (en) en.addEventListener("click", function () { openBulkConfirm("enable"); });
    const cancel = document.getElementById("btnBulkCancel");
    if (cancel) cancel.addEventListener("click", function () { exitBulkMode(); });
  }
  function enterBulkMode() {
    orgState.bulkMode = true;
    orgState.selectedIds = new Set();
    renderContent();
  }
  function exitBulkMode() {
    orgState.bulkMode = false;
    orgState.selectedIds = new Set();
    renderContent();
  }
  function openBulkConfirm(type) {
    const n = orgState.selectedIds.size;
    if (n === 0) return;
    const title = type === "disable" ? "批次停用帳號" : "批次啟用帳號";
    const body = type === "disable"
      ? "確定要停用選取的 " + n + " 筆帳號嗎？停用後這些帳號將無法登入。"
      : "確定要重新啟用選取的 " + n + " 筆帳號嗎？";
    const html = '<div class="confirm-modal"><h3>' + title + '</h3><p>' + body + '</p>' +
      '<div class="cm-foot"><button class="btn btn-secondary" id="confirmCancel">取消</button>' +
      '<button class="btn btn-primary" id="confirmOk">' + (type === "disable" ? "停用" : "啟用") + '</button></div></div>';
    document.getElementById("orgConfirmMask").innerHTML = html;
    document.getElementById("orgConfirmMask").classList.add("open");
    document.getElementById("confirmCancel").addEventListener("click", closeConfirm);
    document.getElementById("confirmOk").addEventListener("click", function () {
      runBulkAction(type === "disable" ? "disabled" : "active");
    });
  }
  function runBulkAction(newStatus) {
    const ids = Array.from(orgState.selectedIds);
    ids.forEach(function (id) {
      const a = ACCOUNTS.find(function (x) { return x.id === id; });
      if (a) a.status = newStatus;
    });
    showToast("已" + (newStatus === "disabled" ? "停用" : "啟用") + " " + ids.length + " 筆帳號");
    closeConfirm();
    exitBulkMode();
  }
  function wireAccountsPage() {
    bindListRowActions();
    const searchEl = document.getElementById("acctSearch");
    if (searchEl) searchEl.addEventListener("input", function () { orgState.search = this.value; refreshAccountsList(); });
    ddBind("acctDeptFilter");
    ddBind("acctRoleFilter");
    ddBind("acctStatusFilter");
    document.querySelectorAll("[data-tree]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        orgState.deptFilter = btn.getAttribute("data-tree");
        ddSetValue("acctDeptFilter", orgState.deptFilter, { silent: true });
        syncOrgTreeActive();
        refreshAccountsScope();
      });
    });
    const btnNew = document.getElementById("btnNewAccount");
    if (btnNew) btnNew.addEventListener("click", function () { openAccountDrawer(null); });
    const btnBulk = document.getElementById("btnBulkToggle");
    if (btnBulk) btnBulk.addEventListener("click", enterBulkMode);
    wireBulkBar();
  }

  // ---- 角色 → 可用功能即時預覽 ----
  function renderPermPreview(role) {
    const active = featuresForRole(role);
    const items = allPermItems().map(function (item) {
      const on = active.indexOf(item.label) !== -1;
      return '<span class="perm-item' + (on ? "" : " is-off") + '">' + (on ? icon("check") : "") + item.label + '</span>';
    }).join("");
    return '<div class="perm-preview"><div class="pp-title">' + icon("idCard") + '此身份可用功能</div><div class="perm-list">' + items + '</div></div>';
  }

  // ---- 建立／編輯帳號 Drawer ----
  function openAccountDrawer(accountId) {
    orgState.editingId = accountId || null;
    const acct = accountId ? ACCOUNTS.find(function (a) { return a.id === accountId; }) : null;
    const isEdit = !!acct;
    const isAdmin = state.demoRole === "companyAdmin";
    const roleChoices = allowedRoleOptions();
    const scopedDepts = DEPARTMENTS.filter(function (d) { return isAdmin || d.id === DEMO_DEPT_FOR_MANAGER; });
    const defaultDept = isAdmin ? scopedDepts[0].id : DEMO_DEPT_FOR_MANAGER;

    const deptOptions = scopedDepts.map(function (d) { return { value: d.id, label: d.name }; });
    const initialDept = acct ? acct.deptId : defaultDept;
    const roleOptions = roleChoices.map(function (r) { return { value: r, label: ROLES[r].label }; });
    const countryOptions = COUNTRY_CODES.map(function (c) { return { value: c.iso, label: c.name }; });
    const initialCountry = acct ? acct.countryIso : "TW";
    const initialRole = acct ? acct.role : roleChoices[0];

    let html = '<div class="drawer-head"><h2>' + (isEdit ? "編輯帳號" : "新增帳號") + '</h2>' +
      '<button class="drawer-close" id="drawerClose">' + icon("x") + '</button></div>';
    html += '<div class="drawer-body">';
    // 帳號是唯一識別鍵，建立後鎖死不可改——避免改了帳號但登入紀錄/對外系統對不上
    // 星號維持顯示（Alvie 2026-08-12 確認：disabled 樣式底下星號不衝突，拿掉說明文字/改淡背景就夠了）
    // 2026-08-12：maxlength 改採舊網站實測值（Alvie 提供，非暫定）——帳號 50、姓名 50、
    // 員工編號 50、電子信箱 250、手機 15（純號碼，國碼另外用下拉選，不計入）、部門名稱 15、部門代碼 15
    html += field("account", "帳號", true,
      '<input type="text" id="fAccount" autocomplete="off" maxlength="50"' + (isEdit ? ' disabled class="is-readonly"' : "") + ' value="' + escAttr(acct ? acct.account : "") + '">');
    html += '<div class="field-row">';
    html += field("dept", "部門", true, renderDropdown("fDept", deptOptions, initialDept, { disabled: !isAdmin }));
    html += field("role", "角色", true, renderDropdown("fRole", roleOptions, initialRole, {
      onChange: function (v) { document.getElementById("permPreviewWrap").innerHTML = renderPermPreview(v); }
    }));
    html += '</div>';
    html += '<div id="permPreviewWrap">' + renderPermPreview(initialRole) + '</div>';
    html += field("name", "姓名", true, '<input type="text" id="fName" maxlength="50" value="' + escAttr(acct ? acct.name : "") + '">');
    html += '<div class="field-row">';
    html += field("pwd", isEdit ? "重設密碼" : "設定密碼", !isEdit, '<input type="password" id="fPwd" maxlength="16" autocomplete="new-password">');
    html += field("pwd2", "再次確認", !isEdit, '<input type="password" id="fPwd2" maxlength="16" autocomplete="new-password">');
    html += '</div>';
    html += '<div class="hint" style="margin:-10px 0 16px">長度 8–16 碼，須英數字混合並包含大寫及小寫英文字母' + (isEdit ? '；留空表示不變更密碼' : '') + '</div>';
    html += field("empNo", "員工編號", false, '<input type="text" id="fEmpNo" maxlength="50" value="' + escAttr(acct ? acct.empNo : "") + '">');
    html += '<div class="field-group" data-field="phone"><label>行動電話<span class="req">*</span></label><div class="field-row">' +
      '<div style="flex:1.5">' + renderDropdown("fCountry", countryOptions, initialCountry, {
        onChange: function (v) { document.getElementById("fDial").textContent = dialDisplay(v); }
      }) + '</div>' +
      '<div class="dial-code" id="fDial">' + dialDisplay(initialCountry) + '</div>' +
      '<input type="tel" id="fPhone" placeholder="手機號碼" style="flex:2" maxlength="15" value="' + escAttr(acct ? acct.phone : "") + '">' +
      '</div><div class="err-msg" id="err-phone" style="display:none"></div></div>';
    html += field("email", "電子信箱", true, '<input type="email" id="fEmail" maxlength="250" value="' + escAttr(acct ? acct.email : "") + '">');
    html += '<div class="field-divider"></div>';
    html += '<div class="toggle-row"><div><div class="tr-label">開啟國際簡訊</div><div class="tr-sub">關閉後此帳號僅能發送台灣門號簡訊</div></div>' + toggleHtml("fIntlSms", acct ? acct.intlSms : false) + '</div>';
    html += '<div class="toggle-row"><div><div class="tr-label">啟用帳號</div><div class="tr-sub">關閉後此帳號將無法登入</div></div>' + toggleHtml("fEnabled", acct ? acct.status === "active" : true) + '</div>';
    html += '</div>';
    html += '<div class="drawer-foot"><button class="btn btn-secondary" id="drawerCancel">取消</button><button class="btn btn-primary" id="drawerSave">' + (isEdit ? "儲存" : "建立帳號") + '</button></div>';

    document.getElementById("orgDrawer").innerHTML = html;
    document.getElementById("orgDrawerMask").classList.add("open");
    document.getElementById("orgDrawer").classList.add("open");
    wireDrawer();
  }
  function closeDrawer() {
    document.getElementById("orgDrawerMask").classList.remove("open");
    document.getElementById("orgDrawer").classList.remove("open");
  }
  function wireDrawer() {
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
    document.getElementById("drawerCancel").addEventListener("click", closeDrawer);
    ddBind("fDept");
    ddBind("fRole");
    ddBind("fCountry");
    // 帳號格式即時提示，只在新增時掛（編輯頁欄位 disabled，不會有 input 事件）
    if (!orgState.editingId) {
      document.getElementById("fAccount").addEventListener("input", function () {
        if (this.value && !/^[A-Za-z0-9]*$/.test(this.value)) setFieldError("account", "帳號請輸入英文字母或數字");
        else clearFieldError("account");
      });
    }
    document.getElementById("drawerSave").addEventListener("click", saveAccountFromDrawer);
  }
  function saveAccountFromDrawer() {
    clearFieldErrors();
    const accountVal = document.getElementById("fAccount").value.trim();
    const deptVal = ddValue("fDept");
    const roleVal = ddValue("fRole");
    const nameVal = document.getElementById("fName").value.trim();
    const pwdVal = document.getElementById("fPwd").value;
    const pwd2Val = document.getElementById("fPwd2").value;
    const empNoVal = document.getElementById("fEmpNo").value.trim();
    const countryVal = ddValue("fCountry");
    const phoneVal = document.getElementById("fPhone").value.trim();
    const emailVal = document.getElementById("fEmail").value.trim();
    const intlSmsVal = document.getElementById("fIntlSms").checked;
    const enabledVal = document.getElementById("fEnabled").checked;
    const isEdit = !!orgState.editingId;
    const pwdRe = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{8,16}$/;
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const accountRe = /^[A-Za-z0-9]+$/;
    let hasError = false;

    if (!accountVal) { setFieldError("account", "請輸入帳號"); hasError = true; }
    else {
      const dup = ACCOUNTS.some(function (a) { return a.account.toLowerCase() === accountVal.toLowerCase() && a.id !== orgState.editingId; });
      if (dup) { setFieldError("account", "此帳號已被使用"); hasError = true; }
      // 帳號格式規則（現行 e8d 既有規則：只能英文字母/數字）只套用在新增，編輯頁帳號欄位
      // disabled、值不會變，既有帳號可能是舊規則建立的（如帶點的 ben.chen），不應該被新規則擋下
      else if (!isEdit) {
        if (!accountRe.test(accountVal)) { setFieldError("account", "帳號請輸入英文字母或數字"); hasError = true; }
        else if (accountVal.length < 4 || accountVal.length > 50) { setFieldError("account", "帳號長度需為 4–50 字元"); hasError = true; }
      }
    }
    if (!nameVal) { setFieldError("name", "請輸入姓名"); hasError = true; }
    if (!deptVal) { setFieldError("dept", "請選擇部門"); hasError = true; }
    if (!roleVal) { setFieldError("role", "請選擇角色"); hasError = true; }
    if (!isEdit || pwdVal || pwd2Val) {
      if (!isEdit && !pwdVal) { setFieldError("pwd", "請設定密碼"); hasError = true; }
      else if (pwdVal && !pwdRe.test(pwdVal)) { setFieldError("pwd", "密碼須為 8–16 碼英數混合，含大小寫"); hasError = true; }
      if (pwdVal !== pwd2Val) { setFieldError("pwd2", "兩次密碼輸入不一致"); hasError = true; }
    }
    // 2026-08-12：舊 e8d 這兩欄是必填，補上（原本只有格式沒有必填）
    if (!phoneVal) { setFieldError("phone", "請輸入手機號碼"); hasError = true; }
    if (!emailVal) { setFieldError("email", "請輸入電子信箱"); hasError = true; }
    else if (!emailRe.test(emailVal)) { setFieldError("email", "請輸入正確的 E-mail 格式"); hasError = true; }
    if (hasError) return;

    if (isEdit) {
      const acct = ACCOUNTS.find(function (a) { return a.id === orgState.editingId; });
      acct.account = accountVal; acct.deptId = deptVal; acct.role = roleVal; acct.name = nameVal;
      acct.empNo = empNoVal; acct.countryIso = countryVal; acct.phone = phoneVal; acct.email = emailVal;
      acct.intlSms = intlSmsVal; acct.status = enabledVal ? "active" : "disabled";
      showToast("已儲存「" + nameVal + "」的變更");
    } else {
      ACCOUNTS.push({
        id: "a" + (nextAccountSeq++), status: enabledVal ? "active" : "disabled", name: nameVal, account: accountVal,
        deptId: deptVal, role: roleVal, empNo: empNoVal, countryIso: countryVal, phone: phoneVal, email: emailVal, intlSms: intlSmsVal
      });
      showToast("已建立帳號「" + nameVal + "」");
    }
    closeDrawer();
    renderContent();
  }

  // ---- 停用／啟用／刪除 確認框（沿用系統 Modal 定案：危險/一般確認無 ✕、footer 無分隔線） ----
  // 2026-08-11 第二輪：列表拿掉了停用/啟用連結（改到修改抽屜的開關），這裡只剩「刪除」會走到，
  // 批次停用/啟用另外走 openBulkConfirm()/runBulkAction()，跟這裡的單筆刪除是兩條獨立路徑
  function openConfirm(id, kind) {
    orgState.pendingConfirm = { id: id, kind: kind };
    let title, body;
    if (kind === "department") {
      const dept = DEPARTMENTS.find(function (d) { return d.id === id; });
      title = "刪除部門"; body = "確定要刪除「" + dept.name + "」嗎？此操作無法復原。";
    } else {
      const acct = ACCOUNTS.find(function (a) { return a.id === id; });
      title = "刪除帳號"; body = "確定要刪除「" + acct.name + "」嗎？此操作無法復原。";
    }
    const html = '<div class="confirm-modal"><h3>' + title + '</h3><p>' + body + '</p>' +
      '<div class="flag-note" style="margin-top:14px">' + icon("flag") +
      '<div>刪除方式（硬刪除或改為停用）尚待 PM 確認，此為 UI 示意<span class="todo-tag">TODO</span></div></div>' +
      '<div class="cm-foot"><button class="btn btn-secondary" id="confirmCancel">取消</button>' +
      '<button class="btn btn-danger" id="confirmOk">刪除</button></div></div>';
    document.getElementById("orgConfirmMask").innerHTML = html;
    document.getElementById("orgConfirmMask").classList.add("open");
    document.getElementById("confirmCancel").addEventListener("click", closeConfirm);
    document.getElementById("confirmOk").addEventListener("click", runConfirm);
  }
  function closeConfirm() {
    document.getElementById("orgConfirmMask").classList.remove("open");
    orgState.pendingConfirm = null;
  }
  function runConfirm() {
    const pc = orgState.pendingConfirm;
    if (!pc) return;
    if (pc.kind === "department") {
      const idx = DEPARTMENTS.findIndex(function (d) { return d.id === pc.id; });
      const name = DEPARTMENTS[idx].name;
      DEPARTMENTS.splice(idx, 1);
      showToast("已刪除部門「" + name + "」");
    } else {
      const acct = ACCOUNTS.find(function (a) { return a.id === pc.id; });
      ACCOUNTS.splice(ACCOUNTS.indexOf(acct), 1);
      showToast("已刪除「" + acct.name + "」");
    }
    closeConfirm();
    renderContent();
  }

  // ============================================================
  // 二、部門（含指派主管，不另開頁）
  // ============================================================
  function renderManagerCell(d) {
    const isAdmin = state.demoRole === "companyAdmin";
    const manager = d.managerId ? ACCOUNTS.find(function (a) { return a.id === d.managerId; }) : null;
    const label = manager ? manager.name : '<span class="muted">未指派</span>';
    if (!isAdmin) return label;
    return '<span style="display:inline-flex;align-items:center;gap:8px">' + label +
      '<button class="btn-text" data-assign="' + d.id + '" style="font-size:var(--fs-caption)">' + (manager ? "重新指派" : "指派") + '</button></span>';
  }
  function renderDeptList() {
    const isAdmin = state.demoRole === "companyAdmin";
    const depts = isAdmin ? DEPARTMENTS : DEPARTMENTS.filter(function (d) { return d.id === DEMO_DEPT_FOR_MANAGER; });
    const rows = depts.map(function (d) {
      const cnt = ACCOUNTS.filter(function (a) { return a.deptId === d.id; }).length;
      let actions = "";
      if (isAdmin) {
        actions = '<div class="row-actions">' +
          '<button class="btn-text" data-edit-dept="' + d.id + '">編輯</button>' +
          '<button class="btn-danger-text" data-del-dept="' + d.id + '"' + (cnt > 0 ? ' disabled title="部門底下還有帳號，需先搬移或停用才能刪除"' : "") + '>刪除</button>' +
          '</div>';
      }
      return '<tr>' +
        '<td class="name-cell wrap-cell">' + escAttr(d.name) + '</td>' +
        '<td class="muted num-cell">' + d.code + '</td>' +
        '<td data-dept-manager-cell="' + d.id + '">' + renderManagerCell(d) + '</td>' +
        '<td class="num-cell muted">' + cnt + ' 人</td>' +
        '<td class="col-actions">' + actions + '</td>' +
        '</tr>';
    }).join("");
    return '<div class="table-card"><div class="table-scroll"><table class="data-table is-interactive dept-table"><thead><tr>' +
      '<th style="width:27%">部門名稱</th><th style="width:17%">部門代碼</th><th style="width:25%">目前部門主管</th>' +
      '<th style="width:14%">帳號數</th><th class="col-actions" style="width:17%">操作</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }
  function renderDepartmentsPage() {
    const isAdmin = state.demoRole === "companyAdmin";
    let html = '<div class="page-head"><h1>部門</h1></div>';
    html += '<div class="page-sub">' + (isAdmin ? "管理部門與各部門主管指派" : "檢視您所屬部門的資訊（唯讀）") + '</div>';
    if (isAdmin) html += '<div class="filter-bar" style="justify-content:flex-end"><button class="btn btn-primary" id="btnNewDept">' + icon("plus") + '新增部門</button></div>';
    html += '<div id="deptListWrap">' + renderDeptList() + '</div>';
    return html;
  }
  // 新增／編輯部門共用同一個小型表單 modal（deptId=null 代表新增）。
  // 2026-08-11 第二輪：原本「改名」是表格 inline 編輯，但補了必填的「部門代碼」欄位後
  // 一個儲存格塞兩個輸入框太擠，改成跟新增部門同一個 modal，順便統一了兩條路徑的驗證邏輯
  function deptCodeTaken(code, excludeId) {
    return DEPARTMENTS.some(function (d) { return d.id !== excludeId && d.code.toLowerCase() === code.toLowerCase(); });
  }
  function openDeptFormModal(deptId) {
    const dept = deptId ? DEPARTMENTS.find(function (d) { return d.id === deptId; }) : null;
    const isEdit = !!dept;
    // maxlength 採舊網站實測值（見 openAccountDrawer 開頭的說明）
    const html = '<div class="confirm-modal"><h3>' + (isEdit ? "編輯部門" : "新增部門") + '</h3>' +
      '<div class="field-group" data-field="deptName" style="margin-top:14px"><label>部門名稱<span class="req">*</span></label>' +
      '<input type="text" id="deptNameInput" maxlength="15" value="' + escAttr(dept ? dept.name : "") + '"><div class="err-msg" id="err-deptName" style="display:none"></div></div>' +
      '<div class="field-group" data-field="deptCode"><label>部門代碼<span class="req">*</span></label>' +
      '<input type="text" id="deptCodeInput" placeholder="例如 SALES01" maxlength="15" value="' + escAttr(dept ? dept.code : "") + '">' +
      '<div class="err-msg" id="err-deptCode" style="display:none"></div></div>' +
      '<div class="cm-foot"><button class="btn btn-secondary" id="deptFormCancel">取消</button><button class="btn btn-primary" id="deptFormOk">' + (isEdit ? "儲存" : "建立") + '</button></div></div>';
    document.getElementById("orgConfirmMask").innerHTML = html;
    document.getElementById("orgConfirmMask").classList.add("open");
    document.getElementById("deptNameInput").focus();
    document.getElementById("deptFormCancel").addEventListener("click", closeConfirm);
    document.getElementById("deptFormOk").addEventListener("click", function () {
      clearFieldErrors();
      const nameVal = document.getElementById("deptNameInput").value.trim();
      const codeVal = document.getElementById("deptCodeInput").value.trim();
      let hasError = false;
      if (!nameVal) { setFieldError("deptName", "請輸入部門名稱"); hasError = true; }
      if (!codeVal) { setFieldError("deptCode", "請輸入部門代碼"); hasError = true; }
      else if (!/^[A-Za-z0-9]+$/.test(codeVal)) { setFieldError("deptCode", "只能是英文字母與數字"); hasError = true; }
      else if (deptCodeTaken(codeVal, deptId)) { setFieldError("deptCode", "這個部門代碼已經被使用"); hasError = true; }
      if (hasError) return;
      if (isEdit) {
        dept.name = nameVal; dept.code = codeVal.toUpperCase();
        showToast("已儲存「" + nameVal + "」的變更");
      } else {
        DEPARTMENTS.push({ id: "d" + Date.now().toString(36), name: nameVal, code: codeVal.toUpperCase(), managerId: null });
        showToast("已新增部門「" + nameVal + "」");
      }
      closeConfirm();
      renderContent();
    });
  }
  function startAssignManager(deptId) {
    const cell = document.querySelector('[data-dept-manager-cell="' + deptId + '"]');
    const dept = DEPARTMENTS.find(function (d) { return d.id === deptId; });
    const deptAccounts = ACCOUNTS.filter(function (a) { return a.deptId === deptId; });
    const options = [{ value: "", label: "未指派" }].concat(deptAccounts.map(function (a) { return { value: a.id, label: a.name }; }));
    cell.innerHTML = renderDropdown("assignSelect", options, dept.managerId || "", {
      className: "manager-select",
      onChange: function (value) {
        const newManagerId = value || null;
        const oldManagerId = dept.managerId;
        // 換人＝把舊主管的角色退回一般使用者、新主管的角色升成部門管理員，
        // 讓「部門頁指派主管」跟「帳號頁角色」兩處資料保持一致（一個部門同時間只有一位主管）
        if (oldManagerId && oldManagerId !== newManagerId) {
          const oldAcct = ACCOUNTS.find(function (a) { return a.id === oldManagerId; });
          if (oldAcct) oldAcct.role = "user";
        }
        dept.managerId = newManagerId;
        let msg = "已取消" + dept.name + "主管指派";
        if (newManagerId) {
          const newAcct = ACCOUNTS.find(function (a) { return a.id === newManagerId; });
          newAcct.role = "deptManager";
          msg = "已指派「" + newAcct.name + "」為" + dept.name + "主管";
        }
        showToast(msg);
        renderContent();
      }
    });
    ddBind("assignSelect");
    // 延到下一輪事件迴圈才自動展開：這個呼叫是在「指派/換人」按鈕的 click handler 裡觸發的，
    // 同一個 click 事件還在往上冒泡到 document 的「點外面關閉」監聽器，若同步呼叫 ddOpen()，
    // 會被那個監聽器誤判成「點了下拉外面」當場關掉（e.target 還是舊的觸發按鈕，不在新面板/新按鈕裡）
    setTimeout(function () { ddOpen(document.getElementById("dd-assignSelect")); }, 0);
  }
  function wireDepartmentsPage() {
    const btnNew = document.getElementById("btnNewDept");
    if (btnNew) btnNew.addEventListener("click", function () { openDeptFormModal(null); });
    document.querySelectorAll("[data-edit-dept]").forEach(function (btn) {
      btn.addEventListener("click", function () { openDeptFormModal(btn.getAttribute("data-edit-dept")); });
    });
    document.querySelectorAll("[data-assign]").forEach(function (btn) {
      btn.addEventListener("click", function () { startAssignManager(btn.getAttribute("data-assign")); });
    });
    document.querySelectorAll("[data-del-dept]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.hasAttribute("disabled")) return;
        openConfirm(btn.getAttribute("data-del-dept"), "department");
      });
    });
  }

  // ============================================================
  // Demo 身份切換（純原型工具，正式產品不會有，見左下角深色藥丸列）
  // ============================================================
  function setDemoRole(role) {
    if (role === state.demoRole) return;
    state.demoRole = role;
    orgState.search = ""; orgState.deptFilter = "all"; orgState.roleFilter = "all"; orgState.statusFilter = "all";

    // 切身份後，目前停留的頁面可能整組消失（如「組織與子帳號」）或只是該子項目被過濾掉
    // （如「管理報表」）——兩種都要把人帶回總覽，不能留在一個側欄已經點不到的頁面上
    const currentGroup = NAV.find(function (n) { return n.id === state.activeTop; });
    const groupHidden = currentGroup && currentGroup.kind === "group" && visibleChildren(currentGroup).length === 0;
    const childHidden = currentGroup && currentGroup.kind === "group" && !groupHidden && state.activeChildId &&
      !visibleChildren(currentGroup).some(function (c) { return c.id === state.activeChildId; });

    if (groupHidden || childHidden) {
      const hiddenLabel = groupHidden ? currentGroup.label : (findChild(currentGroup, state.activeChildId) || {}).label;
      state.activeTop = "overview"; state.activeChildId = null; state.expandedGroup = null; state.activeTabIndex = 0;
      showToast("已切換為「" + ROLES[role].label + "」身份（demo）：看不到「" + hiddenLabel + "」，已返回總覽");
    } else {
      showToast("已切換為「" + ROLES[role].label + "」身份（demo）");
    }
    buildSidebar();
    syncSidebar(true);
    renderContent();
    syncDemoRoleBar();
  }
  function syncDemoRoleBar() {
    document.querySelectorAll("#demoRoleBar [data-demo-role]").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-demo-role") === state.demoRole);
    });
  }
  document.querySelectorAll("#demoRoleBar [data-demo-role]").forEach(function (btn) {
    btn.addEventListener("click", function () { setDemoRole(btn.getAttribute("data-demo-role")); });
  });
  document.getElementById("orgDrawerMask").addEventListener("click", closeDrawer);
  syncDemoRoleBar();

  // ---- topbar popovers ----
  function wirePopover(btnId, popId) {
    const btn = document.getElementById(btnId);
    const pop = document.getElementById(popId);
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      const willOpen = !pop.classList.contains("open");
      document.querySelectorAll(".popover.open").forEach(function (p) { p.classList.remove("open"); });
      if (willOpen) pop.classList.add("open");
    });
  }
  wirePopover("btnAnnounce", "popAnnounce");
  wirePopover("btnFaq", "popFaq");
  wirePopover("btnApi", "popApi");
  wirePopover("btnAvatar", "popAvatar");
  document.addEventListener("click", function () {
    document.querySelectorAll(".popover.open").forEach(function (p) { p.classList.remove("open"); });
  });
  document.getElementById("btnLogout").addEventListener("click", function (e) {
    e.stopPropagation();
    document.getElementById("popAvatar").classList.remove("open");
    showToast("已登出（示意）");
  });

  // ---- toast（全站共用，成功訊息一律用這個 —— icon 用系統既有的 check，不是自訂） ----
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.innerHTML = icon("check") + "<span>" + escAttr(msg) + "</span>";
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3500);
  }

  // ---- 側欄點數卡：儲值捷徑 ----
  document.getElementById("btnTopup").addEventListener("click", function () {
    state.activeTop = "billing";
    state.activeChildId = "topup";
    state.expandedGroup = "billing";
    state.activeTabIndex = 0;
    render();
    showToast("全域元件：點數卡的儲值捷徑，直達 帳務與點數 › 儲值");
  });

  // ---- 側邊欄收合 ----
  // 箭頭方向要跟著狀態換 icon（不用旋轉，否則面板的分隔線會跑到右邊，但側欄一直在左邊）
  const PANEL_ARROW = {
    close: '<path d="m16 15-3-3 3-3"/>',   // Lucide panel-left-close
    open:  '<path d="m14 9 3 3-3 3"/>'     // Lucide panel-left-open
  };
  document.getElementById("sidebarToggle").addEventListener("click", function () {
    const collapsed = document.getElementById("sidebar").classList.toggle("collapsed");
    document.getElementById("shell").classList.toggle("sidebar-collapsed");
    this.classList.toggle("active");
    document.getElementById("sidebarToggleIcon").innerHTML =
      '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>' +
      (collapsed ? PANEL_ARROW.open : PANEL_ARROW.close);
    this.setAttribute("aria-label", collapsed ? "展開側邊欄" : "收合側邊欄");
  });

  buildSidebar();
  syncSidebar(true);   // 首次進站直接定位，不跑展開動畫
  renderContent();
})();
</script>

</body>
</html>
