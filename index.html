      crosshair.setAttribute("x1", p.x); crosshair.setAttribute("x2", p.x);
      crosshair.style.opacity = "1";
      dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y);
      dot.style.opacity = "1";
      tooltip.innerHTML = '<div class="tt-label">' + p.label + '</div>' +
        '<div class="tt-row"><span class="tt-key" style="background:var(--accent)"></span>' + seriesLabel +
        '<span class="tt-value">' + fmtNum(p.value) + " 則</span></div>";
      const rect = svgEl.getBoundingClientRect();
      const scaleX = rect.width / chart.vb.w, scaleY = rect.height / chart.vb.h;
      tooltip.style.left = (p.x * scaleX) + "px";
      tooltip.style.top = (p.y * scaleY) + "px";
      tooltip.style.opacity = "1";
    }
    function hide() { crosshair.style.opacity = "0"; dot.style.opacity = "0"; tooltip.style.opacity = "0"; }

    hit.addEventListener("pointermove", function (evt) { const x = svgX(evt); if (x !== null) showAt(nearestIndex(x)); });
    hit.addEventListener("pointerleave", hide);
  }

  const BAR_VB = { w: 600, h: 220, left: 10, right: 10, top: 14, bottom: 34 };

  function buildBarChart() {
    const cfg = DASH.smsMms;
    const labels = cfg.labels;
    const n = labels.length;
    const vb = BAR_VB;
    const plotW = vb.w - vb.left - vb.right, plotH = vb.h - vb.top - vb.bottom;
    const axisMax = 500, ticks = [0, 250, 500];
    const groupW = plotW / n, barGap = 5;
    const barW = Math.min(30, (groupW - barGap - 14) / 2);
    const baseline = vb.top + plotH;

    let barsHtml = "", xLabelHtml = "";
    const meta = [];
    labels.forEach(function (label, i) {
      const cx = vb.left + groupW * (i + 0.5);
      const smsX = cx - barGap / 2 - barW, mmsX = cx + barGap / 2;
      const smsV = cfg.sms[i], mmsV = cfg.mms[i];
      const smsH = (smsV / axisMax) * plotH, mmsH = (mmsV / axisMax) * plotH;

      barsHtml +=
        '<g class="bar-mark" tabindex="0" data-i="' + i + '" role="img" aria-label="' + label + " SMS " + smsV + " 則、MMS " + mmsV + ' 則">' +
          '<path d="' + roundedTopRectPath(smsX, baseline - smsH, barW, smsH, 4) + '" fill="url(#smsGrad)"/>' +
          '<path d="' + roundedTopRectPath(mmsX, baseline - mmsH, barW, mmsH, 4) + '" fill="url(#mmsGrad)"/>' +
        "</g>";
      xLabelHtml += '<text class="chart-axis-label" x="' + cx + '" y="' + (vb.h - 10) + '" text-anchor="middle">' + label + "</text>";
      meta.push({ x: cx, sms: smsV, mms: mmsV, label: label });
    });

    let gridHtml = "";
    ticks.forEach(function (t) {
      const y = vb.top + plotH - (t / axisMax) * plotH;
      gridHtml += '<line class="chart-grid" x1="' + vb.left + '" x2="' + (vb.w - vb.right) + '" y1="' + y + '" y2="' + y + '"/>';
    });

    // 漸層用 userSpaceOnUse：所有長條共用同一段垂直色階，短棒不會被壓縮成不同深淺
    const gradDefs = '<defs>' +
      '<linearGradient id="smsGrad" gradientUnits="userSpaceOnUse" x1="0" y1="' + vb.top + '" x2="0" y2="' + baseline + '">' +
        '<stop offset="0%" stop-color="#FF6416"/><stop offset="100%" stop-color="#FFA76B"/></linearGradient>' +
      '<linearGradient id="mmsGrad" gradientUnits="userSpaceOnUse" x1="0" y1="' + vb.top + '" x2="0" y2="' + baseline + '">' +
        '<stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#8FB8FA"/></linearGradient>' +
      "</defs>";

    const svg = '<svg viewBox="0 0 ' + vb.w + " " + vb.h + '" aria-hidden="true">' + gradDefs +
      "<g>" + gridHtml + "</g>" + barsHtml + "<g>" + xLabelHtml + "</g>" + "</svg>";

    return { svg: svg, vb: vb, meta: meta };
  }

  function wireBarChartInteractivity(svgEl, bar) {
    const tooltip = svgEl.closest(".chart-wrap").querySelector(".chart-tooltip");
    function showFor(i) {
      const m = bar.meta[i];
      tooltip.innerHTML = '<div class="tt-label">' + m.label + '</div>' +
        '<div class="tt-row"><span class="tt-key" style="background:var(--accent)"></span>SMS<span class="tt-value">' + fmtNum(m.sms) + " 則</span></div>" +
        '<div class="tt-row"><span class="tt-key" style="background:#3B82F6"></span>MMS<span class="tt-value">' + fmtNum(m.mms) + " 則</span></div>";
      const rect = svgEl.getBoundingClientRect();
      const scaleX = rect.width / bar.vb.w, scaleY = rect.height / bar.vb.h;
      tooltip.style.left = (m.x * scaleX) + "px";
      tooltip.style.top = (bar.vb.top * scaleY) + "px";
      tooltip.style.opacity = "1";
    }
    function hide() { tooltip.style.opacity = "0"; }
    svgEl.querySelectorAll(".bar-mark").forEach(function (g) {
      const i = parseInt(g.getAttribute("data-i"), 10);
      g.addEventListener("pointerenter", function () { showFor(i); });
      g.addEventListener("pointerleave", hide);
      g.addEventListener("focus", function () { showFor(i); });
      g.addEventListener("blur", hide);
    });
  }

  function buildStatCard(label, value, prev, prevLabel, iconName) {
    const delta = ((value - prev) / prev) * 100;
    const up = delta >= 0;
    const deltaStr = (up ? "+" : "") + delta.toFixed(1) + "%";
    return '<div class="stat-card span-3">' +
      '<div class="s-icon">' + icon(iconName) + "</div>" +
      "<div>" +
        '<div class="s-label">' + label + "</div>" +
        '<div class="s-row"><div class="s-value" data-target="' + value + '">0</div>' +
        '<span class="s-delta ' + (up ? "up" : "down") + '">' + icon(up ? "up" : "down") + deltaStr + "</span></div>" +
        '<div class="s-compare">較' + prevLabel + "（" + fmtNum(prev) + "）</div>" +
      "</div></div>";
  }

  function renderDashboardHTML() {
    const stats = buildStatCard("今日發送量", DASH.todaySent.value, DASH.todaySent.prev, DASH.todaySent.prevLabel, "send") +

    // 合約摘要卡僅企業管理員可見（2026-08-14 補上這個 gating，
    // 之前程式碼漏了這條，三種身份都看得到，跟合約狀態 demo 切換的設計前提對不上）
    let contractCardHTML = "";

      contractCardHTML = '<div class="contract-card span-6">' +
        '<div class="cc-head-row">' +
          '<div class="cc-head-text"><h3>' + title + '</h3>' +
          '<div class="cc-sub">' + cData.sub + '</div></div>' +
          '<a class="contract-link" href="#">查看完整費率 →</a>' +

    return '<div class="page-head"><h1>總覽</h1></div>' +
      '<div class="dash-grid">' +
        stats +
        contractCardHTML +
        '<div class="chart-card span-6"><div class="cc-head">' +
          '<div><h3>發送趨勢</h3><div class="cc-sub">SMS + MMS 合計發送量</div></div>' +
          '<div class="chart-period-tabs" id="periodTabs">' + periodTabs + "</div></div>" +
          '<div class="chart-wrap" id="areaChartWrap"><div class="chart-tooltip"></div></div></div>' +
        '<div class="chart-card span-6"><div class="cc-head"><div><h3>SMS / MMS 發送量</h3><div class="cc-sub">近 7 天</div></div></div>' +
          '<div class="chart-wrap" id="barChartWrap"><div class="chart-tooltip"></div></div>' +
          '<div class="chart-legend">' +
            '<span class="lg-item"><span class="lg-key" style="background:linear-gradient(180deg,#FF6416,#FFA76B)"></span>SMS</span>' +
            '<span class="lg-item"><span class="lg-key" style="background:linear-gradient(180deg,#3B82F6,#8FB8FA)"></span>MMS</span>' +
          "</div></div>" +
      "</div>";
  }

  function initDashboardCharts() {
    let currentPeriod = "month";
    function renderArea(period, animate) {
      const wrap = document.getElementById("areaChartWrap");
      const chart = buildAreaChart(period);
      wrap.innerHTML = chart.svg + '<div class="chart-tooltip"></div>';
      const svgEl = wrap.querySelector("svg");
      wireAreaChartInteractivity(svgEl, chart, "SMS+MMS");

      if (animate) {
        const shape = svgEl.querySelector(".chart-trend-shape");
        shape.classList.add("chart-anim-in");
      }
    }
    renderArea(currentPeriod, true);   // 只有首次載入要跑進場動畫
    document.getElementById("periodTabs").querySelectorAll("button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const p = btn.getAttribute("data-period");
        if (p === currentPeriod) return;
        currentPeriod = p;
        document.getElementById("periodTabs").querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b === btn); });
        renderArea(currentPeriod);   // 切換 tab 不傳 animate，不重跑
      });
    });

    function renderBar(animate) {
      const barWrap = document.getElementById("barChartWrap");
      const bar = buildBarChart();
      barWrap.innerHTML = bar.svg + '<div class="chart-tooltip"></div>';
      const svgEl = barWrap.querySelector("svg");
      wireBarChartInteractivity(svgEl, bar);
      if (animate) {
        svgEl.querySelectorAll(".bar-mark").forEach(function (g) { g.classList.add("chart-anim-in"); });
      }
    }
    renderBar(true);   // 只有首次載入要跑進場動畫（目前長條圖沒有會重建它的互動，先備著跟趨勢圖同一套規則）
  }

  const state = { activeTop: "overview", activeChildId: null, activeTabIndex: 0, expandedGroup: null, demoRole: "companyAdmin", demoContract: "yes" };

  function findChild(group, childId) {
    return (group.children || []).find(function (c) { return c.id === childId; });
  }

  // demo 身份切換會影響哪些側欄項目看得到：一般使用者看不到 PERM_MATRIX 標記 admin 的項目
  // 2026-08-12：原本只特別處理「組織與子帳號」整個群組，但「管理報表」／「子帳號點數管理」／
  // 「撥點查詢」這三個子項目也是 access:"admin"，卻沒有被過濾——側欄跟帳號抽屜的「此身份可用
  // 功能」預覽兩處對不上。改成統一吃 PERM_MATRIX（用 label 對照），子項目過濾掉之後，
  // 若一個群組底下已經沒有可見子項目就把整個群組藏起來（「組織與子帳號」不用再特別寫一次）。
  function itemAccess(label) {
    for (let i = 0; i < PERM_MATRIX.length; i++) {
      const items = PERM_MATRIX[i].items;
      for (let j = 0; j < items.length; j++) {
        if (items[j].label === label) return items[j].access;
      }
    }
    return "all"; // PERM_MATRIX 沒定義的項目（如設定頁底下的分頁）維持現況全開，不在這次範圍內
  }
  function isChildVisible(child) {
    return canAccess(itemAccess(child.label), state.demoRole);
  }
  function visibleChildren(group) {
    return (group.children || []).filter(isChildVisible);
  }
  function visibleNav() {
    return NAV.filter(function (item) {
      if (item.kind !== "group") return true;
      return visibleChildren(item).length > 0;
    });
  }

  function render() {
    syncSidebar();
    renderContent();
  }

  /* 側欄的 DOM 只建一次（含全部子選單），之後狀態改變一律用 syncSidebar() 改既有節點。
     不能每次都 innerHTML 重建 —— 全新節點沒有前一個值可以補間，高度與旋轉動畫都跑不出來。 */
  function buildSidebar() {
    const scroll = document.getElementById("navScroll");
    let html = "";
    visibleNav().forEach(function (item) {
      if (item.kind === "group") {
        html += '<button class="nav-row" data-group="' + item.id + '" aria-expanded="false">' +
          icon(item.icon) + '<span class="label">' + item.label + '</span>' + icon("chevDown", 'class="ico chev"') +
          '</button>';
        // 子選單一律輸出，收合時靠 .nav-group-wrap 的 height:0 藏起來
        html += '<div class="nav-group-wrap" data-wrap="' + item.id + '">';
        html += '<div class="nav-group-children">';
        visibleChildren(item).forEach(function (child) {
          html += '<button class="nav-child" data-group="' + item.id + '" data-child="' + child.id + '">' +
            '<span class="label">' + child.label + '</span>' +
            (child.phase2 ? '<span class="p2-badge">P2</span>' : '') +
            '</button>';
        });
        html += '</div></div>';
      } else {
        html += '<button class="nav-row' + (item.useLogo ? ' has-logo' : '') + '" data-top="' + item.id + '">' +
          (item.useLogo ? TALKOD_LOGO_SVG : icon(item.icon)) +
          '<span class="label">' + item.label + '</span>' +
          (item.kind === "external" ? icon("external", 'class="ico ext-mark"') : "") +
          '</button>';
        // 獨立產品入口跟下面的平台功能群組用一條線隔開，視覺分兩塊
        if (item.dividerAfter) html += '<div class="nav-divider"></div>';
      }
    });
    scroll.innerHTML = html;

    scroll.querySelectorAll("[data-group]:not([data-child])").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const gid = btn.getAttribute("data-group");
        state.expandedGroup = state.expandedGroup === gid ? null : gid;
        if (state.expandedGroup === gid) {
          state.activeTop = gid;
          const group = NAV.find(function (n) { return n.id === gid; });
          const kids = visibleChildren(group);
          const stillValid = state.activeChildId && kids.some(function (c) { return c.id === state.activeChildId; });
          if (!stillValid) {
            state.activeChildId = kids[0].id;
            state.activeTabIndex = 0;
          }
        }
        render();
      });
    });
    scroll.querySelectorAll("[data-child]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        state.activeTop = btn.getAttribute("data-group");
        state.activeChildId = btn.getAttribute("data-child");
        state.activeTabIndex = 0;
        render();
      });
    });
    scroll.querySelectorAll("[data-top]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.activeTop = btn.getAttribute("data-top");
        state.activeChildId = null;
        state.expandedGroup = null;
        state.activeTabIndex = 0;
        render();
        if (state.activeTop === "talkod") showToast("外部連結：實際點擊會另開 TalkOD 分頁");
      });
    });
  }

  /* 只改既有節點的狀態與高度，不動 DOM 結構。
     第一次呼叫（initial=true）直接跳到最終高度、不跑動畫，
     否則一進站就會看到選單自己展開一次，很像畫面壞掉。 */
  function syncSidebar(initial) {
    const scroll = document.getElementById("navScroll");

    scroll.querySelectorAll("[data-group]:not([data-child])").forEach(function (btn) {
      const gid = btn.getAttribute("data-group");
      const expanded = state.expandedGroup === gid;
      btn.setAttribute("aria-expanded", String(expanded));
      // 展開時群組本身不標 active（active 交給展開的子項），跟原本的邏輯一致
      btn.classList.toggle("active", state.activeTop === gid && !expanded);

      const wrap = scroll.querySelector('[data-wrap="' + gid + '"]');
      if (!wrap) return;

      if (initial) {
        // 不要動畫：先關掉 transition，設完高度再還原
        const prev = wrap.style.transition;
        wrap.style.transition = "none";
        wrap.style.height = expanded ? "auto" : "0px";
        void wrap.offsetHeight;          // 強制 reflow，讓上面這行立刻生效
        wrap.style.transition = prev;
      } else if (expanded) {
        // auto 沒辦法做 transition，要先量出實際高度
        wrap.style.height = wrap.scrollHeight + "px";
      } else {
        // 若目前是 auto（展開狀態），得先固定成具體數值才收得動
        if (wrap.style.height === "auto") {
          wrap.style.height = wrap.scrollHeight + "px";
          void wrap.offsetHeight;
        }
        wrap.style.height = "0px";
      }
    });

    scroll.querySelectorAll("[data-child]").forEach(function (btn) {
      const isActive = state.activeTop === btn.getAttribute("data-group") &&
                       state.activeChildId === btn.getAttribute("data-child");
      btn.classList.toggle("active", isActive);
    });

    scroll.querySelectorAll("[data-top]").forEach(function (btn) {
      btn.classList.toggle("active", state.activeTop === btn.getAttribute("data-top"));
    });
  }

  /* 展開動畫結束後把高度改回 auto，這樣子選單內容之後若有變動
     （例如加了新項目）不會被卡在當初量到的固定高度 */
  document.getElementById("navScroll").addEventListener("transitionend", function (e) {
    const wrap = e.target;
    if (e.propertyName !== "height" || !wrap.classList.contains("nav-group-wrap")) return;
    const gid = wrap.getAttribute("data-wrap");
    if (state.expandedGroup === gid) wrap.style.height = "auto";
  });

  function renderContent() {
    const content = document.getElementById("content");
    const topItem = NAV.find(function (n) { return n.id === state.activeTop; });

    const protoNote = '';

    if (topItem.kind === "dashboard") {
      content.innerHTML = protoNote + renderDashboardHTML();
      initDashboardCharts();
      initStatCountUp();
      return;
    }

    if (topItem.kind === "external") {
      content.innerHTML = protoNote +
        '<div class="ext-card">' + icon("external", 'style="width:22px;height:22px"') +
        '<div><h2>互動回覆簡訊（TalkOD）</h2><p>' + topItem.detail + ' 建議在側邊欄用外部連結圖示標示，讓使用者知道這不是站內頁面。</p></div></div>';
      return;
    }

    // group -> child
    const child = findChild(topItem, state.activeChildId) || topItem.children[0];

    // 組織與子帳號整個群組走專用渲染器（樹狀/篩選/表格/抽屜），不吃下面通用的 tabs/placeholder 邏輯
    if (topItem.id === "org") {
      content.innerHTML = protoNote + renderOrgHTML(child.id);
      wireOrgPage(child.id);
      return;
    }

    let html = protoNote + '<div class="page-head"><h1>' + child.label +
      (child.phase2 ? '<span class="p2-badge" style="margin-left:8px;vertical-align:middle;">Phase 2</span>' : '') + '</h1></div>';

    if (child.tabs && child.tabs.length > 0) {
      let tabsHtml = '<div class="tabbar">';
      child.tabs.forEach(function (t, i) {
        const label = typeof t === "string" ? t : t.label;
        const tabIsPhase2 = typeof t === "object" && t.phase2;
        tabsHtml += '<button class="tab' + (i === state.activeTabIndex ? " active" : "") + '" data-tab="' + i + '">' + label +
          (tabIsPhase2 ? '<span class="p2-badge" style="margin-left:5px;">P2</span>' : '') + '</button>';
      });
      tabsHtml += '</div>';
      html += tabsHtml;
      if (child.detail) html += '<div class="detail-note">' + child.detail + '</div>';
      if (child.flag) html += '<div class="flag-note">' + icon("flag") + '<div>' + child.flag + '</div></div>';
      const activeTab = child.tabs[state.activeTabIndex];
      const activeTabLabel = typeof activeTab === "string" ? activeTab : activeTab.label;
      html += '<div class="placeholder-card"><div class="big">〔內容區〕' + activeTabLabel + '</div>此 Tab 對應原架構圖中的第三層節點，實際頁面內容之後再設計</div>';
    } else {
      if (child.detail) html += '<div class="detail-note">' + child.detail + '</div>';
      if (child.flag) html += '<div class="flag-note">' + icon("flag") + '<div>' + child.flag + '</div></div>';
      html += '<div class="placeholder-card"><div class="big">〔內容區〕' + child.label + '</div>此項目沒有下一層 Tab，直接是單一頁面</div>';
    }

    content.innerHTML = html;
    content.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.activeTabIndex = parseInt(btn.getAttribute("data-tab"), 10);
        renderContent();
      });
    });
  }

  /* ============================================================
     組織與子帳號模組（2026-08-11 新增，UX 重設版 v3）
     ------------------------------------------------------------
     不沿用舊後台「勾選列+上方按鈕」慣例，改成：即時篩選、每列自帶操作、
     右側抽屜（Drawer）建立/編輯、demo 身份切換連動可見範圍。
     Drawer／Toggle／組織樹／⋯拿掉改文字連結——這些是系統目前沒有的元件，
     照既有 token 語言（surface/radius-xl/shadow-card 等）自己設計，
     之後要不要收進 Figma 由 Alvie 決定。
     ============================================================ */

  function escAttr(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  /* ============================================================
     全站共用 tooltip 引擎（2026-08-12，第二輪加延遲）：任何元素只要帶 data-tip="..."
     hover 就會跳出提示——表格截斷欄位（姓名/帳號/部門/E-mail）、頂部圖示按鈕
     （公告/常見問題/API文件）都吃同一套，不是分開兩套邏輯。單一 fixed 節點掛在 body
     底下（跟 dropdown 的 portal 同一種做法，不會被卡片的 overflow:hidden 裁切），
     監聽直接掛在 document 上（涵蓋 #content 之外的頂部列，子節點重繪也不用重新綁）。
     2026-08-12：Alvie 反映「API 文件下載」那類圖示原本用瀏覽器原生 title屬性，
     跳出延遲是瀏覽器內建、沒辦法調——這是這輪把它們也改吃這套引擎的原因，
     原生 title 完全沒有可控的顯示延遲。300–400ms 抓中間值 350ms：太短滑過去就閃現，
     太長會覺得卡頓；移開時不等待、立刻觸發淡出（CSS transition 本身 120ms，已經夠快）
     ============================================================ */
  const CELL_TIP_DELAY = 350;
  let cellTipEl = null;
  let cellTipShowTimer = null;
  function ensureCellTip() {
    if (!cellTipEl) {
      cellTipEl = document.createElement("div");
      cellTipEl.className = "cell-tip";
      document.body.appendChild(cellTipEl);
    }
    return cellTipEl;
  }
  function positionCellTip(target) {
    const tip = ensureCellTip();
    const r = target.getBoundingClientRect();
    const tr = tip.getBoundingClientRect();
    let top = r.top - tr.height - 8;
    if (top < 8) top = r.bottom + 8; // 上方空間不夠就往下開
    let left = r.left + r.width / 2 - tr.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
    tip.style.top = top + "px";
    tip.style.left = left + "px";
  }
  function showCellTip(target) {
    const text = target.getAttribute("data-tip");
    if (!text) return;
    const tip = ensureCellTip();
    tip.textContent = text;
    tip.classList.add("open");
    positionCellTip(target);
  }
  function hideCellTip() {
    clearTimeout(cellTipShowTimer);
    if (cellTipEl) cellTipEl.classList.remove("open");
  }
  document.addEventListener("mouseover", function (e) {
    const t = e.target.closest("[data-tip]");
    if (!t) return;
    clearTimeout(cellTipShowTimer);
    cellTipShowTimer = setTimeout(function () { showCellTip(t); }, CELL_TIP_DELAY);
  });
  document.addEventListener("mouseout", function (e) {
    const t = e.target.closest("[data-tip]");
    if (t && !t.contains(e.relatedTarget)) hideCellTip();
  });
  window.addEventListener("scroll", function () { hideCellTip(); }, true);

  /* ============================================================
     自訂 Dropdown 引擎（2026-08-11 第三輪，取代原生 <select>）
     ------------------------------------------------------------
     一個共用註冊表 ddRegistry（id → {options, value, onChange, disabled}）＋
     一個掛在 document.body 的 portal，面板一律 fixed 定位、開啟時當場量觸發按鈕的
     getBoundingClientRect() 算座標，捲動／resize 時即時重算（不是關掉，是真的跟著移動）。
     面板獨立掛在 body 下，不受 .drawer-body 的 overflow:hidden 或 .drawer 的
     transform 影響——這是先前「面板位置跑掉」的根本原因（每個下拉各自 relative 定位，
     一旦外層有 overflow/transform 就被裁切或位移），改成 portal 之後全站下拉共用同一套邏輯，
     不用每個下拉各補位移。
     ============================================================ */
  const ddRegistry = {};
  let ddActive = null; // { id, triggerEl, panelEl }

  function ddPortal() {
    let el = document.getElementById("ddPortal");
    if (!el) { el = document.createElement("div"); el.id = "ddPortal"; document.body.appendChild(el); }
    return el;
  }
  // 產生觸發按鈕的 HTML，並把這個下拉的選項/當前值/onChange 登記進 ddRegistry
  function renderDropdown(id, options, value, opts) {
    opts = opts || {};
    ddRegistry[id] = { options: options, value: value, disabled: !!opts.disabled, onChange: opts.onChange || null };
    const selected = options.find(function (o) { return o.value === value; });
    const label = selected ? selected.label : (opts.placeholder || "");
    return '<div class="dd' + (opts.className ? " " + opts.className : "") + '">' +
      '<button type="button" class="dd-trigger" id="dd-' + id + '" data-dd="' + id + '"' + (opts.disabled ? " disabled" : "") + ' aria-haspopup="listbox" aria-expanded="false">' +
      '<span class="dd-label">' + escAttr(label) + '</span>' + icon("chevDown", 'class="ico dd-chev"') +
      '</button></div>';
  }
  // 每次把 renderDropdown() 的 HTML 塞進 DOM 之後，呼叫這個把 click 事件接上（HTML 是新的節點，要重新綁）
  function ddBind(id) {
    const trigger = document.getElementById("dd-" + id);
    if (!trigger) return;
    trigger.addEventListener("click", function (e) {
      e.stopPropagation();
      if (ddActive && ddActive.id === id) { ddClose(); return; }
      ddOpen(trigger);
    });
  }
  function ddPanelHtml(id) {
    const state = ddRegistry[id];
    return '<div class="dd-panel" id="ddpanel-' + id + '" role="listbox">' + state.options.map(function (o) {
      const isSelected = o.value === state.value;
      // 勾位一律輸出（見 .dd-tick 的 CSS 註解）：沒選中就是一塊等寬空白，
      // 這樣有勾／沒勾的列文字都從同一條線開始
      return '<button type="button" class="dd-item" data-value="' + escAttr(o.value) + '">' +
        '<span class="dd-tick">' + (isSelected ? icon("check", 'class="ico dd-check"') : "") + '</span>' +
        '<span>' + escAttr(o.label) + '</span></button>';
    }).join("") + '</div>';
  }
  function ddOpen(triggerEl) {
    const id = triggerEl.getAttribute("data-dd");
    const state = ddRegistry[id];
    if (!state || state.disabled) return;
    ddClose();
    ddPortal().innerHTML = ddPanelHtml(id);
    const panel = document.getElementById("ddpanel-" + id);
    triggerEl.setAttribute("aria-expanded", "true");
    triggerEl.classList.add("is-open");
    ddActive = { id: id, triggerEl: triggerEl, panelEl: panel };
    positionDdPanel(triggerEl, panel);
    requestAnimationFrame(function () { panel.classList.add("open"); });
    panel.querySelectorAll(".dd-item").forEach(function (item) {
      item.addEventListener("click", function () {
        ddSetValue(id, item.getAttribute("data-value"));
        ddClose();
      });
    });
  }
  function ddClose() {
    if (!ddActive) return;
    ddActive.triggerEl.setAttribute("aria-expanded", "false");
    ddActive.triggerEl.classList.remove("is-open");
    if (ddActive.panelEl.parentNode) ddActive.panelEl.parentNode.removeChild(ddActive.panelEl);
    ddActive = null;
  }
  function positionDdPanel(trigger, panel) {
    const rect = trigger.getBoundingClientRect();
    panel.style.width = rect.width + "px";
    panel.style.left = rect.left + "px";
    const panelHeight = panel.offsetHeight;
    const spaceBelow = window.innerHeight - rect.bottom;
    const openUp = spaceBelow < panelHeight + 8 && rect.top > panelHeight + 8;
    panel.style.top = (openUp ? (rect.top - panelHeight - 4) : (rect.bottom + 4)) + "px";
  }
  function ddValue(id) { return ddRegistry[id] ? ddRegistry[id].value : undefined; }
  function ddSetValue(id, value, opts) {
    opts = opts || {};
    const state = ddRegistry[id];
    if (!state) return;
    state.value = value;
    const trigger = document.getElementById("dd-" + id);
    if (trigger) {
      const selected = state.options.find(function (o) { return o.value === value; });
      trigger.querySelector(".dd-label").textContent = selected ? selected.label : "";
    }
    if (!opts.silent && state.onChange) state.onChange(value);
  }
  // 觸發按鈕本身沒重繪、只是選項清單變了（例如身份切換後部門選項變少）時用這個，不會誤觸發 onChange
  function ddSetOptions(id, options, value) {
    const state = ddRegistry[id];
    if (!state) return;
    state.options = options;
    ddSetValue(id, value !== undefined ? value : state.value, { silent: true });
  }
  document.addEventListener("click", function (e) {
    if (!ddActive) return;
    if (ddActive.panelEl.contains(e.target) || ddActive.triggerEl.contains(e.target)) return;
    ddClose();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && ddActive) ddClose(); });
  window.addEventListener("scroll", function () { if (ddActive) positionDdPanel(ddActive.triggerEl, ddActive.panelEl); }, true);
  window.addEventListener("resize", function () { if (ddActive) positionDdPanel(ddActive.triggerEl, ddActive.panelEl); });

  /* ============================================================
     分頁（共用）— 2026-08-17 從操作紀錄頁抽出來
     ------------------------------------------------------------
     原本這一套（每頁筆數下拉＋共 N 筆＋首/上/頁碼/下/末）是寫死在操作紀錄頁的，
     函式名帶 audit 前綴、直接讀 auditState。子帳號管理也要用同一套，所以抽成
     吃「分頁狀態物件」的通用函式，兩頁共用一份，避免日後改一邊漏另一邊。
     CSS 本來就已經是通用的（.pager-bar / .pager-item …，見上方 CSS 註解，
     規格讀自 Figma「E8D · Pagination」node 248:117），這次不用動。

     分頁狀態物件＝任何帶 { page, pageSize } 的物件（auditState / orgState 都是）。
     ⚠️ 每頁筆數的選項與預設值兩頁一致：都用 PAGE_SIZES、預設 25。
     ⚠️ 前端 slice 只是原型示意：正式版換成後端查詢，page/pageSize 當查詢參數送出。
     ============================================================ */
  /* ⚠️ PAGE_SIZES／PAGE_SIZE_DEFAULT 兩個常數**刻意定義在 orgState 上方**（搜尋
     「分頁：每頁筆數選項」），不放在這裡——orgState 的預設值要用到它們，而 const 沒有
     hoisting（function 才有），定義在這裡會讓 orgState 初始化時撞上 TDZ、整支 script 掛掉。 */
  function pagerTotalPages(total, pageSize) {
    return Math.max(1, Math.ceil(total / pageSize));
  }
  /* 取當前頁的那一段。
     篩選讓總頁數變少時，可能停在一個已經不存在的頁碼上（例如在第 4 頁按下只剩 1 頁的
     篩選），所以每次取資料前先把 page 夾回合法範圍。 */
  function pagedSlice(list, st) {
    const totalPages = pagerTotalPages(list.length, st.pageSize);
    if (st.page > totalPages) st.page = totalPages;
    if (st.page < 1) st.page = 1;
    const start = (st.page - 1) * st.pageSize;
    return list.slice(start, start + st.pageSize);
  }
  /* 頁碼清單：總頁數 ≤7 時全部列出；超過就固定顯示首頁、末頁與當前頁 ±1，
     中間用 "…" 補（不可點的靜態指示）。跟 Figma 範例的 `1 … 12 13 14 … 26` 同一個規則。 */
  function pagerPageList(cur, total) {
    if (total <= 7) {
      const all = [];
      for (let i = 1; i <= total; i++) all.push(i);
      return all;
    }
    const out = [1];
    if (cur > 3) out.push("gap");
    for (let i = Math.max(2, cur - 1); i <= Math.min(total - 1, cur + 1); i++) out.push(i);
    if (cur < total - 2) out.push("gap");
    out.push(total);
    return out;
  }
  /* 分頁列 HTML。cfg = { ddId, st, total, refresh }
       ddId    每頁筆數下拉的 id（兩頁不能同名，各自傳）
       st      分頁狀態物件（會被就地改寫 page / pageSize）
       total   篩選後的總筆數（不是全部資料，要跟畫面上的「共 N 筆」一致）
       refresh 改了 page/pageSize 之後要呼叫的重畫函式
     筆數集中在這一排（2026-08-14 Alvie 定）：左邊「每頁顯示 [N] 筆」＋「共 N 筆」，
     右邊分頁器。刻意不放「第 X–Y 筆」範圍字樣——跟「共 N 筆」並存時，一個是範圍
     一個是總數，很容易被讀成互相矛盾。 */
  function renderPagerBar(cfg) {
    const total = cfg.total;
    const st = cfg.st;
    const totalPages = pagerTotalPages(total, st.pageSize);
    const cur = Math.min(st.page, totalPages);
    const item = function (label, page, opts) {
      opts = opts || {};
      const cls = "pager-item" + (opts.active ? " active" : "");
      const dis = opts.disabled ? " disabled" : "";
      return '<button class="' + cls + '"' + dis + ' data-page="' + page + '"' +
        (opts.title ? ' aria-label="' + opts.title + '"' : "") + '>' + label + '</button>';
    };
    let pager = "";
    pager += item(icon("chevsLeft"), 1, { disabled: cur === 1, title: "第一頁" });
    pager += item(icon("chevLeft"), cur - 1, { disabled: cur === 1, title: "上一頁" });
    pagerPageList(cur, totalPages).forEach(function (p) {
      pager += p === "gap" ? '<span class="pager-gap">···</span>' : item(p, p, { active: p === cur });
    });
    pager += item(icon("chevRight"), cur + 1, { disabled: cur === totalPages, title: "下一頁" });
    pager += item(icon("chevsRight"), totalPages, { disabled: cur === totalPages, title: "最後一頁" });

    return '<div class="pager-bar">' +
      '<div class="pager-left">' +
      '<div class="page-size">每頁顯示' +
      renderDropdown(cfg.ddId, PAGE_SIZES, String(st.pageSize), {
        onChange: function (v) { st.pageSize = parseInt(v, 10); st.page = 1; cfg.refresh(); }
      }) + '筆</div>' +
      '<span class="pager-info">共 ' + total + ' 筆</span>' +
      '</div>' +
      '<div class="pager">' + pager + '</div>' +
      '</div>';
  }
  /* 列表區每次重畫都是新節點，分頁列的事件要重綁（含每頁筆數下拉）。
     scopeSel 限定範圍，避免同一頁若有兩組分頁列時互相搶事件。 */
  function bindPagerBar(scopeSel, cfg) {
    document.querySelectorAll(scopeSel + " .pager-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.hasAttribute("disabled") || btn.classList.contains("active")) return;
        cfg.st.page = parseInt(btn.getAttribute("data-page"), 10);
        cfg.refresh();
      });
    });
    ddBind(cfg.ddId);
  }

  /* ============================================================
     DateRangePicker（共用元件，2026-08-17）
     ------------------------------------------------------------
     日期區間選擇。這階段內部用原生 <input type="date"> 兩欄，**刻意不手刻月曆面板**，
     但介面設計成跟實作無關，未來要升級成精緻面板（或改接日期函式庫）時，
     只需替換 renderDateRange() 的 HTML 與 drBind() 的事件綁定，
     **所有呼叫方與 drValue/drSetValue 的格式都不用動**。

     API（完全比照本檔既有的 Dropdown 元件模式，不自創第二種風格）：
       renderDateRange(id, value, opts)  → HTML 字串
       drBind(id)                        → HTML 進 DOM 後綁事件
       drValue(id)                       → { start, end }
       drSetValue(id, value, { silent }) → 程式化設值

     ⚠️ 對外一律用 ISO 日期字串 "YYYY-MM-DD"，不傳 Date 物件、不傳 event、不傳 DOM 節點。
        這是能無痛抽換內部實作的關鍵——呼叫方只認得字串格式。
        （ISO 字串的字典序等於時序，所以可以直接用 < > 比較，不必轉 Date）

     元件內部負責、呼叫方完全不用管的四件事：
       ① 起訖顛倒自動對調（對外永遠 start <= end）
       ② 超出 min/max 自動夾回
       ③ 只選一邊時不觸發 onChange（避免呼叫方拿殘缺區間去查詢）
       ④ 不暴露 DOM——要讀值一律走 drValue(id)，不要自己 querySelector 內部的 input
     ============================================================ */
  const drRegistry = {};

  // Date → "YYYY-MM-DD"。對外也用得到（呼叫方要算 max、或把紀錄的時間轉成同格式比對）
  function drISO(date) {
    const p = function (n) { return n < 10 ? "0" + n : "" + n; };
    return date.getFullYear() + "-" + p(date.getMonth() + 1) + "-" + p(date.getDate());
  }

  // 正規化：夾制邊界 → 顛倒對調。內部用，不對外
  function drNormalize(st, raw) {
    const clamp = function (d) {
      if (!d) return null;
      if (st.min && d < st.min) return st.min;
      if (st.max && d > st.max) return st.max;
      return d;
    };
    let s = clamp(raw.start || null);
    let e = clamp(raw.end || null);
    if (s && e && s > e) { const t = s; s = e; e = t; }
    return { start: s, end: e };
  }

  function renderDateRange(id, value, opts) {
    opts = opts || {};
    value = value || {};
    drRegistry[id] = {
      value: { start: value.start || null, end: value.end || null },
      min: opts.min || null,
      max: opts.max || null,
      disabled: !!opts.disabled,
      onChange: opts.onChange || null
    };
    const st = drRegistry[id];
    const bound = function (k, v) { return v ? " " + k + '="' + escAttr(v) + '"' : ""; };
    const dis = st.disabled ? " disabled" : "";
    const field = function (which, val, label) {
      return '<input type="date" id="dr-' + id + "-" + which + '" value="' + escAttr(val || "") + '"' +
        bound("min", st.min) + bound("max", st.max) + dis +
        ' aria-label="' + escAttr(label) + '">';
    };
    return '<div class="date-range" data-dr="' + id + '">' +
      field("start", st.value.start, opts.startLabel || "開始日期") +
      '<span class="dr-sep">～</span>' +
      field("end", st.value.end, opts.endLabel || "結束日期") +
      '</div>';
  }

  function drBind(id) {
    const st = drRegistry[id];
    if (!st) return;
    const sEl = document.getElementById("dr-" + id + "-start");
    const eEl = document.getElementById("dr-" + id + "-end");
    if (!sEl || !eEl) return;
    const handler = function () {
      const norm = drNormalize(st, { start: sEl.value, end: eEl.value });
      st.value = norm;
      // 正規化的結果要回寫欄位，否則畫面顯示的跟實際生效的條件會不一致
      if (sEl.value !== (norm.start || "")) sEl.value = norm.start || "";
      if (eEl.value !== (norm.end || "")) eEl.value = norm.end || "";
      // 半完成狀態不回報（見上方說明③）
      if (st.onChange && norm.start && norm.end) st.onChange({ start: norm.start, end: norm.end });
    };
    sEl.addEventListener("change", handler);
    eEl.addEventListener("change", handler);
  }

  function drValue(id) {
    const st = drRegistry[id];
    return st ? { start: st.value.start, end: st.value.end } : null;
  }

  function drSetValue(id, value, opts) {
    opts = opts || {};
    const st = drRegistry[id];
    if (!st) return;
    const norm = drNormalize(st, value || {});
    st.value = norm;
    const sEl = document.getElementById("dr-" + id + "-start");
    const eEl = document.getElementById("dr-" + id + "-end");
    if (sEl) sEl.value = norm.start || "";
    if (eEl) eEl.value = norm.end || "";
    if (!opts.silent && st.onChange && norm.start && norm.end) st.onChange({ start: norm.start, end: norm.end });
  }

  function dialFor(iso) {
    const c = COUNTRY_CODES.find(function (c) { return c.iso === iso; });
    return c ? c.dial : "";
  }
  function dialDisplay(iso) {
    return "+" + dialFor(iso);
  }
  /* 手機號碼比對鍵（2026-08-19：一個手機號碼只能綁一個帳號）。
     產品規則要比的是「同一支門號」，不是「同一個字串」，所以先正規化再比：
     ① 去掉所有非數字（空白、連字號、括號這類使用者手打進來的分隔符號）
     ② 台灣的前導 0 是國內撥號用的 trunk prefix，+886 912345678 與 0912345678
        是同一支，去掉 0 才比得出來（只針對 886 處理，跟 phoneFormatOk／
        寫入前正規化的既有規則一致，不擅自推廣到其他國家的 trunk prefix）
     ③ 用「國碼(dial)」而非 iso 當前綴——US 與 CA 共用 +1，同一支號碼在兩個
        iso 底下本來就是同一支，用 iso 會漏抓 */
  function phoneKeyFromDial(dial, phone) {
    let digits = String(phone == null ? "" : phone).replace(/\D/g, "");
    if (String(dial) === "886") digits = digits.replace(/^0+/, "");
    return dial + "-" + digits;
  }
  function phoneKey(iso, phone) {
    return phoneKeyFromDial(dialFor(iso), phone);
  }
  /* 手機格式規則（2026-08-19 從匯入的 importPhoneOk 原封不動抽上來，規則一個字沒改）。
     原本只有匯入在用、名字帶 import 前綴，抽屜表單改成也要驗格式之後兩邊必須同一套，
     所以搬到這裡跟 phoneKey／normalizePhoneInput 放一起，物理上只留一份。
     台灣門號：Excel 常把開頭的 0 吃掉（0912345678 存成 912345678），兩種都要收。
     其他國家原型階段先寬鬆檢查純數字 6～15 碼，正式版再按各國規則細分。 */
  function phoneFormatOk(dial, phone) {
    if (String(dial) === "886") return /^0?9\d{8}$/.test(phone);
    return /^\d{6,15}$/.test(phone);
  }
  // 存檔前把使用者手打的寫法收斂成正規形式（例：0912345678 → 912345678），
  // 否則資料本身會混著兩種寫法，日後的比對照樣會漏
  function normalizePhoneInput(iso, phone) {
    let digits = String(phone).replace(/\D/g, "");
    if (dialFor(iso) === "886") digits = digits.replace(/^0+/, "");
    return digits;
  }
  function field(key, label, required, inputHtml) {
    return '<div class="field-group" data-field="' + key + '"><label>' + label +
      (required ? '<span class="req">*</span>' : '') + '</label>' + inputHtml +
      '<div class="err-msg" id="err-' + key + '" style="display:none"></div></div>';
  }
  function toggleHtml(id, checked) {
    return '<label class="toggle"><input type="checkbox" id="' + id + '"' + (checked ? " checked" : "") +
      '><span class="track"></span><span class="thumb"></span></label>';
  }
  // attrs 直接塞進 <input>（class/id/data-*），沿用 Figma Checkbox 元件規格，取代原生 checkbox 外觀
  function checkboxHtml(attrs, checked) {
    return '<label class="chk"><input type="checkbox"' + attrs + (checked ? " checked" : "") + '><span class="chk-box">' +
      icon("check", 'class="ico ico-check"') + icon("minus", 'class="ico ico-minus"') + '</span></label>';
  }
  function setFieldError(key, msg) {
    const scope = document.querySelector('[data-field="' + key + '"]');
    if (scope) {
      // 2026-08-12：優先找 #f+Key 這個精確 id（大多數欄位的輸入框都照這個命名）。
      // 「手機」這個 field-group 裡同時有國碼下拉（.dd-trigger）跟門號 input 兩個可互動元素，
      // 沒有這條的話 querySelector("input, select, .dd-trigger") 會選到排在前面的國碼下拉，
      // 手機號碼沒填的錯誤會誤標在國碼欄位上。找不到精確 id 的欄位（部門/角色這類純下拉、
      // 或部門表單的 deptName/deptCode）維持原本的通用 fallback，不受影響
      const exactId = "f" + key.charAt(0).toUpperCase() + key.slice(1);
      const input = scope.querySelector("#" + exactId) || scope.querySelector("input, select, .dd-trigger");
      if (input) input.classList.add("is-error");
    }
    const err = document.getElementById("err-" + key);
    if (err) { err.textContent = msg; err.style.display = "flex"; }
  }
  // 跟 setFieldError 相同的定位邏輯，反過來清單一欄位——即時輸入驗證（如帳號格式）
  // 用這個而不是 clearFieldErrors()，才不會把使用者還沒修正的其他欄位錯誤一起清掉
  function clearFieldError(key) {
    const scope = document.querySelector('[data-field="' + key + '"]');
    if (scope) {
      const exactId = "f" + key.charAt(0).toUpperCase() + key.slice(1);
      const input = scope.querySelector("#" + exactId) || scope.querySelector("input, select, .dd-trigger");
      if (input) input.classList.remove("is-error");
    }
    const err = document.getElementById("err-" + key);
    if (err) { err.style.display = "none"; err.textContent = ""; }
  }
  function clearFieldErrors() {
    document.querySelectorAll(".field-group input.is-error, .field-group select.is-error, .field-group .dd-trigger.is-error").forEach(function (el) { el.classList.remove("is-error"); });
    document.querySelectorAll(".err-msg").forEach(function (el) { el.style.display = "none"; el.textContent = ""; });
  }

  // ---- 可見範圍（依 demo 身份） ----
  function scopeDeptIds() {
    if (state.demoRole === "companyAdmin") return DEPARTMENTS.map(function (d) { return d.id; });
    if (state.demoRole === "deptManager") return [DEMO_DEPT_FOR_MANAGER];
    return [];
  }
  function scopedAccounts() {
    const deptIds = scopeDeptIds();
    return ACCOUNTS.filter(function (a) {
      if (a.deptId === null) return state.demoRole === "companyAdmin"; // 母帳號只有企業管理員自己看得到
      return deptIds.indexOf(a.deptId) !== -1;
    });
  }
  function filteredAccounts() {
    let list = scopedAccounts();
    if (orgState.deptFilter !== "all") list = list.filter(function (a) { return a.deptId === orgState.deptFilter; });
    if (orgState.roleFilter !== "all") list = list.filter(function (a) { return a.role === orgState.roleFilter; });
    if (orgState.statusFilter !== "all") list = list.filter(function (a) { return a.status === orgState.statusFilter; });
    const q = orgState.search.trim().toLowerCase();
    if (q) {
      list = list.filter(function (a) {
        return a.name.toLowerCase().indexOf(q) !== -1 || a.account.toLowerCase().indexOf(q) !== -1 || a.email.toLowerCase().indexOf(q) !== -1;
      });
    }
    return list;
  }
  // 依當前登入者身份，決定新增/編輯帳號時可以選哪些角色（見規格「可見範圍」表）
  function allowedRoleOptions() {
    if (state.demoRole === "companyAdmin") return ["deptManager", "user"];
    if (state.demoRole === "deptManager") return ["user", "deptManager"];
    return [];
  }

  // ---- 頂層分流 ----
  function renderOrgHTML(childId) {
    if (childId === "org-departments") return renderDepartmentsPage();
    if (childId === "org-audit") return renderAuditPage();
    return renderAccountsPage();

  function wireOrgPage(childId) {

  // ============================================================
  // 一、帳號（主頁）
  // ============================================================
  // 部門篩選 chip 列（取代原本的左側組織樹，見 .dept-chips 的 CSS 註解）。
  // data-tree 這個 attribute 名稱沿用原本的樹，syncOrgTreeActive()／事件綁定都不用改。
  // 公司名稱那行（原本樹的標題）拿掉——組織目前只有一層（公司底下直接掛部門、沒有子部門），
  // 那行沒有表達到層級關係，純裝飾，拿掉還能省一截寬度
  function renderDeptChips() {
    /* 2026-08-19 修正：原本是 ACCOUNTS.filter(a => a.deptId !== null).length，
       把母帳號排除在外——但表格是照 scopedAccounts() 列的，企業管理員看得到母帳號，
       於是 chip 說「全部帳號 16」、表格說「共 17 筆」，兩個數字對不上。
       「全部帳號」這顆 chip 的語意是「不套用部門篩選、看全部」，母帳號本來就在
       「全部」裡面，所以直接跟表格取同一個來源，兩邊不可能再各算各的。
       下面各部門的 chip 維持 deptId 比對不變（母帳號沒有部門，本來就不屬於任何一顆）。 */
    const allCount = scopedAccounts().length;
    let html = '<div class="dept-chips">';
    html += '<button class="dept-chip' + (orgState.deptFilter === "all" ? " active" : "") + '" data-tree="all">全部帳號<span class="cnt">' + allCount + '</span></button>';
    DEPARTMENTS.forEach(function (d) {
      const cnt = ACCOUNTS.filter(function (a) { return a.deptId === d.id; }).length;
      html += '<button class="dept-chip' + (orgState.deptFilter === d.id ? " active" : "") + '" data-tree="' + d.id + '">' + escAttr(d.name) + '<span class="cnt">' + cnt + '</span></button>';
    });
    html += '</div>';
    return html;

  function renderFilterBar() {
    let html = '<div class="filter-bar">';
    html += '<div class="filter-search">' + icon("search") + '<input type="text" id="acctSearch" placeholder="搜尋姓名／帳號／E-mail" value="' + escAttr(orgState.search) + '"></div>';
    // 2026-08-13：原本這裡有「所有部門」下拉，跟部門 chip 列功能完全重疊（一樣是單選切換部門），
    // 且沒有帳號數。改用 chip 列後這個下拉整個移除，篩選列也順勢少一格
    // 任何篩選條件改變都要回到第 1 頁——停在舊頁碼上會看到「篩選好像沒反應」（其實是那頁已經沒資料）
    const roleOptions = [{ value: "all", label: "所有角色" }, { value: "deptManager", label: "部門管理員" }, { value: "user", label: "一般使用者" }];
    html += renderDropdown("acctRoleFilter", roleOptions, orgState.roleFilter, {

    html += renderDropdown("acctStatusFilter", statusOptions, orgState.statusFilter, {

    html += '<div class="filter-bar-spacer"></div>';
    if (!orgState.bulkMode) html += '<button class="btn btn-secondary" id="btnBulkToggle">批次操作</button>';

    // icon 用 download（托盤＋箭頭向下）不是 upload（箭頭向上）——對使用者來說「匯入」是
    // 把資料帶進系統，箭頭向下才符合方向感（2026-08-13 Alvie 指定）
    html += '<button class="btn btn-secondary" id="btnImport">' + icon("download") + '匯入</button>';
    html += '<button class="btn btn-primary" id="btnNewAccount">' + icon("plus") + '新增帳號</button>';
    html += '</div>';
    return html;
  }

  function renderBulkBar() {
    if (!orgState.bulkMode) return "";
    const n = orgState.selectedIds.size;
    return '<div class="bulk-bar"><span class="bb-count">已選 ' + n + ' 筆</span>' +
      '<div class="bulk-bar-spacer"></div>' +
      '<button class="btn btn-secondary btn-sm" id="btnBulkDisable"' + (n === 0 ? " disabled" : "") + '>批次停用</button>' +
      '<button class="btn btn-secondary btn-sm" id="btnBulkEnable"' + (n === 0 ? " disabled" : "") + '>批次啟用</button>' +
      // 批次刪除刻意不用 .btn-secondary 這種盒狀樣式（跟停用/啟用同形只換色很容易誤觸），
      // 比照「取消」的文字連結形式、只換成危險色，形狀本身就跟另外兩個操作不一樣
      '<button class="btn-danger-text" id="btnBulkDelete"' + (n === 0 ? " disabled" : "") + '>批次刪除</button>' +
      '<button class="btn-text" id="btnBulkCancel">取消</button>' +
      '</div>';
  }

  // 三種空狀態分開判斷，文案/CTA 都不一樣（2026-08-12）：
  // ① 這個身份看得到的範圍裡完全沒帳號（全新公司／被清空）② 單純點了一個 0 帳號的部門
  // （沒有另外打字搜尋或選角色/狀態）③ 真的有下條件（搜尋/角色/狀態）但篩不出東西
  function renderAccountsList() {
    const all = filteredAccounts();
    if (all.length === 0) {
      const totalInScope = scopedAccounts().length;
      const hasSearchOrOtherFilter = orgState.search.trim() !== "" || orgState.roleFilter !== "all" || orgState.statusFilter !== "all";
      const deptOnlySelected = orgState.deptFilter !== "all" && !hasSearchOrOtherFilter;

      if (totalInScope === 0) {
        return '<div class="table-card"><div class="empty-state">' + icon("users") +
          '<p>還沒有任何子帳號，建立第一個子帳號開始管理</p>' +
          '<button class="btn btn-primary" id="btnNewAccountEmpty">' + icon("plus") + '新增帳號</button>' +
          '</div></div>';
      }
      if (deptOnlySelected) {
        const deptName = DEPARTMENTS.find(function (d) { return d.id === orgState.deptFilter; }).name;
        return '<div class="table-card"><div class="empty-state">' + icon("users") +
          '<p>「' + escAttr(deptName) + '」目前還沒有帳號</p>' +
          '<button class="btn btn-primary" id="btnNewAccountEmpty">' + icon("plus") + '新增帳號</button>' +
          '</div></div>';
      }
      return '<div class="table-card"><div class="empty-state">' + icon("search") +
        '<p>找不到符合條件的帳號</p>' +
        '<button class="btn btn-secondary" id="btnClearFilters">清除篩選</button>' +
        '</div></div>';
    }
    const bulkMode = orgState.bulkMode;
    // 只畫當前這一頁（2026-08-17 加分頁）；「共 N 筆」與空狀態判斷用的是未分頁的 all
    const list = pagedSlice(all, orgState);
    const rows = list.map(function (a) {
      const dept = a.deptId ? DEPARTMENTS.find(function (d) { return d.id === a.deptId; }).name : "—（總公司）";
      const statusBadge = a.status === "active"
        ? '<span class="badge-dot is-active"><span class="dot"></span>啟用</span>'
        : '<span class="badge-dot is-disabled"><span class="dot"></span>停用</span>';
      const manageable = a.role !== "companyAdmin";
      // 2026-08-13：刪除從列表拿掉（比照停用的收法，改進編輯抽屜底部），列表只留「編輯」，
      // 降低平常瀏覽時的誤觸風險——兩條刪除路徑（單筆／批次）都要多一個動作才會看到刪除按鈕
      const actions = '<button class="btn-text" data-edit="' + a.id + '">編輯</button>';
      const checkCell = bulkMode
        ? '<td class="col-check">' + (manageable ? checkboxHtml(' class="rowChk" data-id="' + a.id + '"', orgState.selectedIds.has(a.id)) : "") + '</td>'
        : "";
      // 2026-08-13 第五版：只有「帳號狀態」跟「操作」是真正的窄固定欄（內容本來就短、
      // 不該再更寬）。其餘 7 欄（姓名／帳號／部門／角色／員工編號／手機／E-mail）全部
      // 允許換行——員工編號／手機不再堅持「絕對不換行、寬度要蓋到 TECH-2024-0012／
      // 海外門號這種刻意插入的極端值」，欄寬改成蓋住 16 筆正常台灣資料，極端值換多幾行
      // 是允許的例外，不必為了它把其他欄擠爆。不截斷、不靠 tooltip，跟其他長度不定欄一致
      const empNoText = a.empNo || "—";
      const phoneText = dialDisplay(a.countryIso) + " " + a.phone;
      return '<tr>' + checkCell +
        '<td>' + statusBadge + '</td>' +
        '<td class="name-cell wrap-cell">' + escAttr(a.name) + '</td>' +
        '<td class="muted wrap-cell">' + escAttr(a.account) + '</td>' +
        '<td class="wrap-cell">' + escAttr(dept) + '</td>' +
        '<td class="wrap-cell">' + ROLES[a.role].label + '</td>' +
        '<td class="muted wrap-cell">' + empNoText + '</td>' +
        '<td class="muted wrap-cell">' + phoneText + '</td>' +
        '<td class="muted wrap-cell">' + escAttr(a.email) + '</td>' +
        '<td class="col-actions"><div class="row-actions">' + actions + '</div></td>' +
        '</tr>';
    }).join("");
    // 2026-08-12 第三版：欄寬全部改成「百分比」而不是固定 px，加總精確等於容器寬度，
    // 數學上不可能超出去，不需要靠橫向捲動或 sticky 補救。批次模式多一欄 checkbox，
    // 比例要重新分配，不能直接在原本 100% 之外加一欄，所以兩組比例分開算。
    // 2026-08-13 第六版：部門樹改成 chip 列後，表格在 1440 從 860px 拿回 1096px。
    // 16 筆正常資料要全部單行需要 1078px（各欄內容實測加總 790 ＋ 9 欄 × 32 padding），
    // 1096 剛好跨過門檻，所以這組比例是「每欄 = 實測內容最大值 + 32px padding」直接換算，
    // 不是憑感覺調的。多出來的 18px 全給 E-mail（最可能出現更長的真實值）。
    //   內容實測(px)：狀態58 姓名49 帳號89 部門98 角色82 員編51 手機132 信箱197 操作34
    //   表頭實測(px)：狀態62 姓名31 帳號31 部門62 角色31 員編62 手機31  信箱58  操作31（表頭 15px）
    //   ⚠️ 每欄取「內容」與「表頭」兩者的**較大值**再 +32 padding。第一版只看內容寬度，
    //      員工編號因此只拿到 83px（內容 51+32），但表頭「員工編號」四個字要 54px，
    //      結果表頭自己換行——欄寬校正一定要把表頭一起算進去。
    //      ⚠️ 表頭字級比較過 13/14/15/16，**每次改都要回來重算這組數字**。定案 15px：
    //      狀態(62>58)與員編(62>51)兩欄改由「表頭」決定寬度，各需 94px。
    //      （16px 試過但放棄：表頭再寬 8px 會把 E-mail 擠到 3 筆換行，總需求超出 5px）
    //   配置(px)：    94    81    121   130   114   94    164    232     66  = 1096
    // 極端值那列（Alexander／UAE 門號／TECH-2024-0012）仍會換行，是刻意的例外。
    // 批次模式多一欄 checkbox（4%），這 4% 全部從 E-mail 的餘裕扣，其他欄維持不變，
    // 避免動到已經零餘裕的狀態/手機欄。
    //
    // ⚠️ 為什麼要兩套比例：百分比會等比例縮放**每一欄**，所以「在 1096px 剛剛好」的比例
    // 拿到 936px（約 1280 視窗）用，會把已經零餘裕的狀態/角色/手機一起壓到換行。
    // 窄桌機改用另一套比例：短欄位照實際需求給足（配合 ≤1366px 的 padding 12px），
    // 差額集中由 E-mail 吸收、只有它換成兩行。
    const narrow = window.innerWidth <= 1366;
    const W = narrow
      ? (bulkMode
        // 936px／padding 24：短欄位 = max(內容, 表頭) + 24，餘額給 E-mail；批次的 4% 一樣從 E-mail 扣
        ? { check: 4, status: 9.19, name: 7.80, account: 12.07, dept: 13.03, role: 11.32, empNo: 9.19, phone: 16.67, email: 10.53, actions: 6.20 }
        : { status: 9.19, name: 7.80, account: 12.07, dept: 13.03, role: 11.32, empNo: 9.19, phone: 16.67, email: 14.53, actions: 6.20 })
      : (bulkMode
        ? { check: 4, status: 8.58, name: 7.39, account: 11.04, dept: 11.86, role: 10.40, empNo: 8.58, phone: 14.96, email: 17.17, actions: 6.02 }
        : { status: 8.58, name: 7.39, account: 11.04, dept: 11.86, role: 10.40, empNo: 8.58, phone: 14.96, email: 21.17, actions: 6.02 });
    const checkHeadCell = bulkMode ? '<th class="col-check" style="width:' + W.check + '%">' + checkboxHtml(' id="selectAllChk"', false) + '</th>' : "";
    return '<div class="table-card"><div class="table-scroll"><table class="data-table is-interactive acct-table"><thead><tr>' + checkHeadCell +
      '<th style="width:' + W.status + '%">帳號狀態</th><th style="width:' + W.name + '%">姓名</th><th style="width:' + W.account + '%">帳號</th>' +
      '<th style="width:' + W.dept + '%">所屬部門</th><th style="width:' + W.role + '%">角色</th><th style="width:' + W.empNo + '%">員工編號</th>' +
      '<th style="width:' + W.phone + '%">手機</th><th style="width:' + W.email + '%">E-mail</th><th class="col-actions" style="width:' + W.actions + '%">操作</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      // 分頁列放在卡片內底部（跟操作紀錄頁同一個位置：.table-scroll 之後、.table-card 之內）
      renderAccountsPager(all.length) + '</div>';
  }
  function renderAccountsPager(total) {
    return renderPagerBar({
      ddId: "acctPageSize", st: orgState,
      total: total,                    // 篩選後的總筆數（部門膠囊＋查詢＋角色/狀態都算進去）
      refresh: refreshAccountsList
    });
  }

  // 2026-08-11 第四輪：部門管理員原本看到的是一整條橘色警示 banner（「目前身份僅能管理…」），
  // Alvie 覺得太重，改成跟企業管理員點部門樹時同一種輕量小字（icon+部門名稱+主管），
  // 兩處共用同一個 renderer，不同身份看到的資訊呈現方式統一
  function renderDeptContextLine(deptId) {
    const dept = DEPARTMENTS.find(function (d) { return d.id === deptId; });
    if (!dept) return "";
    const manager = dept.managerId ? ACCOUNTS.find(function (a) { return a.id === dept.managerId; }) : null;
    return '<div class="dept-context">' + icon("users") + dept.name + ' · 主管：' + (manager ? manager.name : "未指派") + '</div>';
  }
  function renderDeptContext() {
    if (orgState.deptFilter === "all") return "";
    return renderDeptContextLine(orgState.deptFilter);
  }

  /* ============================================================
     最小 xlsx 讀取器（零外部依賴，2026-08-14）
     xlsx 本質是 zip + XML，瀏覽器原生的 DecompressionStream('deflate-raw') 與 DOMParser
     就足以解析，不必為了匯入掛一個 900KB 的 SheetJS——這支原型全站零 CDN 依賴，
     CDN 掛掉時匯入功能會整個消失，不划算。
     支援：標準 zip（stored / deflate）、sharedStrings、inlineStr。
     不支援：zip64（>4GB）、加密檔案——帳號匯入不會遇到。
     ============================================================ */
  async function xlsxInflateRaw(bytes) {
    const ds = new DecompressionStream("deflate-raw");
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  async function xlsxUnzip(buf, wanted) {
    const dv = new DataView(buf);
    const u8 = new Uint8Array(buf);
    const u16 = function (o) { return dv.getUint16(o, true); };
    const u32 = function (o) { return dv.getUint32(o, true); };
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= 0 && i > buf.byteLength - 65558; i--) {
      if (u32(i) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd === -1) throw new Error("NOT_ZIP");
    const count = u16(eocd + 10);
    let p = u32(eocd + 16);
    const out = {};
    for (let n = 0; n < count; n++) {
      if (u32(p) !== 0x02014b50) break;
      const method = u16(p + 10);
      const compSize = u32(p + 20);
      const nameLen = u16(p + 28);
      const extraLen = u16(p + 30);
      const commentLen = u16(p + 32);
      const localOffset = u32(p + 42);
      const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen));
      if (wanted.indexOf(name) !== -1) {
        // local header 的 filename／extra 長度可能跟 central directory 不同，要重讀
        const dataStart = localOffset + 30 + u16(localOffset + 26) + u16(localOffset + 28);
        const raw = u8.subarray(dataStart, dataStart + compSize);
        out[name] = method === 0 ? raw : await xlsxInflateRaw(raw);
      }
      p += 46 + nameLen + extraLen + commentLen;
    }
    return out;
  }
  function xlsxParseXml(bytes) {
    return new DOMParser().parseFromString(new TextDecoder().decode(bytes), "application/xml");
  }
  function xlsxSharedStrings(bytes) {
    if (!bytes) return [];
    const doc = xlsxParseXml(bytes);
    return Array.prototype.map.call(doc.getElementsByTagName("si"), function (si) {
      const ts = si.getElementsByTagName("t");
      let out = "";
      for (let i = 0; i < ts.length; i++) out += ts[i].textContent;
      return out;
    });
  }
  function xlsxColIndex(ref) {
    let i = 0;
    for (let k = 0; k < ref.length; k++) {
      const c = ref.charCodeAt(k);
      if (c >= 65 && c <= 90) i = i * 26 + (c - 64); else break;
    }
    return i - 1;
  }
  function xlsxParseSheet(bytes, shared) {
    const doc = xlsxParseXml(bytes);
    const rowEls = doc.getElementsByTagName("row");
    const rows = [];
    for (let i = 0; i < rowEls.length; i++) {
      const cells = rowEls[i].getElementsByTagName("c");
      const arr = [];
      for (let j = 0; j < cells.length; j++) {
        const c = cells[j];
        const ref = c.getAttribute("r") || "";
        const type = c.getAttribute("t");
        let value = "";
        if (type === "inlineStr") {
          const ts = c.getElementsByTagName("t");
          for (let k = 0; k < ts.length; k++) value += ts[k].textContent;
        } else {
          const v = c.getElementsByTagName("v")[0];
          if (v) value = type === "s" ? (shared[parseInt(v.textContent, 10)] || "") : v.textContent;
        }
        const idx = ref ? xlsxColIndex(ref) : arr.length;
        while (arr.length < idx) arr.push("");   // 補回 Excel 省略的空儲存格
        arr[idx] = value;
      }
      rows.push(arr);
    }
    return rows;
  }
  // 只讀第一個工作表（範例檔的「帳號匯入清單」）；填錯工作表由標頭檢查擋下
  async function readXlsxRows(arrayBuffer) {
    const files = await xlsxUnzip(arrayBuffer, ["xl/sharedStrings.xml", "xl/worksheets/sheet1.xml"]);
    const sheet = files["xl/worksheets/sheet1.xml"];
    if (!sheet) throw new Error("NO_SHEET");
    return xlsxParseSheet(sheet, xlsxSharedStrings(files["xl/sharedStrings.xml"]));
  }

  // ⚙️ 上限（config）：正式版應由後端設定

     匯入驗證（2026-08-14 正式版）：真的解析上傳的 xlsx、逐列套規則。
     規則完全依範例檔「欄位說明」那一頁，錯誤文案比照「新增帳號」表單的提示風格。
