<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>E8D 後台導覽結構原型</title>
<style>
  :root {
    /* ===== E8D Design System tokens ===== */
    --bg: #FCF8F2;           /* 實驗值：暖米白，非 E8D 現有 token */
    --surface: #FFFFFF;      /* color/bg/surface */
    --surface-2: #F3EDE4;    /* 實驗值：暖灰，取代原本偏藍的 neutral/100 */
    --border: #E7E0D5;       /* 實驗值：暖灰邊框，取代原本偏藍的 neutral/200 */
    --text: #2C2324;         /* 實驗值：暖黑，取代原本偏藍的 neutral/700 */
    --text-muted: #79706A;   /* 實驗值：暖中灰，取代原本偏藍的 neutral/500 */
    --text-disabled: #A79E97;/* 實驗值：暖淺灰，取代原本偏藍的 neutral/400 */
    --accent: #FF6416;       /* color/bg/primary · primary/700 */
    --accent-hover: #FB5C13; /* primary/800 */
    --accent-active: #F04D0A;/* primary/900 */
    --accent-contrast: #FFFFFF; /* color/text/on-brand */
    --accent-soft: #FFEADE;  /* primary/75 · bg/selected 同款淡橘 */
    --phase2: #FE9B0E;       /* color/text/warning */
    --phase2-soft: #FFF7E1;  /* color/bg/warning */
    --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-full: 999px;
    /* 儀表板卡片專用：仿 Horizon UI 的大圓角＋柔擴散陰影（比 E8D 設計系統定案的 12px 上限大） */
    --radius-xl: 20px;
    --shadow-card: 0 18px 40px rgba(44,35,36,.07), 0 2px 8px rgba(44,35,36,.04);
    --shadow-sm: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --shadow-md: 0 4px 8px rgba(16,24,40,.06), 0 2px 4px rgba(16,24,40,.04);
    --shadow-lg: 0 12px 28px rgba(16,24,40,.14), 0 4px 10px rgba(16,24,40,.08);
    --shadow: var(--shadow-md); /* 沿用既有變數名稱，映射到 md 供 popover 使用 */
    --font-ui: "Inter", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
    /* chart 進場動畫：時長／easing 統一由這兩個 token 控制，不要各 chart 各自寫死 */
    --chart-anim-duration: 700ms;
    --chart-anim-easing: ease-out;
    /* KPI 數字 count-up 專用（1-1.5s 區間內，比 chart 進場動畫慢，數字用同一顆 ease-out） */
    --kpi-anim-duration: 1200ms;
    /* 側邊選單展開箭頭旋轉：互動動畫，比進場動畫快很多 */
    --nav-chev-duration: 180ms;
    --nav-chev-easing: ease;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  button { font-family: inherit; font-size: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .shell { display: flex; min-height: 100vh; position: relative; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 264px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    transition: width .12s ease-out;
  }
  .sidebar.collapsed {
    width: 0; min-width: 0; border-right: none; overflow: hidden;
  }
  .sidebar-brand {
    height: 68px;
    display: flex;
    align-items: center;
    padding: 0 22px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .nav-scroll { padding: 16px 14px 20px; display: flex; flex-direction: column; gap: 4px;
    transition: opacity .08s ease; }
  .points-card, .sidebar-hint { transition: opacity .08s ease; }
  .sidebar.collapsed .nav-scroll,
  .sidebar.collapsed .points-card,
  .sidebar.collapsed .sidebar-hint { opacity: 0; }

  /* ---------- topbar 品牌區（收合鈕常駐；logo＋分隔線只在側欄收合時才出現） ---------- */
  .topbar-brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .brand-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
  .topbar-brand .brand-logo,
  .topbar-brand .brand-divider { display: none; }
  .shell.sidebar-collapsed .topbar-brand .brand-logo { display: block; }
  .shell.sidebar-collapsed .topbar-brand .brand-divider { display: block; }
  .sidebar-toggle {
    width: 44px; height: 44px; border-radius: var(--radius-md); border: none; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted);
    flex-shrink: 0;
  }
  .sidebar-toggle:hover { background: var(--surface-2); color: var(--text); }
  .sidebar-toggle .ico { width: 21px; height: 21px; }

  .nav-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-md);
    border: none;
    background: transparent;
    text-align: left;
    cursor: pointer;
    color: var(--text);
    transition: background .12s ease;
  }
  .nav-row:hover { background: var(--accent-soft); }
  .nav-row.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-row .ico { flex-shrink: 0; width: 18px; height: 18px; opacity: .85; }
  .nav-row.active .ico { opacity: 1; }
  .nav-row .label { flex: 1; font-size: 15px; }
  /* 預設指下（暗示點了會往下展開），展開後轉 180 度變指上（暗示點了會收合回去）——
     跟子項目往下展開的方向一致，不是 360 度繞一圈的裝飾轉場 */
  .nav-row .chev { width: 14px; height: 14px; flex-shrink: 0; opacity: .55; transition: transform var(--nav-chev-duration) var(--nav-chev-easing); }
  .nav-row[aria-expanded="true"] .chev { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) {
    .nav-row .chev { transition: none; }
  }
  .nav-row .ext-mark { width: 12px; height: 12px; opacity: .5; flex-shrink: 0; }

  .nav-group-children {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 4px 0 8px 14px;
    margin-left: 15px;
    border-left: 1px solid var(--border);
  }
  .nav-child {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: var(--radius-md);
    border: none;
    background: transparent;
    text-align: left;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 14px;
  }
  .nav-child:hover { background: var(--accent-soft); color: var(--text); }
  .nav-child.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-child .label { flex: 1; }
  .p2-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--phase2);
    background: var(--phase2-soft);
    padding: 1px 5px;
    border-radius: var(--radius-sm);
    flex-shrink: 0;
  }

  /* ---------- 側欄點數卡（全域元件） ---------- */
  /* 漸層定案（2026-07-28）：D 版 mesh — feralui 的 radial mesh 結構 + E8D primary 色階，
     淺點 #FFF1CF／#FFC08E、主色橘 #FF6416、底色 #F9935C；文字沿用 --text（neutral/700 暖黑）*/
  .points-card {
    position: relative;
    overflow: hidden;
    margin: auto 14px 16px;
    border-radius: var(--radius-lg);
    background: #F9935C;
    color: var(--text);
    padding: 18px 18px 16px;
    box-shadow: var(--shadow-lg);
  }
  .points-card > * { position: relative; z-index: 2; }
  .points-card::before {
    content: ''; position: absolute; inset: -14px; z-index: 1; pointer-events: none;
    background:
      radial-gradient(66% 50% at 6% 6%, #FFF1CF 0%, #FFF1CF 16%, #FFF1CF00 66%),
      radial-gradient(58% 64% at 94% 14%, #FFC08E 0%, #FFC08E00 70%),
      radial-gradient(88% 78% at 40% 104%, #FF6416 0%, #FF6416 26%, #FF641600 76%),
      radial-gradient(130% 120% at 30% 20%, #F9935C, #F9935C);
    filter: blur(7px);
  }
  .points-card .pc-silk {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(114deg,
      rgba(255,255,255,0) 18%, rgba(255,255,255,.62) 28%,
      rgba(255,255,255,.12) 35%, rgba(255,255,255,0) 42%);
  }
  .points-card .pc-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding-bottom: 10px; margin-bottom: 10px;
    border-bottom: 1px solid rgba(44,35,36,.16);
  }
  .points-card .pc-name { font-weight: 700; font-size: 14px; }
  .points-card .pc-plan {
    font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
    background: rgba(44,35,36,.12); padding: 2px 9px; border-radius: 999px;
  }
  .points-card .pc-label {
    display: flex; align-items: center; gap: 5px;
    font-size: 11.5px; color: rgba(44,35,36,.72); margin-bottom: 2px;
  }
  .points-card .pc-label .ico { width: 12px; height: 12px; opacity: .7; }
  .points-card .pc-value { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  .points-card .pc-value .unit { font-size: 11.5px; font-weight: 500; opacity: .7; margin-left: 3px; }
  .points-card .pc-usage-row {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 11.5px; font-weight: 500; margin-bottom: 5px; color: rgba(44,35,36,.75);
  }
  .points-card .pc-usage-row .num { font-variant-numeric: tabular-nums; }
  .points-card .pc-bar {
    height: 5px; border-radius: 999px; background: rgba(44,35,36,.18);
    overflow: hidden; margin-bottom: 12px;
  }
  .points-card .pc-bar span { display: block; height: 100%; width: 62%; border-radius: 999px; background: #fff; }
  .points-card .pc-topup {
    position: relative;
    width: 100%; padding: 9px 0; border-radius: var(--radius-md);
    border: none; background: #fff;
    color: var(--accent); font-weight: 700; font-size: 13px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.10);
    overflow: hidden;
  }
  .points-card .pc-topup span { position: relative; z-index: 2; }
  .points-card .pc-topup::before {
    content: ""; position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: #FFF4EC;
    transition: left .35s ease;
  }
  .points-card .pc-topup:hover::before { left: 0; }
  .points-card .pc-topup:active { transform: scale(.94); }

  .sidebar-hint {
    padding: 12px 16px 16px;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  /* ---------- Topbar ---------- */
  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 68px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    gap: 12px;
  }
  .topbar-actions { display: flex; align-items: center; gap: 6px; position: relative; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: var(--radius-md); border: none; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted);
    position: relative;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn .ico { width: 21px; height: 21px; }
  .avatar-btn {
    width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--accent-contrast);
    border: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
    cursor: pointer; margin-left: 8px;
  }
  .popover {
    position: absolute; top: 50px; right: 0; width: 240px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
    padding: 12px 14px; font-size: 12.5px; color: var(--text-muted); z-index: 20; display: none;
  }
  .popover.open { display: block; }
  .popover .t { color: var(--text); font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .popover button.logout {
    margin-top: 8px; width: 100%; padding: 7px 0; border-radius: var(--radius-md); border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 12.5px;
  }
  .popover button.logout:hover { background: var(--bg); }

  /* ---------- Content ---------- */
  .content { flex: 1; overflow-y: auto; padding: 32px 40px 48px; }
  .proto-note {
    display: flex; gap: 10px; align-items: flex-start; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 18px; margin-bottom: 28px;
    font-size: 12.5px; color: var(--text-muted); max-width: 640px;
  }
  .proto-note .ico { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; color: var(--accent); }
  .proto-note b { color: var(--text); }

  .page-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-head h1 { font-size: 28px; line-height: 36px; font-weight: 700; margin: 0; text-wrap: balance; }
  .page-sub { font-size: 13.5px; color: var(--text-muted); margin: 8px 0 24px; }

  .tabbar { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 22px; flex-wrap: wrap; }
  .tab {
    padding: 11px 16px; font-size: 14px; color: var(--text-muted); background: none; border: none;
    border-bottom: 2px solid transparent; cursor: pointer; margin-bottom: -1px; white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .detail-note {
    font-size: 13px; color: var(--text-muted); margin: -6px 0 18px; max-width: 640px;
  }

  .flag-note {
    display: flex; gap: 8px; align-items: flex-start; background: var(--phase2-soft);
    border: 1px solid color-mix(in srgb, var(--phase2) 30%, transparent);
    border-radius: var(--radius-md); padding: 10px 12px; margin: 0 0 18px; font-size: 12.5px; color: var(--text);
    max-width: 640px;
  }
  .flag-note .ico { width: 15px; height: 15px; color: var(--phase2); flex-shrink: 0; margin-top: 1px; }

  .placeholder-card {
    border: 1.5px dashed var(--border); border-radius: var(--radius-lg); padding: 32px 24px; text-align: center;
    color: var(--text-muted); font-size: 13.5px; background: var(--surface); max-width: 640px;
  }
  .placeholder-card .big { font-size: 15px; color: var(--text); font-weight: 600; margin-bottom: 6px; }

  /* ---------- 總覽儀表板（2026-07-28 定案：TailAdmin/Horizon 版面結構 + E8D token） ---------- */
  /* 12 欄統一格線：兩列都在同一個 1180px 寬度內，且在第 6 欄對齊 —
     上列 = 統計 3 + 統計 3 + 合約 6，下列 = 趨勢圖 6 + 長條圖 6 */
  .dash-grid {
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px;
    max-width: 1180px; align-items: stretch;
  }
  .dash-grid > .span-3 { grid-column: span 3; }
  .dash-grid > .span-6 { grid-column: span 6; }
  @media (max-width: 1100px) {
    .dash-grid > .span-3 { grid-column: span 6; }
    .dash-grid > .span-6 { grid-column: span 12; }
  }
  @media (max-width: 600px) { .dash-grid > .span-3 { grid-column: span 12; } }

  .stat-card {
    background: var(--surface); border-radius: var(--radius-xl); padding: 22px 24px;
    box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .stat-card .s-icon {
    width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0;
  }
  .stat-card .s-icon .ico { width: 22px; height: 22px; }
  .stat-card .s-label { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
  .stat-card .s-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .stat-card .s-value { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1.1; }
  .stat-card .s-delta { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .stat-card .s-delta.up { color: #0C9D61; background: #E5F5EC; }
  .stat-card .s-delta.down { color: #EC2D30; background: #FFEBEE; }
  .stat-card .s-delta .ico { width: 10px; height: 10px; }
  .stat-card .s-compare { font-size: 11.5px; color: var(--text-muted); margin-top: 8px; }

  .chart-card { background: var(--surface); border-radius: var(--radius-xl); padding: 24px 24px 20px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; }
  .chart-card .cc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .chart-card h3 { font-size: 15px; font-weight: 700; color: var(--text); margin: 0; }
  .chart-card .cc-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

  .chart-period-tabs { display: flex; gap: 2px; background: var(--surface-2); border-radius: var(--radius-md); padding: 3px; flex-shrink: 0; }
  .chart-period-tabs button {
    border: none; background: none; padding: 6px 12px; font-size: 12.5px; font-weight: 600;
    color: var(--text-muted); border-radius: 6px; cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .chart-period-tabs button.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }

  .chart-wrap { position: relative; margin-top: 16px; flex: 1; display: flex; align-items: center; }
  .chart-wrap svg { display: block; width: 100%; flex: 1; height: auto; overflow: visible; }
  .chart-wrap text { font-family: var(--font-ui); }
  .chart-axis-label { font-size: 10.5px; fill: var(--text-muted); }
  .chart-grid line { stroke: var(--border); stroke-width: 1; }
  .chart-crosshair { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; }
  .chart-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; opacity: 0; pointer-events: none; }
  .chart-hit { fill: transparent; cursor: crosshair; }

  /* 進場動畫：線＋漸層是同一個 <g>（.chart-trend-shape），一起用 scaleY
     從基準線長到實際高度——線本身真的跟著長上來，不是只有漸層變化。
     用 @keyframes（不是 transition）——class 只在首次載入時由 JS 加上去，
     切換 tab 時 renderArea() 重建的新 SVG 不帶這個 class，預設就是完整態，不會播放。
     2026-07-31 修正：原本線用 stroke-dashoffset 左右畫出、area 用 scaleY 縱向長高，
     兩個方向不一致，線的動作太細微會被 area 蓋過去，看起來像「線沒動」。改成兩者
     包同一個 <g> 一起縱向長高 */
  .chart-trend-shape { transform-box: fill-box; transform-origin: bottom; }
  .chart-trend-shape.chart-anim-in {
    animation: chart-grow-trend var(--chart-anim-duration) var(--chart-anim-easing) both;
  }
  @keyframes chart-grow-trend {
    from { transform: scaleY(0); }
    to   { transform: scaleY(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .chart-trend-shape.chart-anim-in { animation: none; }
  }

  /* SMS/MMS 長條圖進場：每根 bar-mark（SMS＋MMS 一組）各自從基準線 scaleY 長高，
     全部同時開始（不做逐棒依序長高的演出），沿用發送趨勢圖同一組 token／同一個 keyframe */
  .bar-mark { transform-box: fill-box; transform-origin: bottom; }
  .bar-mark.chart-anim-in {
    animation: chart-grow-trend var(--chart-anim-duration) var(--chart-anim-easing) both;
  }
  @media (prefers-reduced-motion: reduce) {
    .bar-mark.chart-anim-in { animation: none; }
  }

  .chart-tooltip {
    position: absolute; pointer-events: none; z-index: 5; opacity: 0;
    background: var(--text); color: #fff; border-radius: 8px; padding: 8px 12px;
    font-size: 12px; white-space: nowrap; box-shadow: var(--shadow-lg);
    transform: translate(-50%, calc(-100% - 14px)); transition: opacity .1s ease; left: 0; top: 0;
  }
  .chart-tooltip .tt-label { color: rgba(255,255,255,.68); font-size: 11px; margin-bottom: 3px; }
  .chart-tooltip .tt-row { display: flex; align-items: center; gap: 6px; }
  .chart-tooltip .tt-row + .tt-row { margin-top: 3px; }
  .chart-tooltip .tt-key { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .chart-tooltip .tt-value { font-weight: 700; font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 10px; }

  .chart-legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .chart-legend .lg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .chart-legend .lg-key { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  .bar-mark { cursor: pointer; }
  .bar-mark path { transition: opacity .1s ease; }
  .bar-mark:hover path, .bar-mark:focus path { opacity: .78; }
  .bar-mark:focus { outline: none; }

  .contract-card { background: var(--surface); border-radius: var(--radius-xl); padding: 24px; box-shadow: var(--shadow-card); }
  .contract-card h3 { font-size: 15px; font-weight: 700; margin: 0 0 6px; color: var(--text); }
  .contract-card .cc-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 12px; }
  .contract-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .contract-row:last-child { border-bottom: none; padding-bottom: 0; }
  .contract-row dt { margin: 0; color: var(--text-muted); }
  .contract-row dd { margin: 0; color: var(--text); font-weight: 600; text-align: right; }


  .ext-card {
    display: flex; gap: 16px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 26px; max-width: 560px; box-shadow: var(--shadow-sm);
  }
  .ext-card .ico { width: 22px; height: 22px; color: var(--accent); flex-shrink: 0; margin-top: 2px; }
  .ext-card h2 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .ext-card p { margin: 0; font-size: 13.5px; color: var(--text-muted); }

  .toast {
    position: fixed; bottom: 22px; right: 22px; background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: var(--radius-md); font-size: 12.5px; box-shadow: var(--shadow-lg);
    opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .18s ease, transform .18s ease;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 767px) {
    .content { padding: 18px 16px 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<script>
(function () {
  "use strict";

  // ---- 全站圖示統一使用 Lucide（viewBox 24、stroke-width 2）----
  const ICONS = {
    home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',

    org: '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>',
    gear: '<path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/>',

    up: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',

  };
  function icon(name, extra) {
    // 2026-07-31 修正：extra 若帶 class="..."，原本會跟下面固定寫死的 class="ico"
    // 重複（HTML 對重複 attribute 只認第一個，後面的整串被丟棄，chev/ext-mark 這類
    // 附加 class 從沒真的生效過）。這裡先抽出 extra 裡的 class，換掉固定的 "ico"。
    extra = extra || '';
    const m = extra.match(/class="([^"]*)"/);
    const cls = m ? m[1] : 'ico';
    const rest = m ? extra.replace(m[0], '').trim() : extra;
    return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' + rest + '>' + ICONS[name] + '</svg>';
  }

  // ---- IA data, mirrors the E8D TO-BE FigJam tree ----
  const NAV = [

      { id: "param-send", label: "參數簡訊發送", tabs: ["SMS 參數簡訊發送", "MMS 參數訊息發送"],

    ]},
    { id: "reports", label: "訊息紀錄報表", kind: "group", icon: "chart", children: [

      { id: "manage-report", label: "管理報表", tabs: ["SMS 報表", "MMS 報表"],

    { id: "billing", label: "帳務與點數", kind: "group", icon: "card", children: [
      { id: "topup", label: "儲值", tabs: [], detail: "含級距價格表",
        flag: "未來需支援計費模式變體（後付客戶可能無需儲值）" },
      { id: "billing-manage", label: "帳單與帳務", phase2: true, tabs: ["儲值紀錄", "使用紀錄"] },
      { id: "subscription", label: "訂閱方案", phase2: true, tabs: ["合約概要", "使用扣款紀錄"] },
      { id: "invoice", label: "發票管理", phase2: true, tabs: [] },
      { id: "sub-points", label: "子帳號點數管理", tabs: ["立即撥點", "預約撥點"] },
      { id: "points-schedule-report", label: "撥點查詢", tabs: [] }
    ]},
    { id: "org", label: "組織與子帳號", kind: "group", icon: "org", children: [
      { id: "org-tree", label: "公司組織樹", tabs: [] },
      { id: "sub-account", label: "子帳號管理", tabs: ["部門維護", "部門主管", "部門所屬帳號"] }
    ]},
    { id: "settings", label: "設定", kind: "group", icon: "gear", children: [
      { id: "account-settings", label: "帳戶設定", tabs: ["公司資訊", "預約發送代表號", "個人資料", "密碼"] },
      { id: "advanced-settings", label: "進階設定", tabs: ["點數預警設定", "回覆轉寄", "國際簡訊", "發送回報設定", "發票資訊"] }
    ]}
  ];

  // ---- 總覽儀表板資料（2026-07-28 定案，數字彼此對齊：今日/昨日 = SMS+MMS 加總，
  //      本月總發送量 12,480 與側欄點數卡「本月發送量」一致） ----
  const DASH = {
    todaySent: { value: 520, prev: 470, prevLabel: "昨日" },
    monthSent: { value: 12480, prev: 11980, prevLabel: "上月" },
    trend: {
      week: {
        labels: ["6天前", "5天前", "4天前", "3天前", "2天前", "昨天", "今天"],
        values: [380, 410, 395, 430, 455, 470, 520],
        axisMax: 600, ticks: [0, 200, 400, 600]
      },
      month: {
        // 30 天示意資料，逐週微幅攀升
        values: [420,460,440,480,510,290,260, 440,470,455,495,525,300,270, 455,485,465,505,535,310,280, 470,500,480,520,300,470,500,480,520,500],
        labelEvery: 5, axisMax: 600, ticks: [0, 200, 400, 600]
      },
      quarter: { labels: ["5月", "6月", "7月"], values: [10800, 11980, 12480], axisMax: 15000, ticks: [0, 5000, 10000, 15000] }
    },
    smsMms: {
      labels: ["6天前", "5天前", "4天前", "3天前", "2天前", "昨天", "今天"],
      sms: [300, 330, 310, 340, 360, 370, 410],
      mms: [80, 80, 85, 90, 95, 100, 110]
    },
    contract: [
      { label: "簡訊單價（SMS）", value: "NT$0.8 / 則" },
      { label: "多媒體簡訊單價（MMS）", value: "NT$3.5 / 則" },
      { label: "合約期間", value: "2026/01/01–2026/12/31" }
    ]
  };

  // ---- 儀表板圖表：手刻 SVG（零外部依賴），色彩已用 dataviz skill 的驗證腳本跑過 CVD 檢查 ----
  function fmtNum(n) { return n.toLocaleString("en-US"); }

  // KPI 數字 count-up：只在首次載入跑，旁邊的百分比 badge 不滾（那是算好的靜態值）
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function countUp(el, target, duration) {
    const start = performance.now();
    (function tick(now) {
      const p = Math.min(1, (now - start) / duration);
      el.textContent = fmtNum(Math.round(target * easeOutCubic(p)));
      if (p < 1) requestAnimationFrame(tick);
    })(start);
  }
  function initStatCountUp() {
    const duration = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--kpi-anim-duration")) || 1200;
    document.querySelectorAll(".s-value[data-target]").forEach(function (el) {
      countUp(el, parseInt(el.getAttribute("data-target"), 10), duration);
    });
  }

  function smoothPath(pts) {
    if (pts.length < 2) return "";
    if (pts.length === 2) return "M" + pts[0].x + "," + pts[0].y + " L" + pts[1].x + "," + pts[1].y;
    let d = "M" + pts[0].x + "," + pts[0].y;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;
      const cp1x = p1.x + (p2.x - p0.x) / 6, cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6, cp2y = p2.y - (p3.y - p1.y) / 6;
      d += " C" + cp1x + "," + cp1y + " " + cp2x + "," + cp2y + " " + p2.x + "," + p2.y;
    }
    return d;
  }

  function roundedTopRectPath(x, y, w, h, r) {
    if (h <= 0) return "";
    r = Math.min(r, w / 2, h);
    return "M" + x + "," + (y + h) +
      " L" + x + "," + (y + r) +
      " Q" + x + "," + y + " " + (x + r) + "," + y +
      " L" + (x + w - r) + "," + y +
      " Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) +
      " L" + (x + w) + "," + (y + h) + " Z";
  }

  const AREA_VB = { w: 600, h: 220, left: 46, right: 14, top: 14, bottom: 34 };

  function buildAreaChart(period) {
    const cfg = DASH.trend[period];
    const values = cfg.values;
    const labels = cfg.labels || values.map(function (_, i) { return String(i + 1); });
    const labelEvery = cfg.labelEvery || 1;
    const vb = AREA_VB;
    const plotW = vb.w - vb.left - vb.right, plotH = vb.h - vb.top - vb.bottom;
    const n = values.length;

    const pts = values.map(function (v, i) {
      return {
        x: vb.left + (n === 1 ? 0 : (i / (n - 1)) * plotW),
        y: vb.top + plotH - (v / cfg.axisMax) * plotH,
        value: v, label: labels[i]
      };
    });

    const linePath = smoothPath(pts);
    const areaPath = linePath + " L" + pts[n - 1].x + "," + (vb.top + plotH) + " L" + pts[0].x + "," + (vb.top + plotH) + " Z";

    let gridHtml = "";
    cfg.ticks.forEach(function (t) {
      const y = vb.top + plotH - (t / cfg.axisMax) * plotH;
      gridHtml += '<line class="chart-grid" x1="' + vb.left + '" x2="' + (vb.w - vb.right) + '" y1="' + y + '" y2="' + y + '"/>' +
        '<text class="chart-axis-label" x="' + (vb.left - 8) + '" y="' + (y + 3.5) + '" text-anchor="end">' + fmtNum(t) + "</text>";
    });

    let xLabelHtml = "";
    pts.forEach(function (p, i) {
      if (i % labelEvery === 0 || i === n - 1) {
        xLabelHtml += '<text class="chart-axis-label" x="' + p.x + '" y="' + (vb.h - 10) + '" text-anchor="middle">' + p.label + "</text>";
      }
    });

    const gradDefs = '<defs><linearGradient id="areaGrad" gradientUnits="userSpaceOnUse" x1="0" y1="' + vb.top + '" x2="0" y2="' + (vb.top + plotH) + '">' +
      '<stop offset="0%" stop-color="#FF6416" stop-opacity="0.32"/>' +
      '<stop offset="55%" stop-color="#FF6416" stop-opacity="0.12"/>' +
      '<stop offset="100%" stop-color="#FF6416" stop-opacity="0"/>' +
      "</linearGradient></defs>";

    const svg = '<svg viewBox="0 0 ' + vb.w + " " + vb.h + '" aria-hidden="true">' + gradDefs +
      "<g>" + gridHtml + "</g>" + "<g>" + xLabelHtml + "</g>" +
      '<g class="chart-trend-shape">' +
        '<path d="' + areaPath + '" fill="url(#areaGrad)" stroke="none"/>' +
        '<path d="' + linePath + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      "</g>" +
      '<line class="chart-crosshair" id="areaCrosshair" x1="0" x2="0" y1="' + vb.top + '" y2="' + (vb.top + plotH) + '"/>' +
      '<circle class="chart-dot" id="areaDot" r="4.5"/>' +
      '<rect class="chart-hit" x="' + vb.left + '" y="' + vb.top + '" width="' + plotW + '" height="' + plotH + '"/>' +
      "</svg>";

    return { svg: svg, pts: pts, vb: vb };
  }

  function wireAreaChartInteractivity(svgEl, chart, seriesLabel) {
    const hit = svgEl.querySelector(".chart-hit");
    const crosshair = svgEl.querySelector("#areaCrosshair");
    const dot = svgEl.querySelector("#areaDot");
    const tooltip = svgEl.closest(".chart-wrap").querySelector(".chart-tooltip");
    const pts = chart.pts;

    function svgX(evt) {
      const pt = svgEl.createSVGPoint();
      pt.x = evt.clientX; pt.y = evt.clientY;
      const ctm = svgEl.getScreenCTM();
      if (!ctm) return null;
      return pt.matrixTransform(ctm.inverse()).x;
    }
    function nearestIndex(x) {
      let closest = 0, minDist = Infinity;
      pts.forEach(function (p, i) { const d = Math.abs(p.x - x); if (d < minDist) { minDist = d; closest = i; } });
      return closest;
    }
    function showAt(i) {
      const p = pts[i];
      crosshair.setAttribute("x1", p.x); crosshair.setAttribute("x2", p.x);
      crosshair.style.opacity = "1";
      dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y);
      dot.style.opacity = "1";
      tooltip.innerHTML = '<div class="tt-label">' + p.label + '</div>' +
        '<div class="tt-row"><span class="tt-key" style="background:var(--accent)"></span>' + seriesLabel +
        '<span class="tt-value">' + fmtNum(p.value) + " 則</span></div>";
      const rect = svgEl.getBoundingClientRect();
      const scaleX = rect.width / chart.vb.w, scaleY = rect.height / chart.vb.h;
      tooltip.style.left = (p.x * scaleX) + "px";
      tooltip.style.top = (p.y * scaleY) + "px";
      tooltip.style.opacity = "1";
    }
    function hide() { crosshair.style.opacity = "0"; dot.style.opacity = "0"; tooltip.style.opacity = "0"; }

    hit.addEventListener("pointermove", function (evt) { const x = svgX(evt); if (x !== null) showAt(nearestIndex(x)); });
    hit.addEventListener("pointerleave", hide);
  }

  const BAR_VB = { w: 600, h: 220, left: 10, right: 10, top: 14, bottom: 34 };

  function buildBarChart() {
    const cfg = DASH.smsMms;
    const labels = cfg.labels;
    const n = labels.length;
    const vb = BAR_VB;
    const plotW = vb.w - vb.left - vb.right, plotH = vb.h - vb.top - vb.bottom;
    const axisMax = 500, ticks = [0, 250, 500];
    const groupW = plotW / n, barGap = 5;
    const barW = Math.min(30, (groupW - barGap - 14) / 2);
    const baseline = vb.top + plotH;

    let barsHtml = "", xLabelHtml = "";
    const meta = [];
    labels.forEach(function (label, i) {
      const cx = vb.left + groupW * (i + 0.5);
      const smsX = cx - barGap / 2 - barW, mmsX = cx + barGap / 2;
      const smsV = cfg.sms[i], mmsV = cfg.mms[i];
      const smsH = (smsV / axisMax) * plotH, mmsH = (mmsV / axisMax) * plotH;

      barsHtml +=
        '<g class="bar-mark" tabindex="0" data-i="' + i + '" role="img" aria-label="' + label + " SMS " + smsV + " 則、MMS " + mmsV + ' 則">' +
          '<path d="' + roundedTopRectPath(smsX, baseline - smsH, barW, smsH, 4) + '" fill="url(#smsGrad)"/>' +
          '<path d="' + roundedTopRectPath(mmsX, baseline - mmsH, barW, mmsH, 4) + '" fill="url(#mmsGrad)"/>' +
        "</g>";
      xLabelHtml += '<text class="chart-axis-label" x="' + cx + '" y="' + (vb.h - 10) + '" text-anchor="middle">' + label + "</text>";
      meta.push({ x: cx, sms: smsV, mms: mmsV, label: label });
    });

    let gridHtml = "";
    ticks.forEach(function (t) {
      const y = vb.top + plotH - (t / axisMax) * plotH;
      gridHtml += '<line class="chart-grid" x1="' + vb.left + '" x2="' + (vb.w - vb.right) + '" y1="' + y + '" y2="' + y + '"/>';
    });

    // 漸層用 userSpaceOnUse：所有長條共用同一段垂直色階，短棒不會被壓縮成不同深淺
    const gradDefs = '<defs>' +
      '<linearGradient id="smsGrad" gradientUnits="userSpaceOnUse" x1="0" y1="' + vb.top + '" x2="0" y2="' + baseline + '">' +
        '<stop offset="0%" stop-color="#FF6416"/><stop offset="100%" stop-color="#FFA76B"/></linearGradient>' +
      '<linearGradient id="mmsGrad" gradientUnits="userSpaceOnUse" x1="0" y1="' + vb.top + '" x2="0" y2="' + baseline + '">' +
        '<stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#8FB8FA"/></linearGradient>' +
      "</defs>";

    const svg = '<svg viewBox="0 0 ' + vb.w + " " + vb.h + '" aria-hidden="true">' + gradDefs +
      "<g>" + gridHtml + "</g>" + barsHtml + "<g>" + xLabelHtml + "</g>" + "</svg>";

    return { svg: svg, vb: vb, meta: meta };
  }

  function wireBarChartInteractivity(svgEl, bar) {
    const tooltip = svgEl.closest(".chart-wrap").querySelector(".chart-tooltip");
    function showFor(i) {
      const m = bar.meta[i];
      tooltip.innerHTML = '<div class="tt-label">' + m.label + '</div>' +
        '<div class="tt-row"><span class="tt-key" style="background:var(--accent)"></span>SMS<span class="tt-value">' + fmtNum(m.sms) + " 則</span></div>" +
        '<div class="tt-row"><span class="tt-key" style="background:#3B82F6"></span>MMS<span class="tt-value">' + fmtNum(m.mms) + " 則</span></div>";
      const rect = svgEl.getBoundingClientRect();
      const scaleX = rect.width / bar.vb.w, scaleY = rect.height / bar.vb.h;
      tooltip.style.left = (m.x * scaleX) + "px";
      tooltip.style.top = (bar.vb.top * scaleY) + "px";
      tooltip.style.opacity = "1";
    }
    function hide() { tooltip.style.opacity = "0"; }
    svgEl.querySelectorAll(".bar-mark").forEach(function (g) {
      const i = parseInt(g.getAttribute("data-i"), 10);
      g.addEventListener("pointerenter", function () { showFor(i); });
      g.addEventListener("pointerleave", hide);
      g.addEventListener("focus", function () { showFor(i); });
      g.addEventListener("blur", hide);
    });
  }

  function buildStatCard(label, value, prev, prevLabel, iconName) {
    const delta = ((value - prev) / prev) * 100;
    const up = delta >= 0;
    const deltaStr = (up ? "+" : "") + delta.toFixed(1) + "%";
    return '<div class="stat-card span-3">' +
      '<div class="s-icon">' + icon(iconName) + "</div>" +
      "<div>" +
        '<div class="s-label">' + label + "</div>" +
        '<div class="s-row"><div class="s-value" data-target="' + value + '">0</div>' +
        '<span class="s-delta ' + (up ? "up" : "down") + '">' + icon(up ? "up" : "down") + deltaStr + "</span></div>" +
        '<div class="s-compare">較' + prevLabel + "（" + fmtNum(prev) + "）</div>" +
      "</div></div>";
  }

  function renderDashboardHTML() {
    const stats = buildStatCard("今日發送量", DASH.todaySent.value, DASH.todaySent.prev, DASH.todaySent.prevLabel, "send") +
      buildStatCard("本月總發送量", DASH.monthSent.value, DASH.monthSent.prev, DASH.monthSent.prevLabel, "stackedMail");

    const periods = [{ key: "week", label: "本週" }, { key: "month", label: "本月" }, { key: "quarter", label: "本季" }];
    const periodTabs = periods.map(function (p) {
      return '<button data-period="' + p.key + '" class="' + (p.key === "month" ? "active" : "") + '">' + p.label + "</button>";
    }).join("");

    const contractRows = DASH.contract.map(function (c) {
      return '<div class="contract-row"><dt>' + c.label + "</dt><dd>" + c.value + "</dd></div>";
    }).join("");

    return '<div class="page-head"><h1>總覽</h1></div>' +
      '<div class="dash-grid">' +
        stats +
        '<div class="contract-card span-6"><h3>合約摘要</h3><div class="cc-sub">目前僅支援儲值制</div>' + contractRows + "</div>" +
        '<div class="chart-card span-6"><div class="cc-head">' +
          '<div><h3>發送趨勢</h3><div class="cc-sub">SMS + MMS 合計發送量</div></div>' +
          '<div class="chart-period-tabs" id="periodTabs">' + periodTabs + "</div></div>" +
          '<div class="chart-wrap" id="areaChartWrap"><div class="chart-tooltip"></div></div></div>' +
        '<div class="chart-card span-6"><div class="cc-head"><div><h3>SMS / MMS 發送量</h3><div class="cc-sub">近 7 天</div></div></div>' +
          '<div class="chart-wrap" id="barChartWrap"><div class="chart-tooltip"></div></div>' +
          '<div class="chart-legend">' +
            '<span class="lg-item"><span class="lg-key" style="background:linear-gradient(180deg,#FF6416,#FFA76B)"></span>SMS</span>' +
            '<span class="lg-item"><span class="lg-key" style="background:linear-gradient(180deg,#3B82F6,#8FB8FA)"></span>MMS</span>' +
          "</div></div>" +
      "</div>";
  }

  function initDashboardCharts() {
    let currentPeriod = "month";
    function renderArea(period, animate) {
      const wrap = document.getElementById("areaChartWrap");
      const chart = buildAreaChart(period);
      wrap.innerHTML = chart.svg + '<div class="chart-tooltip"></div>';
      const svgEl = wrap.querySelector("svg");
      wireAreaChartInteractivity(svgEl, chart, "SMS+MMS");

      if (animate) {
        const shape = svgEl.querySelector(".chart-trend-shape");
        shape.classList.add("chart-anim-in");
      }
    }
    renderArea(currentPeriod, true);   // 只有首次載入要跑進場動畫
    document.getElementById("periodTabs").querySelectorAll("button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const p = btn.getAttribute("data-period");
        if (p === currentPeriod) return;
        currentPeriod = p;
        document.getElementById("periodTabs").querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b === btn); });
        renderArea(currentPeriod);   // 切換 tab 不傳 animate，不重跑
      });
    });

    function renderBar(animate) {
      const barWrap = document.getElementById("barChartWrap");
      const bar = buildBarChart();
      barWrap.innerHTML = bar.svg + '<div class="chart-tooltip"></div>';
      const svgEl = barWrap.querySelector("svg");
      wireBarChartInteractivity(svgEl, bar);
      if (animate) {
        svgEl.querySelectorAll(".bar-mark").forEach(function (g) { g.classList.add("chart-anim-in"); });
      }
    }
    renderBar(true);   // 只有首次載入要跑進場動畫（目前長條圖沒有會重建它的互動，先備著跟趨勢圖同一套規則）
  }

  const state = { activeTop: "overview", activeChildId: null, activeTabIndex: 0, expandedGroup: null };

  function findChild(group, childId) {
    return (group.children || []).find(function (c) { return c.id === childId; });
  }

  function render() {
    renderSidebar();
    renderContent();
  }

  function renderSidebar() {
    const scroll = document.getElementById("navScroll");
    let html = "";
    NAV.forEach(function (item) {
      if (item.kind === "group") {
        const expanded = state.expandedGroup === item.id;
        const isActiveGroup = state.activeTop === item.id;
        html += '<button class="nav-row' + (isActiveGroup && !expanded ? " active" : "") + '" data-group="' + item.id + '" aria-expanded="' + expanded + '">' +
          icon(item.icon) + '<span class="label">' + item.label + '</span>' + icon("chevDown", 'class="ico chev"') +
          '</button>';
        if (expanded) {
          html += '<div class="nav-group-children">';
          item.children.forEach(function (child) {
            const active = state.activeTop === item.id && state.activeChildId === child.id;
            html += '<button class="nav-child' + (active ? " active" : "") + '" data-group="' + item.id + '" data-child="' + child.id + '">' +
              '<span class="label">' + child.label + '</span>' +
              (child.phase2 ? '<span class="p2-badge">P2</span>' : '') +
              '</button>';
          });
          html += '</div>';
        }
      } else {
        const active = state.activeTop === item.id;
        html += '<button class="nav-row' + (active ? " active" : "") + '" data-top="' + item.id + '">' +
          icon(item.icon) + '<span class="label">' + item.label + '</span>' +
          (item.kind === "external" ? icon("external", 'class="ico ext-mark"') : "") +
          '</button>';
      }
    });
    scroll.innerHTML = html;

    scroll.querySelectorAll("[data-group]:not([data-child])").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const gid = btn.getAttribute("data-group");
        state.expandedGroup = state.expandedGroup === gid ? null : gid;
        if (state.expandedGroup === gid) {
          state.activeTop = gid;
          const group = NAV.find(function (n) { return n.id === gid; });
          if (!state.activeChildId || !findChild(group, state.activeChildId)) {
            state.activeChildId = group.children[0].id;
            state.activeTabIndex = 0;
          }
        }
        render();
      });
    });
    scroll.querySelectorAll("[data-child]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        state.activeTop = btn.getAttribute("data-group");
        state.activeChildId = btn.getAttribute("data-child");
        state.activeTabIndex = 0;
        render();
      });
    });
    scroll.querySelectorAll("[data-top]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.activeTop = btn.getAttribute("data-top");
        state.activeChildId = null;
        state.expandedGroup = null;
        state.activeTabIndex = 0;
        render();
        if (state.activeTop === "talkod") showToast("外部連結：實際點擊會另開 TalkOD 分頁");
      });
    });
  }

  function renderContent() {
    const content = document.getElementById("content");
    const topItem = NAV.find(function (n) { return n.id === state.activeTop; });

    const protoNote = '';

    if (topItem.kind === "dashboard") {
      content.innerHTML = protoNote + renderDashboardHTML();
      initDashboardCharts();
      initStatCountUp();
      return;
    }

    if (topItem.kind === "external") {
      content.innerHTML = protoNote +
        '<div class="ext-card">' + icon("external", 'style="width:22px;height:22px"') +
        '<div><h2>互動回覆簡訊（TalkOD）</h2><p>' + topItem.detail + ' 建議在側邊欄用外部連結圖示標示，讓使用者知道這不是站內頁面。</p></div></div>';
      return;
    }

    // group -> child
    const child = findChild(topItem, state.activeChildId) || topItem.children[0];

    let html = protoNote + '<div class="page-head"><h1>' + child.label +
      (child.phase2 ? '<span class="p2-badge" style="margin-left:8px;vertical-align:middle;">Phase 2</span>' : '') + '</h1></div>';

    if (child.tabs && child.tabs.length > 0) {
      let tabsHtml = '<div class="tabbar">';
      child.tabs.forEach(function (t, i) {
        const label = typeof t === "string" ? t : t.label;
        const tabIsPhase2 = typeof t === "object" && t.phase2;
        tabsHtml += '<button class="tab' + (i === state.activeTabIndex ? " active" : "") + '" data-tab="' + i + '">' + label +
          (tabIsPhase2 ? '<span class="p2-badge" style="margin-left:5px;">P2</span>' : '') + '</button>';
      });
      tabsHtml += '</div>';
      html += tabsHtml;
      if (child.detail) html += '<div class="detail-note">' + child.detail + '</div>';
      if (child.flag) html += '<div class="flag-note">' + icon("flag") + '<div>' + child.flag + '</div></div>';
      const activeTab = child.tabs[state.activeTabIndex];
      const activeTabLabel = typeof activeTab === "string" ? activeTab : activeTab.label;
      html += '<div class="placeholder-card"><div class="big">〔內容區〕' + activeTabLabel + '</div>此 Tab 對應原架構圖中的第三層節點，實際頁面內容之後再設計</div>';
    } else {
      if (child.detail) html += '<div class="detail-note">' + child.detail + '</div>';
      if (child.flag) html += '<div class="flag-note">' + icon("flag") + '<div>' + child.flag + '</div></div>';
      html += '<div class="placeholder-card"><div class="big">〔內容區〕' + child.label + '</div>此項目沒有下一層 Tab，直接是單一頁面</div>';
    }

    content.innerHTML = html;
    content.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.activeTabIndex = parseInt(btn.getAttribute("data-tab"), 10);
        renderContent();
      });
    });
  }

  // ---- topbar popovers ----
  function wirePopover(btnId, popId) {
    const btn = document.getElementById(btnId);
    const pop = document.getElementById(popId);
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      const willOpen = !pop.classList.contains("open");
      document.querySelectorAll(".popover.open").forEach(function (p) { p.classList.remove("open"); });
      if (willOpen) pop.classList.add("open");
    });
  }
  wirePopover("btnAnnounce", "popAnnounce");
  wirePopover("btnFaq", "popFaq");
  wirePopover("btnApi", "popApi");
  wirePopover("btnAvatar", "popAvatar");
  document.addEventListener("click", function () {
    document.querySelectorAll(".popover.open").forEach(function (p) { p.classList.remove("open"); });
  });
  document.getElementById("btnLogout").addEventListener("click", function (e) {
    e.stopPropagation();
    document.getElementById("popAvatar").classList.remove("open");
    showToast("已登出（示意）");
  });

  // ---- toast ----
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2400);
  }

  // ---- 側欄點數卡：儲值捷徑 ----
  document.getElementById("btnTopup").addEventListener("click", function () {
    state.activeTop = "billing";
    state.activeChildId = "topup";
    state.expandedGroup = "billing";
    state.activeTabIndex = 0;
    render();
    showToast("全域元件：點數卡的儲值捷徑，直達 帳務與點數 › 儲值");
  });

  // ---- 側邊欄收合 ----
  // 箭頭方向要跟著狀態換 icon（不用旋轉，否則面板的分隔線會跑到右邊，但側欄一直在左邊）
  const PANEL_ARROW = {
    close: '<path d="m16 15-3-3 3-3"/>',   // Lucide panel-left-close
    open:  '<path d="m14 9 3 3-3 3"/>'     // Lucide panel-left-open
  };
  document.getElementById("sidebarToggle").addEventListener("click", function () {
    const collapsed = document.getElementById("sidebar").classList.toggle("collapsed");
    document.getElementById("shell").classList.toggle("sidebar-collapsed");
    this.classList.toggle("active");
    document.getElementById("sidebarToggleIcon").innerHTML =
      '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>' +
      (collapsed ? PANEL_ARROW.open : PANEL_ARROW.close);
    this.setAttribute("aria-label", collapsed ? "展開側邊欄" : "收合側邊欄");
  });

  render();
})();
</script>

</body>
</html>
